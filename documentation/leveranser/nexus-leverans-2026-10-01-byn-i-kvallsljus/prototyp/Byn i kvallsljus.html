Y + CHAIR_H / 2, 0, cid + 'Stem');\\n      put(c, box(0.42, 0.4, 0.04), M.chair, 0, Y + CHAIR_H + 0.22, -0.2, cid + 'Back');\\n      seats.push({\\n        id: id + (k + 1), kind: 'twotop', seatIndex: seats.length, furnitureId: id,\\n        seatNodeId: cid, local: [sx, TWO_Z], seatHeight: CHAIR_H, seatSurfaceY: Y + CHAIR_H,\\n        facing: facing, approach: [sx, -3.25], lane: 'south'\\n      });\\n    }\\n  });\\n\\n  // Barstolarna sist, norr först.\\n  [1, -1].forEach(function (side) {\\n    STOOL_X.forEach(function (x, i) {\\n      const n = seats.length - 11;\\n      const sid = 'stool' + n;\\n      const z = side * STOOL_Z;\\n      const c = new THREE.Group();\\n      c.name = sid;\\n      c.position.set(x, 0, z);\\n      furniture.add(c);\\n      put(c, cyl(0.19, 0.05, 12), M.chair, 0, Y + STOOL_H, 0, sid + 'Seat');\\n      put(c, cyl(0.045, STOOL_H, 8), M.chair, 0, Y + STOOL_H / 2, 0, sid + 'Stem');\\n      put(c, cyl(0.17, 0.03, 12), M.brass, 0, Y + 0.02, 0, sid + 'Foot');\\n      seats.push({\\n        id: 'bar' + n, kind: 'bar', seatIndex: seats.length, furnitureId: side > 0 ? 'barCounterN' : 'barCounterS',\\n        seatNodeId: sid, local: [x, z], seatHeight: STOOL_H, seatSurfaceY: Y + STOOL_H,\\n        facing: side > 0 ? Math.PI : 0, approach: [x, side * 3.1], lane: side > 0 ? 'north' : 'south'\\n      });\\n    });\\n  });\\n  // Diskens ljus — bara helg.\\n  candle(-1.35, Y + bh + 0.05, BAR.z1 - 0.3, 'barN1', true);\\n  candle(0.9, Y + bh + 0.05, BAR.z1 - 0.3, 'barN2', true);\\n  candle(-1.35, Y + bh + 0.05, BAR.z0 + 0.3, 'barS1', true);\\n  candle(0.9, Y + bh + 0.05, BAR.z0 + 0.3, 'barS2', true);\\n\\n  // ── Ståplatser: barens östra kortände + två ståbord ───────────\\n  const standing: StandSpec[] = [];\\n  [-0.9, -0.3, 0.3, 0.9].forEach(function (z, k) {\\n    standing.push({ id: 'standBar' + (k + 1), kind: 'barEnd', local: [BAR.x1 + 0.45, z], facing: -Math.PI / 2, approach: [3.6, z], lane: 'spine' });\\n  });\\n  [[5.0, 2.9], [5.6, 4.6]].forEach(function (p, k) {\\n    const id = 'highTable' + (k + 1);\\n    table(id, p[0], p[1], 0.62, 0.62, 1.08, M.brass);\\n    candle(p[0], Y + 1.08 + 0.025, p[1], id, true);\\n    standing.push({ id: id + 'a', kind: 'highTable', local: [p[0] - 0.55, p[1]], facing: Math.PI / 2, approach: [p[0] - 0.9, p[1]], lane: 'spine' });\\n    standing.push({ id: id + 'b', kind: 'highTable', local: [p[0] + 0.55, p[1]], facing: -Math.PI / 2, approach: [p[0] + 0.9, p[1]], lane: 'spine' });\\n  });\\n  // Klädhängaren vid dörren — dit \\\"på väg att gå\\\" tittar.\\n  rectBox(furniture, M.brass, inX - 0.12, inX - 0.06, 1.1, 2.3, Y + 1.7, Y + 1.74, 'coatRail');\\n  rectBox(furniture, M.brass, inX - 0.12, inX - 0.06, 1.1, 1.14, Y, Y + 1.74, 'coatRailPostA');\\n  rectBox(furniture, M.brass, inX - 0.12, inX - 0.06, 2.26, 2.3, Y, Y + 1.74, 'coatRailPostB');\\n  // Värdpulten söder om dörrmattan (leverans 3, godkänd 2026-09-30). Framsidan mot dörren (+x).\\n  // 0,60 bred längs z, 0,45 djup längs x, 1,10 hög. Samma mått som tableware 'hostDesk'. Vasen står på den.\\n  rectBox(furniture, M.bar, 6.375, 6.825, -0.85, -0.25, Y, Y + 0.06, 'hostDeskPlinth');\\n  rectBox(furniture, M.bar, 6.395, 6.805, -0.83, -0.27, Y + 0.06, Y + 1.06, 'hostDesk');\\n  rectBox(furniture, M.barTop, 6.375, 6.825, -0.85, -0.25, Y + 1.06, Y + 1.10, 'hostDeskTop');\\n  rectBox(furniture, M.brass, 6.805, 6.811, -0.83, -0.27, Y + 0.91, Y + 0.93, 'hostDeskBrass');\\n\\n  // ── Vardagens koreografi (efter leverans 3) ──────────────────────\\n  // Trottoaren utanför dörren, där kön står. Samma höjd som golvet, en kantsten mot gatan.\\n  const paveM = mat('#4b433c', 0.95, 0), boardM = mat('#23221f', 0.9, 0), steelM = mat('#9a978f', 0.35, 0.6);\\n  floorPlate(furniture, paveM, halfW, halfW + 3.4, -halfD - 3.2, 2.8, 0, 'pavement');\\n  rectBox(furniture, M.wallCap, halfW + 3.4, halfW + 3.55, -halfD - 3.2, 2.8, Y - 0.02, Y + 0.1, 'kerb');\\n  // Tavlan på staffli söder om pulten, framsidan mot dörren (+x). Per skriver kvällens viner på den.\\n  rectBox(furniture, M.bar, 6.91, 6.95, -2.08, -2.04, Y, Y + 1.55, 'easelLegS');\\n  rectBox(furniture, M.bar, 6.91, 6.95, -1.46, -1.42, Y, Y + 1.55, 'easelLegN');\\n  rectBox(furniture, boardM, 6.95, 6.99, -2.05, -1.45, Y + 0.72, Y + 1.48, 'menuBoard');\\n  rectBox(furniture, M.brass, 6.95, 7.0, -2.07, -1.43, Y + 1.48, Y + 1.51, 'menuBoardTop');\\n  // Vinkylen i södra stråkets östra ände, glasdörren mot väster. Elin fyller den före öppning.\\n  // Stående och 1,45 m hög, så att den som fyller syns över norra disken från spelets kamera.\\n  rectBox(furniture, steelM, 2.0, 2.38, -1.15, -0.3, Y, Y + 1.45, 'barFridge');\\n  rectBox(furniture, mat('#3a4a4c', 0.15, 0.3, '#9fd0d0', 0.25), 1.985, 2.0, -1.1, -0.35, Y + 0.12, Y + 1.38, 'barFridgeGlass');\\n  rectBox(furniture, M.brass, 1.97, 1.985, -0.4, -0.37, Y + 0.6, Y + 1.0, 'barFridgeHandle');\\n\\n  const entrance: Vec2 = [inX - 0.55, 0];\\n  const waitingSpot: Vec2 = [halfW + 2.5, 0];\\n  const door: Vec2 = [halfW, 0];\\n  const faceDoor = function (p: Vec2) { return Math.atan2(door[0] - p[0], door[1] - p[1]); };\\n  const queueSpots: QueueSpot[] = [\\n    { id: 'queueIn1', side: 'inside', order: 1, local: [7.2, 0.3], facing: -Math.PI / 2 },\\n    { id: 'queueIn2', side: 'inside', order: 2, local: [7.3, 0.85], facing: -Math.PI / 2 }\\n  ];\\n  [[8.35, 0.1], [8.5, -1.8], [8.6, -3.7], [8.7, -5.6], [8.75, -7.5]].forEach(function (p, i) {\\n    queueSpots.push({ id: 'queueOut' + (i + 1), side: 'outside', order: i + 3, local: p as Vec2, facing: faceDoor(p as Vec2) });\\n  });\\n  const miseSpots: MiseSpot[] = [\\n    { id: 'board', role: 'host', local: [7.4, -1.75], facing: -Math.PI / 2, note: 'Framför tavlan. Per skriver kvällens viner.' },\\n    { id: 'fridge', role: 'sommelier', local: [1.55, -0.72], facing: Math.PI / 2, note: 'Framför vinkylen i södra stråkets östra ände.' },\\n    { id: 'store', role: 'sommelier', local: [-6.25, -1.9], facing: -Math.PI / 2, note: 'Vid vinkylen i förrådet, där backarna hämtas.' },\\n    { id: 'polish', role: 'bartender', local: [-0.9, -0.74], facing: Math.PI, note: 'Södra stråket, vänd mot disken. Glasen ställs på rad.' },\\n    { id: 'setTables', role: 'server', local: [-2.1, -3.85], facing: Math.PI, note: 'Norr om småborden. Dukar kuvert för kuvert.' }\\n  ];\\n\\n  const staffStations: StaffStation[] = [\\n    { id: 'bartender', role: 'bartender', local: [-0.9, -0.74], standHeight: 0, facing: 0, uniform: STAFF_UNIFORMS.bartender,\\n      note: 'Södra stråket, vänd mot vinväggen när hon häller, mot södra stolarna när hon serverar. Stråk 0,98 m.' },\\n    { id: 'sommelier', role: 'sommelier', local: [1.3, 0.74], standHeight: 0, facing: Math.PI / 2, uniform: STAFF_UNIFORMS.sommelier,\\n      note: 'Norra stråkets östra ände, vid bottleAnchor. Går ut på golvet med flaskan.' },\\n    { id: 'server', role: 'server', local: [KITCHEN.x1 + 0.5, 2.7], standHeight: 0, facing: -Math.PI / 2, uniform: STAFF_UNIFORMS.server,\\n      note: 'Utanför passluckan. Bär smårätter; vinet hämtas vid barens NO-hörn.' },\\n    { id: 'cookHot', role: 'cook', local: [-6.2, 3.9], standHeight: 0, facing: -Math.PI / 2, uniform: STAFF_UNIFORMS.kitchen,\\n      note: 'Varm station. Plancha under kåpa.' },\\n    { id: 'cookCold', role: 'cook', local: [-5.75, 4.5], standHeight: 0, facing: 0, uniform: STAFF_UNIFORMS.kitchen,\\n      note: 'Kallskänk. Ett steg från varm station — en kock kan ta båda en tisdag.' },\\n    { id: 'dish', role: 'dish', local: [-6.4, 2.75], standHeight: 0, facing: Math.PI, uniform: STAFF_UNIFORMS.kitchen,\\n      note: 'Diskplatsen. Delar köksuniform; rollen läses av platsen.' },\\n    { id: 'host', role: 'host', local: [6.1, -0.55], standHeight: 0, facing: Math.PI / 2, uniform: STAFF_UNIFORMS.host,\\n      note: 'Per bakom värdpulten, vänd mot dörren. Hovmästare och kvällens anmälda serveringsansvarige.' },\\n    { id: 'dj', role: 'dj', local: [DJ.cx + 0.45, DJ.cz - 0.45], standHeight: DJ.platform, facing: faceNW, uniform: STAFF_UNIFORMS.dj,\\n      note: 'Bakom pulten i SO-hörnet, 0,25 m upp, vänd mot det öppna golvet.' }\\n  ];\\n\\n  const parts: RoomParts = {\\n    turntable: turntable, roof: roof, walls: walls, wallUpper: wallUpper, interior: interior, bar: bar,\\n    wineWall: wineWall, shelfTargets: shelfTargets, djTarget: djTarget, flames: flames,\\n    weekendCandles: weekendCandles, djGlow: M.djGlow,\\n    glassAnchor: glassAnchor, passAnchor: passAnchor, bottleAnchor: bottleAnchor\\n  };\\n\\n  const room: WineBarRoom = {\\n    group: group, parts: parts, seats: seats, standing: standing, staffStations: staffStations,\\n    candles: candles, pendants: pendants, entrance: entrance, waitingSpot: waitingSpot,\\n    queueSpots: queueSpots, miseSpots: miseSpots,\\n    floorY: Y, capacity: TOTAL_SEATS, width: width, depth: depth, fits: fits, shortfall: shortfall,\\n    wineWallLevel: startLevel, mood: opts.mood ?? 'tidig',\\n    dispose: function () {\\n      materials.forEach(function (m) { m.dispose(); });\\n      group.removeFromParent();\\n    }\\n  };\\n  (room as any).bottleSlots = bottleSlots;\\n  setMood(room, room.mood);\\n  return room;\\n}\\n\\n// ---------- Lägen ----------\\n\\nexport function setWineWallLevel(room: WineBarRoom, level: WineWallLevel): void {\\n  room.wineWallLevel = level;\\n  room.parts.wineWall.bas.visible = level === 'bas';\\n  room.parts.wineWall.platina.visible = level === 'platina';\\n  // Flaskfästet följer väggens östra ände.\\n  room.parts.bottleAnchor.position.x = WINE_WALL[level].x1 - 0.1;\\n}\\n\\nexport function setMood(room: WineBarRoom, mood: MoodId): void {\\n  room.mood = mood;\\n  const weekend = mood === 'helg';\\n  room.parts.weekendCandles.forEach(function (c) { c.visible = weekend; });\\n  room.parts.djGlow.emissiveIntensity = weekend ? 1.4 : 0;\\n}\\n\\n/**\\n * Tallriken och lågorna. `phase` 0..1 vrider tallriken (skicka 0 när det\\n * inte spelas); `flicker` är valfri sekundräkning för lågorna. Allokerar inget.\\n */\\nexport function updateWineBarRoom(room: WineBarRoom, phase: number, flicker?: number): void {\\n  room.parts.turntable.rotation.y = (phase ?? 0) * Math.PI * 2;\\n  if (flicker === undefined) return;\\n  const f = room.parts.flames;\\n  for (let i = 0; i < f.length; i++) {\\n    const s = 1 + 0.12 * Math.sin(flicker * 9.1 + i * 1.7) + 0.06 * Math.sin(flicker * 23 + i);\\n    f[i].scale.set(1, s, 1);\\n  }\\n}\\n\\nconst _cam = new THREE.Vector3();\\n\\n/**\\n * Kapar väggarna på kamerasidan. Anropas när kameran vridits. En sida kapas\\n * när kameran står utanför den med mer än 0,5 m marginal — vid rakt\\n * ovanifrån kapas ingen, vid standardvinkeln kapas N och E.\\n */\\nexport function updateCutaway(room: WineBarRoom, camera: THREE.Object3D): WallSide[] {\\n  camera.getWorldPosition(_cam);\\n  room.group.worldToLocal(_cam);\\n  const hx = room.width / 2 + 0.5;\\n  const hz = room.depth / 2 + 0.5;\\n  const cut: Record<WallSide, boolean> = { E: _cam.x > hx, W: _cam.x < -hx, N: _cam.z > hz, S: _cam.z < -hz };\\n  const out: WallSide[] = [];\\n  (['N', 'S', 'E', 'W'] as WallSide[]).forEach(function (s) {\\n    room.parts.wallUpper[s].visible = !cut[s];\\n    if (cut[s]) out.push(s);\\n  });\\n  return out;\\n}\\n\\n// ---------- Gånggrafen ----------\\n\\nconst SPINE_X = 3.6;\\nconst NORTH_Z = 3.1;\\nconst SOUTH_Z = -3.25;\\nconst LOUNGE_INNER_Z = 4.45;\\n\\nexport function walkPathToSeat(room: WineBarRoom, seatId: string): Vec2[] {\\n  const seat = room.seats.find(function (s) { return s.id === seatId; });\\n  if (!seat) return [];\\n  const p: Vec2[] = [[room.entrance[0], room.entrance[1]], [SPINE_X, 0]];\\n  if (seat.kind === 'lounge') {\\n    const cx = LOUNGE_CX[seat.furnitureId === 'loungeATable' ? 0 : 1];\\n    const endX = seat.local[0] <= cx ? cx - 0.85 : cx + 0.85;\\n    p.push([SPINE_X, NORTH_Z], [endX, NORTH_Z], [endX, LOUNGE_INNER_Z], [seat.local[0], LOUNGE_INNER_Z]);\\n  } else if (seat.lane === 'north') {\\n    p.push([SPINE_X, NORTH_Z], [seat.local[0], NORTH_Z]);\\n  } else {\\n    p.push([SPINE_X, SOUTH_Z], [seat.local[0], SOUTH_Z]);\\n  }\\n  p.push([seat.local[0], seat.local[1]]);\\n  return p;\\n}\\n\\nexport function exitPathFromSeat(room: WineBarRoom, seatId: string): Vec2[] {\\n  const back = walkPathToSeat(room, seatId).slice().reverse();\\n  back.push([room.waitingSpot[0], room.waitingSpot[1]]);\\n  return back;\\n}\\n\\n/** Personalens väg kök → bar: köksdörren, sedan barens öppna västra ände. */\\nexport function staffPathKitchenToBar(): Vec2[] {\\n  return [[-5.1, 2.7], [-5.1, 1.2], [-4.2, 0.62], [-3.4, 0.62]];\\n}\\n\\n// ---------- Mätning ----------\\n\\nexport function measureWineBarRoom(room: WineBarRoom) {\\n  room.group.updateWorldMatrix(true, true);\\n  const bb = new THREE.Box3().setFromObject(room.parts.interior);\\n  const wall = new THREE.Box3().setFromObject(room.parts.walls);\\n  const split = { lounge: 0, bar: 0, twotop: 0 };\\n  room.seats.forEach(function (s) { (split as any)[s.kind]++; });\\n  const wwSpec = WINE_WALL[room.wineWallLevel];\\n  let djArea = 0;\\n  room.parts.interior.traverse(function (o) {\\n    if (o.name === 'djPlatform') {\\n      const t = new THREE.Box3().setFromObject(o);\\n      djArea = (t.max.x - t.min.x) * (t.max.z - t.min.z);\\n    }\\n  });\\n  return {\\n    footprint: [bb.max.x - bb.min.x, bb.max.z - bb.min.z] as Vec2,\\n    height: wall.max.y - wall.min.y,\\n    seatCount: room.seats.length,\\n    standingCount: room.standing.length,\\n    split: split,\\n    floorZones: ZONE_FLOORS.length,\\n    wineWall: {\\n      level: room.wineWallLevel,\\n      length: wwSpec.x1 - wwSpec.x0,\\n      height: wwSpec.height,\\n      tiers: wwSpec.tiers,\\n      bottles: (room as any).bottleSlots[room.wineWallLevel]\\n    },\\n    runway: (BAR.z1 - BAR.depth) - RACK_T / 2,\\n    djZoneArea: djArea,\\n    candles: room.candles.length,\\n    candlesLit: room.candles.filter(function (c) { return room.mood === 'helg' || !c.weekendOnly; }).length\\n  };\\n}\\n\\nfunction isShown(o: THREE.Object3D | null): boolean {\\n  while (o) { if (!o.visible) return false; o = o.parent; }\\n  return true;\\n}\\n\\n/**\\n * Siktlinjen: barstolarna till vinväggens hyllplan på sin sida, och alla\\n * platser till DJ:n. Kroppar ska ligga utanför room.group när provet körs.\\n */\\nexport function checkSightLines(room: WineBarRoom) {\\n  room.group.updateWorldMatrix(true, true);\\n  const ray = new THREE.Raycaster();\\n  const origin = new THREE.Vector3();\\n  const target = new THREE.Vector3();\\n  const dir = new THREE.Vector3();\\n  const tiers = room.parts.shelfTargets[room.wineWallLevel];\\n  function clear(node: THREE.Object3D, from: THREE.Vector3, allow: string[]): boolean {\\n    node.getWorldPosition(target);\\n    dir.copy(target).sub(from);\\n    const dist = dir.length();\\n    ray.set(from, dir.normalize());\\n    ray.far = dist - 0.12;\\n    const hits = ray.intersectObject(room.group, true);\\n    for (let h = 0; h < hits.length; h++) {\\n      const o = hits[h].object;\\n      if (!isShown(o) || o.name.indexOf('floor') === 0) continue;\\n      if (allow.some(function (a) { return o.name.indexOf(a) === 0; })) continue;\\n      return false;\\n    }\\n    return true;\\n  }\\n  const perSeat: { seatId: string; tiers: number; of: number; dj: boolean }[] = [];\\n  let barAll = 0;\\n  let seeDj = 0;\\n  let seeWall = 0;\\n  room.seats.forEach(function (s) {\\n    origin.set(s.local[0], eyeHeightForSeat(s), s.local[1]);\\n    room.group.localToWorld(origin);\\n    const side = s.local[1] > 0 ? 'N' : 'S';\\n    const mine = tiers.filter(function (t) { return t.name.slice(-1) === side; });\\n    let vis = 0;\\n    mine.forEach(function (t) { if (clear(t, origin, ['bottles_', 'shelfTier_', 'wineWall'])) vis++; });\\n    const d = clear(room.parts.djTarget, origin, ['candle']);\\n    if (s.kind === 'bar' && vis === mine.length) barAll++;\\n    if (vis > 0) seeWall++;\\n    if (d) seeDj++;\\n    perSeat.push({ seatId: s.id, tiers: vis, of: mine.length, dj: d });\\n  });\\n  return { perSeat: perSeat, barSeatsSeeingAllTiers: barAll, seatsSeeingWineWall: seeWall, seatsSeeingDj: seeDj };\\n}\\n\\n/**\\n * Specens kontroll före leverans, som kod: från den kamera som skickas, syns\\n * varje plats och varje station? Mäter mot huvudhöjd (sittande: sitsen +\\n * 0,95 m, stående: 1,55 m) — det är kalotten kameran läser. `extra` är\\n * hinder utanför rummet, t.ex. grannhusen. Kör updateCutaway först.\\n */\\nexport function checkCameraView(room: WineBarRoom, camera: THREE.Object3D, extra?: THREE.Object3D[]) {\\n  room.group.updateWorldMatrix(true, true);\\n  const ray = new THREE.Raycaster();\\n  const from = new THREE.Vector3();\\n  const to = new THREE.Vector3();\\n  const dir = new THREE.Vector3();\\n  camera.getWorldPosition(from);\\n  const targets = [room.group as THREE.Object3D].concat(extra ?? []);\\n  function test(local: Vec3): string | null {\\n    to.set(local[0], local[1], local[2]);\\n    room.group.localToWorld(to);\\n    dir.copy(to).sub(from);\\n    const dist = dir.length();\\n    ray.set(from, dir.normalize());\\n    ray.far = dist - 0.25;\\n    const hits = ray.intersectObjects(targets, true);\\n    for (let h = 0; h < hits.length; h++) {\\n      const o = hits[h].object;\\n      if (!isShown(o)) continue;\\n      if (/^(floor|candle|pendantCord)/.test(o.name)) continue;\\n      return o.name || 'namnlös';\\n    }\\n    return null;\\n  }\\n  const blocked: { id: string; by: string }[] = [];\\n  let seatsSeen = 0;\\n  room.seats.forEach(function (s) {\\n    const by = test([s.local[0], s.seatSurfaceY + 0.95, s.local[1]]);\\n    if (by) blocked.push({ id: s.id, by: by }); else seatsSeen++;\\n  });\\n  let stationsSeen = 0;\\n  room.staffStations.forEach(function (s) {\\n    const by = test([s.local[0], PLINTH_M + s.standHeight + 1.55, s.local[1]]);\\n    if (by) blocked.push({ id: s.id, by: by }); else stationsSeen++;\\n  });\\n  const e = test([room.entrance[0], PLINTH_M + 1.55, room.entrance[1]]);\\n  if (e) blocked.push({ id: 'entrance', by: e });\\n  return { seatsSeen: seatsSeen, seats: room.seats.length, stationsSeen: stationsSeen,\\n           stations: room.staffStations.length, entranceSeen: !e, blocked: blocked };\\n}\\n\\n/**\\n * Planritningens underlag: varje namngiven möbel och zon som rektangel i\\n * lokal XZ, läst ur samma meshar som renderas. Rektanglar är AABB — DJ-pulten\\n * står 45° vriden och ritas därför större än den är.\\n */\\nexport function planRects(room: WineBarRoom): { name: string; x0: number; x1: number; z0: number; z1: number; top: number }[] {\\n  room.group.updateWorldMatrix(true, true);\\n  const inv = new THREE.Matrix4().copy(room.group.matrixWorld).invert();\\n  const out: { name: string; x0: number; x1: number; z0: number; z1: number; top: number }[] = [];\\n  const b = new THREE.Box3();\\n  room.parts.interior.traverse(function (o: any) {\\n    if (!o.isMesh || o.isInstancedMesh || !isShown(o)) return;\\n    if (/^(candle|pendant|platter|bottle)/.test(o.name)) return;\\n    b.setFromObject(o).applyMatrix4(inv);\\n    out.push({ name: o.name, x0: b.min.x, x1: b.max.x, z0: b.min.z, z1: b.max.z, top: b.max.y });\\n  });\\n  return out;\\n}\\n\\nexport function resolveWorldPositions(room: WineBarRoom) {\\n  room.group.updateWorldMatrix(true, true);\\n  const v = new THREE.Vector3();\\n  function w(p: Vec2): Vec2 { v.set(p[0], 0, p[1]); room.group.localToWorld(v); return [v.x, v.z]; }\\n  return {\\n    seats: room.seats.map(function (s) { return w(s.local); }),\\n    standing: room.standing.map(function (s) { return w(s.local); }),\\n    staffStations: room.staffStations.map(function (s) { return w(s.local); }),\\n    entrance: w(room.entrance),\\n    waitingSpot: w(room.waitingSpot),\\n    queueSpots: room.queueSpots.map(function (s) { return w(s.local); }),\\n    miseSpots: room.miseSpots.map(function (s) { return w(s.local); })\\n  };\\n}\\n\",\"villageQueue.balance.ts\":\"// VILLAGE_QUEUE — kön vid spelarens dörr i byn (byn i kvällsljus, 2026-10-02).\\n// Läggs i frontend/src/sim/balance.ts bredvid QUEUE. PLATSHÅLLARE: alla tal är null tills Code sätter dem.\\n//\\n// Platserna är inte tal: kön står på rummets köplatser (wineBarRoom.ts room.queueSpots, i ordning efter\\n// `order`: dörrmattan queueIn1–2, sedan trottoaren queueOut1–5), och kön är aldrig längre än platserna.\\n// Ett sällskap som kommer när alla platser är tagna väljer en annan krog i byn (sim/village.ts choose).\\n//\\n// Prototypen (byKvallSim.js) fyller i null med PROTO_QUEUE för att kunna spelas. De värdena följer inte med.\\nexport const VILLAGE_QUEUE = {\\n  section: 'Servicen > Kön',\\n  openQuestion: 'F29',\\n  // När ett sällskap ställer sig i kö: när de som redan är inne plus sällskapet är fler än så här.\\n  // Förslag: rummets kapacitet (businessRoom.capacity, vinbaren 20), men det är Codes beslut.\\n  seats: null as number | null,\\n  // Hur länge ett sällskap står i kö innan det går hem, i spelsekunder. Den första i kön går aldrig.\\n  // Förslag: QUEUE.patienceSimSeconds med kunskapens tillägg (knowledgeInService.ts queuePatienceSeconds),\\n  // så att byn och servicen har samma tålamod.\\n  patienceSimSeconds: null as number | null,\\n  // Andelen tålamod kvar under vilken sällskapet spelar guest.queueImpatient i stället för guest.queueCalm\\n  // (vardagens koreografi §6). 0–1.\\n  impatientBelow: null as number | null\\n} as const;\\n\",\"varmScen.js\":\"// Den varma världen i 3D: scen, kamera, figurer (figureRig), rekvisita och rummen.\\n// Delas av \\\"Servicen som improvisation 3D\\\" och \\\"Byn och gasterna 3D\\\".\\nimport * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';\\nimport * as R from './figureRig.js';\\nexport { THREE, R };\\n\\nexport const LOOKS = {\\n  kock: { body: '#efe9dd', limb: '#3a3632', hat: 'toque' },\\n  servitor: { body: '#1f1a17', limb: '#1b1816', apron: '#efe4d0' },\\n  sommelier: { body: '#5b2226', limb: '#2a1c18', chain: true },\\n  hovmastare: { body: '#262a36', limb: '#1c1f28', lapel: true },\\n  bartender: { body: '#3b2a1f', limb: '#241a14', apron: '#9a6238' },\\n  student: { body: '#3f7390', limb: '#2f3a48', pack: '#d0773f' },\\n  medel: { body: '#8a7457', limb: '#4a4034' },\\n  medel2: { body: '#6f5a74', limb: '#3c3342' },\\n  medel3: { body: '#5f7a6a', limb: '#34443a' },\\n  hog: { body: '#1b1a20', limb: '#141318', scarf: '#c49a5a', hat: 'brim' },\\n  social: { body: '#b5485f', limb: '#6a2a38', shawl: '#f3c0ad' },\\n  miljardar: { body: '#e2ad33', limb: '#b8861c', gold: true, hat: 'brimGold' },\\n  civil: { body: '#4c5249', limb: '#2e322d', ear: true },\\n  rullstol: { body: '#5f7c5c', limb: '#34453a', chair: true }\\n};\\n\\nconst G = new Map();\\nfunction geo(k, f) { let g = G.get(k); if (!g) { g = f(); G.set(k, g); } return g; }\\nconst MC = new Map();\\nfunction mat(c, r = 0.8, m = 0, e) { const k = c + r + m + (e || ''); let x = MC.get(k); if (!x) { x = new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m }); if (e) { x.emissive = new THREE.Color(e); x.emissiveIntensity = 1.4; } MC.set(k, x); } return x; }\\nfunction mesh(g, m, x = 0, y = 0, z = 0, cast = true) { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true; return o; }\\nconst box = (w, h, d) => geo(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));\\nconst cyl = (a, b, h, s = 16) => geo(`c${a},${b},${h},${s}`, () => new THREE.CylinderGeometry(a, b, h, s));\\nconst sph = (r, s = 12) => geo(`s${r},${s}`, () => new THREE.SphereGeometry(r, s, Math.max(6, s - 4)));\\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\\n\\nlet GLOW = null;\\nexport function glowTexture() {\\n  if (GLOW) return GLOW;\\n  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');\\n  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,220,160,1)'); g.addColorStop(0.25, 'rgba(255,180,90,.55)'); g.addColorStop(1, 'rgba(255,15 dningsfel — anatomin behåller sina proportioner och\\n//      höjdkontraktet håller.\\n//   3. Namngivna ledreferenser + ankarpunkter (huvud, båda händer).\\n//\\n// 1,700 m är ett TAK, inte ett medelvärde: ingen pose lyfter kroppen\\n// över noll. Gångstuds, andning och vaggning svajar nedåt från\\n// hjässan, så en mätning i vyn aldrig läser mer än 1,700 m.\\n//\\n// SD-004 §3.3 (ORDER 141, merge 6bd7fb9): taket gäller PERSONAL.\\n// Gäster bär heightMult från sin arketyp och mäter 1,700 × mult.\\n// Multen sitter som uniform skala på 'body', inte i FIGURE-måtten —\\n// geometrin förblir delad, så fyrtio olika längder kostar fyrtio\\n// noder och noll extra buffertar. variant 'staff' tvingar mult = 1.\\n//\\n// Koordinater: rot i golvplanet, +Y uppåt, figuren tittar mot +Z.\\n// Alla mått i meter, samma som scenens världskoordinater.\\n// Alla ledvinklar i radianer. Positiv vinkel = framåt, i den\\n// riktning figuren tittar. Positiv `lift`/`spread` = utåt från\\n// kroppens mittlinje. Positiv `knee` = hälen bakåt (knät böjs bara\\n// åt ett håll).\\n\\n// HTML-modellens kopia: enda skillnaden mot figureRig.ts är den här\\n// import-raden (repot löser 'three' via bundlern) och att typerna är\\n// strippade. Logiken är identisk.\\nimport * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';\\n\\n\\n// ---------- mått ------------------------------------------------------\\n//\\n// Hjässan: hipY + torsoHeight + neckLength + 2 × headRadius\\n//        = 0,860 + 0,588 + 0,012 + 0,240 = 1,700 m exakt.\\n// Benet: thigh + shin + ankleY = 0,44 + 0,36 + 0,06 = 0,86 = hipY.\\n// Foten står i golvplanet (y = 0).\\n\\nexport const FIGURE = {\\n  /** Kanonhöjd. Personalens lås, och den höjd alla poser är författade mot. */\\n  totalHeight: 1.70,\\n  /** Gästens heightMult klipps hit: 1,19 m – 1,90 m. Undre gränsen är satt\\n   *  av barnets arketyp (0,72), inte av en vuxenkurva. */\\n  heightMultMin: 0.70,\\n  heightMultMax: 1.12,\\n  /** poseSeated:s hipDrop. applyPose läser den för att sitsankra skalade kroppar. */\\n  seatedHipDrop: 0.41,\\n  hipY: 0.86,\\n  torsoHeight: 0.588,\\n  neckLength: 0.012,\\n  headRadius: 0.12,\\n  shoulderY: 1.37,\\n  upperArm: 0.29,\\n  foreArm: 0.25,\\n  handLength: 0.09,\\n  thigh: 0.44,\\n  shin: 0.36,\\n  ankleY: 0.06,\\n  footLength: 0.22,\\n  footWidth: 0.10,\\n  footHeight: 0.06,\\n  hipHalfWidth: 0.09,\\n  armRadius: 0.045,\\n  legRadius: 0.062,\\n  neckRadius: 0.045,\\n  guestShoulderWidth: 0.46,\\n  staffShoulderWidth: 0.40,\\n  /** Bålens djup som andel av axelbredden. */\\n  torsoDepthRatio: 0.44,\\n  /** Höftpartiets bredd som andel av axelbredden. */\\n  waistRatio: 0.78,\\n  headAnchorOffset: 0.18\\n};\\n\\n// Delade geometrier. Skapas vid första riggen och återanvänds av alla\\n// figurer med samma variant — 40 figurer i rummet ska inte betyda 40\\n// uppsättningar buffertar. Frigörs med disposeFigureGeometry().\\nconst geometryCache = new Map();\\n\\nfunction cached(key, build) {\\n  let g = geometryCache.get(key);\\n  if (g === undefined) {\\n    g = build();\\n    geometryCache.set(key, g);\\n  }\\n  return g;\\n}\\n\\nexport function disposeFigureGeometry() {\\n  geometryCache.forEach(function (g) { g.dispose(); });\\n  geometryCache.clear();\\n}\\n\\nfunction darken(hex, amount) {\\n  const c = new THREE.Color(hex);\\n  c.multiplyScalar(1 - amount);\\n  return c.getStyle();\\n}\\n\\n/** Ett lemsegment: mesh som hänger nedåt från ledens origo. */\\nfunction limb(key, material, radius, length, taper) {\\n  const geo = cached(key, function () {\\n    return new THREE.CylinderGeometry(radius * taper, radius, length, 8);\\n  });\\n  const mesh = new THREE.Mesh(geo, material);\\n  mesh.position.y = -length / 2;\\n  return mesh;\\n}\\n\\nfunction joint(name, x, y, z) {\\n  const g = new THREE.Group();\\n  g.name = name;\\n  g.position.set(x, y, z);\\n  return g;\\n}\\n\\n// ---------- konstruktion ----------------------------------------------\\n//\\n// Byggs imperativt, en gång per figur. Ingen allokering sker sedan i\\n// applyPose — den skriver bara rotation/position på befintliga noder.\\n\\nexport function createFigureRig(options) {\\n  const opts = options ?? {};\\n  const variant = opts.variant ?? 'guest';\\n  let defaultWidth = FIGURE.guestShoulderWidth;\\n  if (variant === 'staff') defaultWidth = FIGURE.staffShoulderWidth;\\n  const shoulderWidth = opts.shoulderWidth ?? defaultWidth;\\n  // Personalen är höjdlåst; gästen skalas av sin arketyp.\\n  let heightMult = 1;\\n  if (variant !== 'staff' && opts.heightMult !== undefined) {\\n    heightMult = Math.min(FIGURE.heightMultMax, Math.max(FIGURE.heightMultMin, opts.heightMult));\\n  }\\n  const garmentColour = opts.garmentColour ?? '#c9c0a4';\\n  const limbColour = opts.limbColour ?? darken(garmentColour, 0.28);\\n  const skinColour = opts.skinColour ?? '#d8b48a';\\n  const anchorOffset = opts.headAnchorOffset ?? FIGURE.headAnchorOffset;\\n\\n  const garment = new THREE.MeshStandardMaterial({ color: garmentColour, roughness: 0.85 });\\n  const limbs = new THREE.MeshStandardMaterial({ color: limbColour, roughness: 0.9 });\\n  const skin = new THREE.MeshStandardMaterial({ color: skinColour, roughness: 0.9 });\\n  const materials = [garment, limbs, skin];\\n\\n  const depth = shoulderWidth * FIGURE.torsoDepthRatio;\\n  const waist = shoulderWidth * FIGURE.waistRatio;\\n  const shoulderHalf = shoulderWidth / 2 - FIGURE.armRadius;\\n  const key = variant + ':' + shoulderWidth.toFixed(3);\\n\\n  const root = joint('figureRoot', 0, 0, 0);\\n  const body = joint('body', 0, 0, 0);\\n  const pelvis = joint('pelvis', 0, FIGURE.hipY, 0);\\n  const chest = joint('chest', 0, 0, 0);\\n  root.add(body);\\n  // Uniform: en kortare gäst är proportionerligt mindre, inte tillplattad.\\n  // Skalan ligger under root, så root behåller rena världsmått för placering\\n  // och kurs — och headAnchor/handAnchor följer den verkliga kroppen, så pip\\n  // och föremål hamnar rätt utan egen korrigering.\\n  body.scale.setScalar(heightMult);\\n  body.add(pelvis);\\n  pelvis.add(chest);\\n\\n  // Bålen i två block: höftparti och bröstkorg. Båda hänger i chest,\\n  // så lutningen pivoterar i höftlinjen.\\n  const waistH = 0.24;\\n  const waistMesh = new THREE.Mesh(\\n    cached(key + ':waist', function () {\\n      return new THREE.BoxGeometry(waist, waistH, depth * 0.92);\\n    }),\\n    limbs\\n  );\\n  waistMesh.position.y = waistH / 2;\\n  chest.add(waistMesh);\\n\\n  const chestH = FIGURE.torsoHeight - waistH;\\n  const chestMesh = new THREE.Mesh(\\n    cached(key + ':chest', function () {\\n      return new THREE.BoxGeometry(shoulderWidth, chestH, depth);\\n    }),\\n    garment\\n  );\\n  chestMesh.position.y = waistH + chestH / 2;\\n  chest.add(chestMesh);\\n\\n  // Nacke → huvud. Inget ansikte: en sfär i hudton och en kalott i\\n  // garment-/uniformsfärg. Silhuettkontraktet — kameran ser hjässan\\n  // uppifrån, så färgen sitter där och inte på bröstet.\\n  const neck = joint('neck', 0, FIGURE.torsoHeight, 0);\\n  chest.add(neck);\\n  const neckMesh = new THREE.Mesh(\\n    cached(key + ':neck', function () {\\n      return new THREE.CylinderGeometry(\\n        FIGURE.neckRadius, FIGURE.neckRadius, FIGURE.neckLength, 8\\n      );\\n    }),\\n    skin\\n  );\\n  neckMesh.position.y = FIGURE.neckLength / 2;\\n  neck.add(neckMesh);\\n\\n  const head = joint('head', 0, FIGURE.neckLength, 0);\\n  neck.add(head);\\n  const headMesh = new THREE.Mesh(\\n    cached('head:sphere', function () {\\n      return new THREE.SphereGeometry(FIGURE.headRadius, 16, 12);\\n    }),\\n    skin\\n  );\\n  headMesh.position.y = FIGURE.headRadius;\\n  head.add(headMesh);\\n\\n  const crown = new THREE.Mesh(\\n    cached('head:crown', function () {\\n      return new THREE.SphereGeometry(\\n        FIGURE.headRadius * 1.03, 16, 8, 0, Math.PI * 2, 0, 1.15\\n      );\\n    }),\\n    garment\\n  );\\n  // Kalotten är 3 % större än huvudet för att undvika z-fighting, så\\n  // centret sänks med samma 3 % — skalet toppar då på exakt 2 × radien\\n  // och hjässan ligger kvar på 1,700 m i bounding box.\\n  crown.position.y = FIGURE.headRadius - FIGURE.headRadius * 0.03;\\n  head.add(crown);\\n\\n  const headAnchor = new THREE.Object3D();\\n  headAnchor.name = 'headAnchor';\\n  headAnchor.position.y = FIGURE.headRadius * 2 + anchorOffset;\\n  head.add(headAnchor);\\n\\n  // Armar. Två led: axel (framåt/bakåt + utåt) och armbåge.\\n  function buildArm(side, suffix) {\\n    const shoulder = joint(\\n      'shoulder' + suffix,\\n      side * shoulderHalf,\\n      FIGURE.shoulderY - FIGURE.hipY,\\n      0\\n    );\\n    shoulder.add(limb(key + ':upperArm', limbs, FIGURE.armRadius, FIGURE.upperArm, 0.92));\\n    const elbow = joint('elbow' + suffix, 0, -FIGURE.upperArm, 0);\\n    shoulder.add(elbow);\\n    elbow.add(limb(key + ':foreArm', limbs, FIGURE.armRadius * 0.88, FIGURE.foreArm, 0.9));\\n    const hand = joint('hand' + suffix, 0, -FIGURE.foreArm, 0);\\n    elbow.add(hand);\\n    const handMesh = new THREE.Mesh(\\n      cached('hand:box', function () {\\n        return new THREE.BoxGeometry(0.062, FIGURE.handLength, 0.05);\\n      }),\\n      skin\\n    );\\n    handMesh.position.y = -FIGURE.handLength / 2;\\n    hand.add(handMesh);\\n    // Fästet: grepppunkten i handen. Ett föremål monteras som barn\\n    // här (senare order) — riggen levererar bara ankaret.\\n    const anchor = new THREE.Object3D();\\n    anchor.name = 'handAnchor' + suffix;\\n    anchor.position.set(0, -FIGURE.handLength, 0.03);\\n    hand.add(anchor);\\n    chest.add(shoulder);\\n    return { shoulder: shoulder, elbow: elbow, hand: hand, anchor: anchor };\\n  }\\n\\n  const armL = buildArm(-1, 'L');\\n  const armR = buildArm(1, 'R');\\n\\n  // Ben. Två led: höft och knä, plus en fotled så steget kan rullas av.\\n  // Hänger i pelvis, inte i chest — bålens lutning flyttar inte benen.\\n  function buildLeg(side, suffix) {\\n    const hip = joint('hip' + suffix, side * FIGURE.hipHalfWidth, 0, 0);\\n    hip.add(limb(key + ':thigh', limbs, FIGURE.legRadius, FIGURE.thigh, 0.88));\\n    const knee = joint('knee' + suffix, 0, -FIGURE.thigh, 0);\\n    hip.add(knee);\\n    knee.add(limb(key + ':shin', limbs, FIGURE.legRadius * 0.86, FIGURE.shin, 0.82));\\n    const ankle = joint('ankle' + suffix, 0, -FIGURE.shin, 0);\\n    knee.add(ankle);\\n    const foot = new THREE.Mesh(\\n      cached('foot:box', function () {\\n        return new THREE.BoxGeometry(FIGURE.footWidth, FIGURE.footHeight, FIGURE.footLength);\\n      }),\\n      limbs\\n    );\\n    foot.position.set(0, -FIGURE.footHeight / 2, FIGURE.footLength / 2 - 0.055);\\n    ankle.add(foot);\\n    pelvis.add(hip);\\n    return { hip: hip, knee: knee, ankle: ankle };\\n  }\\n\\n  const legL = buildLeg(-1, 'L');\\n  const legR = buildLeg(1, 'R');\\n\\n  const joints = {\\n    root: root, body: body, pelvis: pelvis, chest: chest,\\n    neck: neck, head: head, headAnchor: headAnchor,\\n    shoulderL: armL.shoulder, elbowL: armL.elbow, handL: armL.hand, handAnchorL: armL.anchor,\\n    shoulderR: armR.shoulder, elbowR: armR.elbow, handR: armR.hand, handAnchorR: armR.anchor,\\n    hipL: legL.hip, kneeL: legL.knee, ankleL: legL.ankle,\\n    hipR: legR.hip, kneeR: legR.knee, ankleR: legR.ankle\\n  };\\n\\n  const rig = {\\n    root: root,\\n    joints: joints,\\n    variant: variant,\\n    shoulderWidth: shoulderWidth,\\n    heightMult: heightMult,\\n    totalHeight: FIGURE.totalHeight * heightMult,\\n    materials: materials,\\n    garment: garment\\n  };\\n  applyPose(rig, poseIdle(0));\\n  return rig;\\n}\\n\\n/** Materialen är per figur; geometrin är delad. */\\nexport function disposeFigureRig(rig) {\\n  rig.materials.forEach(function (m) { m.dispose(); });\\n  rig.root.removeFromParent();\\n}\\n\\n// ---------- applicering -----------------------------------------------\\n\\nfunction applyArm(shoulder, elbow, arm, side) {\\n  const a = arm ?? {};\\n  shoulder.rotation.set(-(a.swing ?? 0), 0, side * (a.lift ?? 0));\\n  elbow.rotation.x = -(a.elbow ?? 0);\\n}\\n\\nfunction applyLeg(hip, knee, ankle, leg, side) {\\n  const l = leg ?? {};\\n  hip.rotation.set(-(l.swing ?? 0), 0, side * (l.spread ?? 0));\\n  knee.rotation.x = l.knee ?? 0;\\n  ankle.rotation.x = -(l.ankle ?? 0);\\n}\\n\\n/**\\n * Skriver en pose på riggen. Allokerar inget — säker att anropa varje\\n * bildruta för varje figur i rummet.\\n */\\nexport function applyPose(rig, pose) {\\n  const j = rig.joints;\\n  const hipDrop = pose.hipDrop ?? 0;\\n  // Sitsen är rummets mått, inte kroppens: en kort gäst ska ha höften på\\n  // samma sits som en lång. hipDrop är författad mot 1,700 m-kanonen, så den\\n  // skalade höften lyfts tillbaka upp till sitshöjden. Faktorn gör\\n  // korrigeringen proportionell mot hur sittande posen är, så blendPose kan\\n  // lerpa in och ur den utan hopp i övergången.\\n  const seatAnchor = Math.min(1, hipDrop / FIGURE.seatedHipDrop);\\n  const seatFix = FIGURE.hipY * (1 - (rig.heightMult ?? 1)) * seatAnchor;\\n  j.body.position.y = (pose.lift ?? 0) - hipDrop + seatFix;\\n  const t = pose.torso ?? {};\\n  j.chest.rotation.set(-(t.pitch ?? 0), t.yaw ?? 0, t.roll ?? 0);\\n  const h = pose.head ?? {};\\n  j.head.rotation.set(-(h.pitch ?? 0), h.yaw ?? 0, 0);\\n  applyArm(j.shoulderL, j.elbowL, pose.armL, -1);\\n  applyArm(j.shoulderR, j.elbowR, pose.armR, 1);\\n  applyLeg(j.hipL, j.kneeL, j.ankleL, pose.legL, -1);\\n  applyLeg(j.hipR, j.kneeR, j.ankleR, pose.legR, 1);\\n}\\n\\n/** Linjär blandning mellan två poser. k = 0 ger a, k = 1 ger b.\\n *  Används för att gå in i och ur sittande (SIT_STAND_DURATION_SEC)\\n *  och för att växla gest utan hopp. */\\nexport function blendPose(a, b, k) {\\n  const m = Math.max(0, Math.min(1, k));\\n  function n(x, y) { return (x ?? 0) + ((y ?? 0) - (x ?? 0)) * m; }\\n  function arm(x, y) {\\n    const p = x ?? {};\\n    const q = y ?? {};\\n    return { swing: n(p.swing, q.swing), lift: n(p.lift, q.lift), elbow: n(p.elbow, q.elbow) };\\n  }\\n  function leg(x, y) {\\n    const p = x ?? {};\\n    const q = y ?? {};\\n    return {\\n      swing: n(p.swing, q.swing), spread: n(p.spread, q.spread),\\n      knee: n(p.knee, q.knee), ankle: n(p.ankle, q.ankle)\\n    };\\n  }\\n  const ta = a.torso ?? {};\\n  const tb = b.torso ?? {};\\n  const ha = a.head ?? {};\\n  const hb = b.head ?? {};\\n  return {\\n    lift: n(a.lift, b.lift),\\n    hipDrop: n(a.hipDrop, b.hipDrop),\\n    torso: { pitch: n(ta.pitch, tb.pitch), yaw: n(ta.yaw, tb.yaw), roll: n(ta.roll, tb.roll) },\\n    head: { pitch: n(ha.pitch, hb.pitch), yaw: n(ha.yaw, hb.yaw) },\\n    armL: arm(a.armL, b.armL), armR: arm(a.armR, b.armR),\\n    legL: leg(a.legL, b.legL), legR: leg(a.legR, b.legR)\\n  };\\n}\\n\\n// ---------- poser -----------------------------------------------------\\n//\\n// Rena funktioner. Ingen av dem håller tid, tillstånd eller\\n// slumptal — anroparen skickar in fas eller sekunder och sätter\\n// resultatet med applyPose. Samma indata ger alltid samma pose, så\\n// två klienter kan rendera samma bildruta likadant.\\n\\n/**\\n * Gång. `phase` i CYKLER, inte sekunder — driv den från tillryggalagd\\n * sträcka (phase += steg / stridLength) precis som AnimationPrototype\\n * gjorde, så kadensen hänger ihop med förflyttningen och inte med\\n * väggklockan. En cykel = två fotisättningar.\\n */\\nexport function poseWalk(phase, options) {\\n  const o = options ?? {};\\n  const k = o.intensity ?? 1;\\n  const w = (phase ?? 0) * Math.PI * 2;\\n  const s = Math.sin(w);\\n  const c = Math.cos(w);\\n  const legAmp = 0.55 * k;\\n  const armAmp = 0.42 * k;\\n  return {\\n    lift: -(1 - Math.abs(s)) * 0.028 * k,\\n    hipDrop: 0,\\n    torso: { pitch: 0.06, yaw: -0.07 * s, roll: 0.03 * c },\\n    head: { pitch: 0.02, yaw: 0.05 * s },\\n    armL: { swing: -armAmp * s, lift: 0.06, elbow: 0.26 + 0.22 * Math.max(0, -s) },\\n    armR: { swing: armAmp * s, lift: 0.06, elbow: 0.26 + 0.22 * Math.max(0, s) },\\n    legL: { swing: legAmp * s, spread: 0.02, knee: kneeSwing(w, k), ankle: -0.12 * c },\\n    legR: { swing: -legAmp * s, spread: 0.02, knee: kneeSwing(w + Math.PI, k), ankle: 0.12 * c }\\n  };\\n}\\n\\nfunction kneeIdle(shift) {\\n  return 0.06 + 0.05 * Math.max(0, shift);\\n}\\n\\nfunction kneeSwing(w, k) {\\n  return 0.12 + 0.80 * k * Math.max(0, Math.sin(w + 1.15));\\n}\\n\\n/**\\n * Stillastående. `t` i sekunder. Andning, tyngdöverföring och en\\n * långsam huvudvridning — nog för att en stillastående figur inte\\n * ska läsa som död, inte nog för att bli en manér.\\n */\\nexport function poseIdle(t, options) {\\n  const o = options ?? {};\\n  const k = o.intensity ?? 1;\\n  const time = t ?? 0;\\n  const shift = Math.sin(time * 0.35) * k;\\n  const breathe = Math.sin(time * 2 * Math.PI * 0.22);\\n  return {\\n    lift: (breathe - 1) * 0.003,\\n    hipDrop: 0,\\n    torso: { pitch: 0.015, yaw: 0.02 * shift, roll: 0.025 * shift },\\n    head: { pitch: 0.03, yaw: 0.16 * Math.sin(time * 0.18) },\\n    armL: { swing: 0.03, lift: 0.055 + 0.012 * shift, elbow: 0.16 + 0.03 * breathe },\\n    armR: { swing: 0.03, lift: 0.055 - 0.012 * shift, elbow: 0.16 - 0.03 * breathe },\\n    // Fotleden håller foten plan mot golvet: ankle = knä − höft, annars\\n    // dyker tåspetsen under golvplanet så fort knät böjs.\\n    legL: { swing: 0.02, spread: 0.035, knee: kneeIdle(shift), ankle: kneeIdle(shift) - 0.02 },\\n    legR: { swing: 0.02, spread: 0.035, knee: kneeIdle(-shift), ankle: kneeIdle(-shift) - 0.02 }\\n  };\\n}\\n\\n/**\\n * Sittande. Höften sänks 0,41 m till stolshöjd (sits 0,45 m), låret\\n * går ut vågrätt och underbenet lätt bakåt, så sulan står plan i\\n * golvplanet. Ersätter InteriorGuests SIT_DIP_M-tricket, där hela\\n * pucken sjönk 0,27 m utan att kroppen ändrade form.\\n */\\nexport function poseSeated(t, options) {\\n  const o = options ?? {};\\n  const time = t ?? 0;\\n  const breathe = Math.sin(time * 2 * Math.PI * 0.2);\\n  const nod = Math.sin(time * 2 * Math.PI * 0.35);\\n  return {\\n    lift: (breathe - 1) * 0.005,\\n    hipDrop: 0.41,\\n    torso: { pitch: 0.06 + 0.012 * breathe, yaw: (o.targetYaw ?? 0) * 0.3, roll: 0 },\\n    head: { pitch: 0.05 + 0.05 * nod, yaw: (o.targetYaw ?? 0) * 0.7 },\\n    armL: { swing: 0.52, lift: 0.06, elbow: 1.14 + 0.02 * breathe },\\n    armR: { swing: 0.52, lift: 0.06, elbow: 1.14 - 0.02 * breathe },\\n    // knä 1,77 och fotled 0,31 ger ankle_y = 0,060 och plan fot: sulan\\n    // står i golvplanet i stället för tre centimeter ner i det.\\n    legL: { swing: 1.46, spread: 0.06, knee: 1.77, ankle: 0.31 },\\n    legR: { swing: 1.46, spread: 0.06, knee: 1.77, ankle: 0.31 }\\n  };\\n}\\n\\n/**\\n * Hälsning. En arm upp och en vinkning på ~1,6 Hz, bålen vänd mot\\n * den man hälsar på. `options.side`: 1 = höger arm, -1 = vänster.\\n * `options.targetYaw` = vridningen mot mottagaren, relativt kursen.\\n */\\nexport function poseGreet(t, options) {\\n  const o = options ?? {};\\n  const time = t ?? 0;\\n  const yaw = o.targetYaw ?? 0;\\n  const wave = Math.sin(time * 2 * Math.PI * 1.6);\\n  const raised = { swing: 1.12, lift: 0.52 + 0.20 * wave, elbow: 0.82 - 0.16 * wave };\\n  const resting = { swing: 0.06, lift: 0.06, elbow: 0.22 };\\n  let armL = resting;\\n  let armR = raised;\\n  if ((o.side ?? 1) < 0) { armL = raised; armR = resting; }\\n  return {\\n    lift: (wave - 1) * 0.004,\\n    hipDrop: 0,\\n    torso: { pitch: 0.09, yaw: yaw * 0.4, roll: 0 },\\n    head: { pitch: 0.04, yaw: yaw * 0.6 },\\n    armL: armL,\\n    armR: armR,\\n    legL: { swing: 0.05, spread: 0.05, knee: 0.08, ankle: 0.03 },\\n    legR: { swing: -0.03, spread: 0.05, knee: 0.12, ankle: 0.15 }\\n  };\\n}\\n\\n/**\\n * Arbete vid en yta — passet, baren, ett bord. Bålen fram, huvudet\\n * ner mot händerna, armarna växelvis i arbete på ~1,3 Hz.\\n */\\nexport function poseWork(t, options) {\\n  const o = options ?? {};\\n  const k = o.intensity ?? 1;\\n  const time = t ?? 0;\\n  const beat = Math.sin(time * 2 * Math.PI * 1.3) * k;\\n  const off = Math.cos(time * 2 * Math.PI * 1.3) * k;\\n  return {\\n    lift: 0.012 * Math.abs(beat),\\n    hipDrop: 0,\\n    torso: { pitch: 0.22, yaw: 0.05 * off, roll: 0.02 * beat },\\n    head: { pitch: 0.30, yaw: 0.05 * off },\\n    armL: { swing: 0.84 + 0.14 * beat, lift: 0.14, elbow: 0.96 - 0.18 * beat },\\n    armR: { swing: 0.84 - 0.14 * beat, lift: 0.14, elbow: 0.96 + 0.18 * beat },\\n    legL: { swing: 0.04, spread: 0.07, knee: 0.10, ankle: 0.06 },\\n    legR: { swing: -0.06, spread: 0.07, knee: 0.14, ankle: 0.20 }\\n  };\\n}\\n\\n/**\\n * Bär något. Båda armar fram, underarmarna vågräta, händerna möts\\n * ~0,40 m framför bålen på ~1,15 m höjd — där en bricka ligger.\\n * Föremålet ingår inte i leveransen; montera det som barn till\\n * joints.handAnchorL / handAnchorR.\\n *\\n * `options.phase` (cykler) blandar in gångbenen, så bärande under\\n * förflyttning är samma pose och inte en fjärde variant.\\n */\\nexport function poseCarry(t, options) {\\n  const o = options ?? {};\\n  const time = t ?? 0;\\n  const settle = Math.sin(time * 2 * Math.PI * 0.9) * 0.02;\\n  let base = poseIdle(time, o);\\n  if (o.phase !== null && o.phase !== undefined) base = poseWalk(o.phase, o);\\n  const bt = base.torso ?? {};\\n  const bh = base.head ?? {};\\n  return {\\n    lift: base.lift,\\n    hipDrop: 0,\\n    torso: { pitch: -0.02, yaw: (bt.yaw ?? 0) * 0.5, roll: (bt.roll ?? 0) * 0.5 },\\n    head: { pitch: 0.10, yaw: (bh.yaw ?? 0) * 0.5 },\\n    armL: { swing: 0.55 + settle, lift: 0.16, elbow: 1.05 - settle },\\n    armR: { swing: 0.55 - settle, lift: 0.16, elbow: 1.05 + settle },\\n    legL: base.legL,\\n    legR: base.legR\\n  };\\n}\\n\\n// ---------- not: vilka ledvinklar varje pose sätter -------------------\\n//\\n// Alla sex sätter bål, huvud, båda armar och båda ben — applyPose\\n// skriver alltid hela riggen, så ingen pose kan lämna ett led kvar i\\n// en tidigare poses vinkel. Det som skiljer dem är vilka led som\\n// faktiskt bär gesten:\\n\\nexport const POSE_JOINT_NOTES = {\\n  poseWalk:\\n    'Höft ±0,55 rad ur fas, knä 0,12–0,92 rad på svingbenet, fotled ±0,12. ' +\\n    'Axel ±0,42 rad motfas mot benen, armbåge 0,26–0,48. Bål 0,06 fram, ' +\\n    'vrid ±0,07 och rull ±0,03 per cykel. Kroppen dippar 0,028 m mot ' +\\n    'dubbelstöd — hjässan är taket, inte medelvärdet. ' +\\n    'Fasen kommer från sträcka, inte klocka.',\\n  poseIdle:\\n    'Nära noll överallt. Tyngdöverföring 0,35 Hz på bålens rull ±0,025 och ' +\\n    'knäna 0,06–0,11, fotled = knä − höft så sulan står plan. Andning ' +\\n    '0,22 Hz på kroppens y, 0–0,006 m nedåt. Huvudvridning ' +\\n    '±0,16 rad på 0,18 Hz. Armbåge 0,16 så armarna inte hänger som brädor.',\\n  poseSeated:\\n    'hipDrop 0,41 m (sits 0,45). Höft 1,46 rad fram, knä 1,77 rad, fotled 0,31 ' +\\n    '— låret vågrätt, underbenet lätt bakåt, sulan plan i golvplanet. Axel 0,52 / armbåge 1,14 ' +\\n    'lägger händerna på låren. Bål 0,06 fram, nick 0,35 Hz. targetYaw vrider ' +\\n    'huvud 0,7 och bål 0,3 mot bordet.',\\n  poseGreet:\\n    'En axel 1,12 rad fram och 0,52 rad ut, armbåge 0,82 — handen i huvudhöjd. ' +\\n    'Vinkning 1,6 Hz på axelns lift ±0,20 och armbågen ∓0,16. Andra armen 0,06/0,22. ' +\\n    'Bål 0,09 fram, targetYaw vrider bål 0,4 och huvud 0,6. Benen står isär 0,05.',\\n  poseWork:\\n    'Bål 0,22 fram, huvud 0,30 ner mot händerna. Båda axlar 0,84 rad fram, ' +\\n    'armbåge 0,96, växelvis ±0,14/∓0,18 på 1,3 Hz så händerna arbetar i motfas. ' +\\n    'Benen isär 0,07, bakre knä 0,14, fotled 0,06/0,20 så fötterna står plana.',\\n  poseCarry:\\n    'Båda axlar 0,55 rad fram och 0,16 ut, armbåge 1,05 — handankarna möts ' +\\n    '0,40 m fram på 1,15 m höjd. Bål 0,02 bakåt som motvikt, huvud 0,10 ner. ' +\\n    'Vaggning 0,9 Hz ±0,02 på axel och armbåge. options.phase byter ut benen ' +\\n    'mot poseWalk, så bärande under gång är samma pose.'\\n};\\n\\n// ---------- mätning ---------------------------------------------------\\n\\n/**\\n * Faktisk utbredning i världsmått. ORDER 121 §7 mäter figuren i vyn,\\n * inte i scengrafen — den här funktionen ger samma tal som\\n * playwright-mätningen ska bekräfta (höjd 1,70 × heightMult i stående pose —\\n * 1,70 m exakt för personal — bredd = axelbredden).\\n */\\nexport function measureFigure(rig) {\\n  rig.root.updateWorldMatrix(true, true);\\n  // Exakta hörn, inte transformerade AABB:er. Box3.setFromObject roterar\\n  // varje geometris AABB, och en lutad sfärs AABB blåser upp höjden med\\n  // ~6 mm — då skulle kontraktet läsa 1,706 m fast silhuetten toppar på\\n  // 1,700. Här samlas verkliga världskoordinater i stället.\\n  const box = new THREE.Box3();\\n  const v = new THREE.Vector3();\\n  rig.root.traverse(function (o) {\\n    if (!o.isMesh || !o.geometry) return;\\n    const pos = o.geometry.attributes.position;\\n    if (!pos) return;\\n    for (let i = 0; i < pos.count; i++) {\\n      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);\\n      box.expandByPoint(v);\\n    }\\n  });\\n  const size = new THREE.Vector3();\\n  box.getSize(size);\\n  return {\\n    height: size.y,\\n    width: size.x,\\n    depth: size.z,\\n    crownY: box.max.y,\\n    anchorY: rig.joints.headAnchor.getWorldPosition(new THREE.Vector3()).y\\n  };\\n}\\n\\n// ---------- ÖPPNA FRÅGOR TILL SIMULERINGEN ----------------------------\\n//\\n// ORDER 121 §4: en pose som kräver information spelet inte har ska\\n// flaggas, inte uppfinnas. Tre poser saknar indata i dag. Riggen\\n// exponerar dem ändå — de fungerar så snart någon skickar in ett\\n// tillstånd — men presentationslagret väljer dem inte självt.\\n//\\n// 1. poseWork  — TeamMember bär bara `role`. Det finns ingen uppgift\\n//    på den entitet InteriorStaff.tsx renderar, så \\\"arbetar just nu\\\"\\n//    går inte att läsa av. `staffTasks` i strings.sv.ts är text utan\\n//    koppling till en tillståndsmaskin. Fram till dess är poseWork\\n//    korrekt bara som roll-konstant (kock vid passet), inte som\\n//    händelse. FLAGGAT.\\n//\\n// 2. poseCarry — samma sak, plus: ingenting säger VAD som bärs eller\\n//    mellan vilka två punkter. Handankaret finns; valet av pose\\n//    kräver ett bär-tillstånd som inte existerar. FLAGGAT.\\n//\\n// 3. Golvkontakt vid studs — inte en saknad indata, men ett val som hör\\n//    hit. 1,700 m är ett tak, så gångstuds och andning sänker kroppen i\\n//    stället för att lyfta den. Mätt lägsta punkt över hela cykeln, per\\n//    pose: poseWalk och poseCarry −0,029 m (gångstudsen), poseSeated\\n//    −0,012 m, poseGreet −0,009 m, poseIdle −0,007 m, poseWork\\n//    −0,000 m. De stillastående poserna håller sulan i golvplanet med\\n//    plan fotled (ankle = knä − höft); det som återstår är studsen.\\n//    Osynligt i strategisk kamera. Ska kontakten vara exakt även under\\n//    studs hör den i knäböjen, och det kräver en enkel ben-IK som inte\\n//    ingår i den här ordern.\\n//\\n// 4. poseGreet — riktningen (targetYaw) kräver vem figuren vänder sig\\n//    mot. För personal finns kanten redan: StaffMember.targetGuestId\\n//    plus bryggan i teamStaffBridge.ts (samma som pip-en använder).\\n//    För gäst mot gäst finns ingen sådan kant. Om värden ska hälsa på\\n//    en ankommande gäst behöver simuleringen säga vilken gäst.\\n//    HÄRLEDBAR FÖR PERSONAL, FLAGGAT FÖR GÄST.\\n//\\n// 5. Kort gäst på fast sits (nytt med SD-004 §3.3). Sitsen ankras, så\\n//    höften hamnar rätt oavsett längd — men underbenet skalas med\\n//    kroppen, och vid mult under ~0,95 når sulan inte golvet från en\\n//    0,45 m sits. Fötterna hänger, vilket är anatomiskt hederligt och\\n//    osynligt i strategisk kamera. Exakt golvkontakt kräver samma\\n//    ben-IK som punkt 3 och ingår inte här. FLAGGAT, EJ BLOCKANDE.\\n//\\n// poseWalk, poseIdle och poseSeated behöver ingen ny information:\\n// GuestState och den befintliga positionsinterpolationen räcker\\n// (arriving/waiting/leaving/declined → poseWalk med fas ur sträckan,\\n// stillastående → poseIdle, seated/ordering/dining/paying/sleeping →\\n// poseSeated).\\n\"};<\u002Fscript>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"7ddecff5-8b62-47c1-bcdf-a6aca9c83800\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"26538ff0-aaed-4d48-83ba-9c020a3ba963\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7ddecff5-8b62-47c1-bcdf-a6aca9c83800\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"26538ff0-aaed-4d48-83ba-9c020a3ba963\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7ddecff5-8b62-47c1-bcdf-a6aca9c83800\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE- .__SRC && window.__SRC[name]) || await (await fetch(new URL(name, document.baseURI).href, { cache: 'no-store' })).text();\n      if (name.endsWith('.ts')) {\n        if (!window.Babel) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });\n        src = window.Babel.transform(src, { filename: name, presets: ['typescript'] }).code;\n      }\n      const specs = new Set([...src.matchAll(/from\\s+['\"]([^'\"]+)['\"]/g)].map((m) => m[1]));\n      for (const s of specs) {\n        let target = null;\n        if (s === 'three') target = 'https://unpkg.com/three@0.160.0/build/three.module.js';\n        else if (s.startsWith('./')) { const f = s.slice(2); target = (await this.loadMod(f.endsWith('.js') || f.endsWith('.ts') ? f : f + '.ts')).url; }\n        if (target) src = src.split(\"'\" + s + \"'\").join(\"'\" + target + \"'\");\n      }\n      const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));\n      return { url, mod: await import(url) };\n    })();\n    this.mods[name] = p;\n    return p;\n  }\n  hOf(w) { return w === 1440 ? 900 : 720; }\n  async componentDidMount() {\n    try {\n      const get = async (n) => (await this.loadMod(n)).mod;\n      const [VE, K, SM, PL, KA, WR, VQ] = await Promise.all(['villageEvening.ts', 'byKvall.js', 'byKvallSim.js', 'byKvallPlats.js', 'byKarta.js', 'wineBarRoom.ts', 'villageQueue.balance.ts'].map(get));\n      while (!window.BYT) await new Promise((r) => setTimeout(r, 60));\n      this.VE = VE; this.K = K; this.SM = SM; this.PL = PL;\n      // Rummet ur wineBarRoom.ts: köplatserna och trottoaren läses därifrån, som i teatern.\n      this.room = WR.createWineBarRoom();\n      this.sim = new SM.VillageSim({ BYT: window.BYT, LIGHTS: VE.LIGHTS, room: this.room, queue: VQ.VILLAGE_QUEUE });\n      const S = K.createStage(this.glRef.current, { width: this.state.size, height: this.hOf(this.state.size), input: this.outRef.current, fov: 34 });\n      this.S = S;\n      this.V3 = K.buildEveningVillage(S, this.sim, { LIGHTS: VE.LIGHTS, COLOURS: VE.COLOURS, SKY: VE.SKY, MAP: KA, PL });\n      this.guests = K.createGuests(S.scene, VE.COLOURS); this.carsL = K.createCars(S.scene, VE.COLOURS);\n      S.goal.dist = VE.LEVELS[0].dist; this.aim(); S.snap();\n      this.sim.warm(this.e, 40);\n      this.outRef.current.addEventListener('wheel', (ev) => { ev.preventDefault(); const [a, b] = VE.BLEND.zoom; S.goal.dist = Math.max(a, Math.min(b, S.goal.dist * Math.exp(ev.deltaY * 0.0012))); }, { passive: false });\n      window.__byk = this;\n      this.setState({ loading: false });\n      let last = performance.now(), lastUi = 0;\n      this.iv = setInterval(() => {\n        if (this.dead) return;\n        const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;\n        const play = this.state.playing && !this.state.shot;\n        if (play) { this.e = Math.min(1, this.e + dt / SM.PROTO.eveningS); if (this.e >= 1) this.setState({ playing: false }); }\n        this.sim.over = this.state.over;\n        try { this.sim.update(play ? dt : 0, this.e); this.draw(dt, false); } catch (err) { if (!this.errShown) { this.errShown = true; console.error(err); } }\n        if (now - lastUi > 150) { lastUi = now; this.ui(); }\n      }, 33);\n    } catch (err) { console.error(err); this.setState({ err: String(err && err.stack || err) }); }\n  }\n  componentWillUnmount() { this.dead = true; clearInterval(this.iv); if (this.S) this.S.dispose(); }\n  frame(d) { return this.K.frameAt(this.VE.LEVELS, this.VE.BLEND, d, this.sim.PV.obb); }\n  aim() {\n    const S = this.S, f = this.frame(S.goal.dist);\n    S.goal.tx = this.focusAt ? this.focusAt[0] : f.tx; S.goal.tz = this.focusAt ? this.focusAt[1] : f.tz; S.goal.ty = this.focusAt ? 0 : f.ty; S.goal.fov = f.fov;\n    if (!S.userActive()) { S.goal.pitch = f.pitch; S.goal.yaw = this.focusAt ? this.focusYaw : f.yaw; }\n  }\n  /** Kameran till en krog (listan och kontrollbilderna). null = nivåns eget mål. */\n  focusVenue(id) { const rs = id && this.sim.REST.find((r) => r.id === id); this.focusAt = rs ? (rs.truck ? this.sim.map(rs.x, rs.y) : [rs.cx / 10, rs.cy / 10]) : null;\n    // Kameran ställer sig på dörrens sida, så att det som händer vid dörren syns.\n    if (rs) { const n = rs.truck ? [rs.door[0] - rs.x, rs.door[1] - rs.y] : rs.nrm; this.focusYaw = Math.atan2(n[0], n[1]); }\n    if (this.S) this.S.resetUser(); }\n  draw(dt, snap) {\n    const S = this.S, K = this.K, VE = this.VE; if (!S) return;\n    this.aim(); if (snap) S.snap(); else S.step(dt);\n    const f = this.frame(S.cam.dist), t = performance.now() / 1000, st = { e: this.e, dt, t, f, snap };\n    this.f = f;\n    this.V3.update(st); this.guests.update(this.sim, f, t); this.carsL.update(this.sim);\n    window.BYT.draw3d(this.sim, K, S); K.updateTrucks(this.sim, f, st, VE.COLOURS);\n    S.render(); const out = this.outRef.current; if (out) { if (window.__bykRaw) out.getContext('2d').drawImage(this.glRef.current, 0, 0, out.width, out.height); else K.grade(this.glRef.current, out); }\n  }\n  stateOf(rs) { return rs.open ? 'open' : rs.prep ? 'prep' : rs.cleaning ? 'cleaning' : 'closed'; }\n  ui() {\n    const sim = this.sim, S = this.S, f = this.f; if (!sim || !f) return;\n    const labels = [];\n    if (this.state.names) sim.REST.forEach((rs) => {\n      const [x, z] = rs.truck ? sim.map(rs.x, rs.y) : sim.map(rs.cx, rs.cy), y = rs.truck ? 4.5 : rs.H + 3;\n      const [px, py, pz] = S.project(x, y, z); if (pz > 1 || px < 0 || py < 0 || px > S.width || py > S.height) return;\n      labels.push({ x: (px / S.width * 100).toFixed(2) + '%', y: (py / S.height * 100).toFixed(2) + '%', name: this.str('byk.venue.' + rs.id), state: this.str('byk.state.' + this.stateOf(rs)), bd: rs.own ? '1px solid #ffcf7a' : '1px solid rgba(215,162,76,.45)', stars: [0, 1, 2, 3, 4].map((i) => ({ c: i < rs.stars ? '#e8b93a' : 'rgba(244,230,204,.18)' })) });\n    });\n    this.setState({ e: this.e, level: f.level, labels, venues: sim.REST.map((rs) => ({ id: rs.id, st: this.stateOf(rs) })) });\n  }\n  str(k) { const e = (window.NEXUS_STR_BYK || {})[k]; return e ? e[this.state.lang] : ''; }\n  phaseKey(e) { const P = this.VE ? this.VE.PHASES : []; let k = P[0]; P.forEach((p) => { if (e >= p.from) k = p; }); return k ? k.nameKey : ''; }\n  goLevel(id) { const lv = this.VE.LEVELS.find((l) => l.id === id); this.S.goal.dist = lv.dist; this.focusAt = null; this.S.resetUser(); }\n  setSize(w) { this.setState({ size: w }, () => { if (this.S) { this.S.size(w, this.hOf(w)); this.draw(0.033, false); } }); }\n  /**\n   * Kontrollbild: nivå, kväll och storlek, utan panelen. from = kvällen börjar här och går fram till e under warm\n   * sekunder (så att en krog hinner stänga i bild). focus = krogens id. full = läget fullt hus (rummet fullt och\n   * sällskap på köplatserna, som scen 5 i vardagens koreografi). Kapaciteten och tålamodet ändras inte.\n   */\n  prepare(o) {\n    this.sim.over = o.over || {};\n    if (o.from != null) { this.sim.warm(o.from2 ?? o.e, o.warm ?? 40, 0.1, o.from); if (o.seat) Object.entries(o.seat).forEach(([id, k]) => this.sim.seatParties(id, k)); if (o.from2 != null) this.sim.warm(o.e, o.after ?? 4, 0.1, o.from2); }\n    else this.sim.warm(o.e, o.warm ?? 40);\n    if (o.full) { this.sim.fullHouse(o.parties ?? 6); this.sim.warm(o.e, o.after ?? 3); }\n    this.e = o.e; this.focusVenue(o.focus || null);\n    const lv = this.VE.LEVELS.find((l) => l.id === (o.level || 'village')); this.S.goal.dist = lv.dist; this.S.resetUser(); this.focusVenue(o.focus || null);\n  }\n  setup(o = {}) {\n    const size = o.size || 1440; this.fit = !!o.fit; this.prepare({ e: 0.3, ...o });\n    this.S.size(size, this.hOf(size));\n    this.setState({ size, shot: o.shot ?? true, names: !!o.names, over: o.over || {}, playing: false, e: this.e }, () => { this.draw(0.033, true); this.draw(0.033, true); this.ui(); });\n  }\n  /** Ett ark med kontrollbilder under varandra, för att klippa ut dem i full storlek. */\n  sheet(list, size = 1440) {\n    const h = this.hOf(size), old = document.getElementById('byk-sheet'); if (old) old.remove();\n    const el = document.createElement('div'); el.id = 'byk-sheet'; el.style.cssText = 'position:absolute;left:0;top:0;width:' + size + 'px;z-index:99;background:#000;line-height:0;';\n    const out = this.outRef.current; this.S.size(size, h); out.width = size; out.height = h;\n    list.forEach((o) => {\n      this.prepare(o); this.draw(0.033, true); this.draw(0.033, true);\n      const c = document.createElement('canvas'); c.width = size; c.height = h; c.style.cssText = 'display:block;width:' + size + 'px;height:' + h + 'px;'; c.getContext('2d').drawImage(out, 0, 0); el.appendChild(c);\n    });\n    this.setState({ playing: false, size });\n    document.body.appendChild(el); return list.length;\n  }\n  renderVals() {\n    const st = this.state, on = { bg: '#e8b93a', fg: '#2a1c13' }, off = { bg: 'transparent', fg: '#f4e6cc' }, VE = this.VE;\n    const lvls = VE ? VE.LEVELS : [];\n    const rowKeys = [['guests', 'byk.row.guests'], ['party', 'byk.row.party'], ['truck', 'byk.row.truck'], ['venue', 'byk.row.venue'], ['light', 'byk.row.light']];\n    const vcols = { open: '#ffd58f', prep: '#c9a878', cleaning: '#c9a878', closed: 'rgba(244,230,204,.18)' };\n    return {\n      glRef: this.glRef, outRef: this.outRef, loading: st.loading, loadingText: st.err || '…',\n      cw: st.size, ch: this.hOf(st.size), aspect: st.size + ' / ' + this.hOf(st.size),\n      stageW: st.shot ? (this.fit ? 'min(100%, ' + (st.size / this.hOf(st.size) * 100).toFixed(1) + 'vh)' : st.size + 'px') : '100%', maxW: st.shot ? 'none' : st.size + 'px', pad: st.shot ? '0' : '20px', justify: st.shot ? 'flex-start' : 'center', asideDisp: st.shot ? 'none' : 'flex',\n      s: { kicker: this.str('byk.kicker'), title: this.str('byk.title'), level: this.str('byk.level'), hint: this.str('byk.level.hint'), evening: this.str('byk.evening'), onLevel: this.str('byk.onLevel'), venues: this.str('byk.venues'), venuesHint: this.str('byk.venues.hint'), reset: this.str('byk.resetSchedule'), types: this.str('byk.types'), names: this.str('byk.names'), size: this.str('byk.size') },\n      langs: [['sv', 'SV'], ['en', 'EN']].map(([k, l]) => ({ label: l, bg: st.lang === k ? on.bg : off.bg, fg: st.lang === k ? on.fg : off.fg, pick: () => this.setState({ lang: k }) })),\n      levels: lvls.map((lv) => ({ label: this.str(lv.nameKey), dist: lv.dist + ' m', bg: st.level === lv.id ? 'rgba(245,234,213,.14)' : 'rgba(245,234,213,.04)', bd: st.level === lv.id ? '1px solid rgba(255,213,143,.6)' : '1px solid transparent', pick: () => { this.goLevel(lv.id); this.setState({ focus: null }); } })),\n      phase: this.str(this.phaseKey(st.e)), e: st.e,\n      togglePlay: () => { if (!st.playing && this.e >= 1) this.e = 0; this.setState({ playing: !st.playing, shot: false }); }, playLabel: st.playing ? this.str('byk.pause') : this.str('byk.play'),\n      scrub: (ev) => { this.e = parseFloat(ev.target.value); this.setState({ e: this.e }); },\n      rows: rowKeys.map(([k, l]) => ({ label: this.str(l), text: this.str('byk.desc.' + st.level + '.' + k) })),\n      venues: st.venues.map((v) => { const forced = st.over[v.id] != null; return { name: this.str('byk.venue.' + v.id), state: this.str('byk.state.' + v.st) + (forced ? ' · ' + this.str('byk.state.byHand') : ''), dot: vcols[v.st], glow: v.st === 'open' ? '0 0 10px rgba(255,213,143,.8)' : 'none', fg: v.st === 'open' ? '#f0cd82' : '#cdb898', bg: this.focusAt && st.focus === v.id ? 'rgba(245,234,213,.12)' : 'rgba(245,234,213,.04)', go: () => { this.focusVenue(v.id); this.setState({ focus: v.id }); }, pick: () => this.setState({ over: { ...st.over, [v.id]: v.st !== 'open' } }) }; }),\n      anyOver: Object.keys(st.over).length > 0, resetOver: () => this.setState({ over: {} }),\n      types: VE ? Object.entries(VE.COLOURS.guest).map(([k, c]) => ({ col: c, name: this.str('byk.type.' + k) })) : [],\n      names: st.names, labels: st.labels, toggleNames: () => this.setState({ names: !st.names }), namesBg: st.names ? 'rgba(245,234,213,.12)' : 'transparent', namesDot: st.names ? '#e8b93a' : 'transparent',\n      sizes: [1440, 1280].map((w) => ({ label: w + ' × ' + this.hOf(w), bg: st.size === w ? on.bg : off.bg, fg: st.size === w ? on.fg : off.fg, pick: () => this.setSize(w) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
