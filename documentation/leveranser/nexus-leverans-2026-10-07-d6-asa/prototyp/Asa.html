n och loungen (tillägget) ==============================\\n\\nconst STOOL: FigurePose = P(SEAT, {\\n  hipDrop: SEAT_KINDS.stool.drop, torso: { pitch: 0.1 }, head: { pitch: 0.06 },\\n  legL: SEAT_KINDS.stool.legs, legR: SEAT_KINDS.stool.legs\\n});\\nconst LOUNGE: FigurePose = P(SEAT, {\\n  hipDrop: SEAT_KINDS.lounge.drop, torso: { pitch: -0.12 }, head: { pitch: 0.16 },\\n  legL: SEAT_KINDS.lounge.legs, legR: SEAT_KINDS.lounge.legs\\n});\\n/** Djup sänkning mot en låg dyna: bålen fram som motvikt, händerna fram. Fotleden = knä − höft. */\\nconst LOUNGE_CROUCH: FigurePose = P(STAND, {\\n  hipDrop: 0.3, torso: { pitch: 0.55 }, head: { pitch: -0.05 },\\n  armL: A(0.65, 0.15, 0.5), armR: A(0.65, 0.15, 0.5),\\n  legL: { swing: 1.1, spread: 0.08, knee: 1.7, ankle: 0.6 }, legR: { swing: 1.1, spread: 0.08, knee: 1.7, ankle: 0.6 }\\n});\\n\\nreg(def({\\n  id: 'guest.sitStool', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.6, seatKind: 'stool',\\n  from: 'stand', to: 'seated', needs: 'stool', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.gesture', 'guest.readMenu', 'guest.lean'],\\n  pose: function (u, c) {\\n    const side = c.side ?? 1;\\n    const reach = P(STAND, { torso: { pitch: 0.12 }, armR: A(1.0, 0.12, 0.7), armL: A(0.25, 0.1, 0.4) });\\n    // Foten på ringen: det närmaste benet lyfts först.\\n    const footUp = { swing: 0.95, spread: 0.08, knee: 1.75, ankle: 0.8 };\\n    const climb: FigurePose = side > 0\\n      ? P(reach, { hipDrop: 0, torso: { pitch: 0.2 }, legR: footUp })\\n      : P(reach, { hipDrop: 0, torso: { pitch: 0.2 }, legL: footUp });\\n    let p = keys(u, [\\n      [0, STAND],\\n      [0.35, reach],\\n      [0.6, climb],\\n      [0.82, P(STOOL, { armR: A(0.9, 0.12, 0.9) })],\\n      [1, STOOL]\\n    ]);\\n    const step = win(u, 0.08, 0.5, 0.06);\\n    if (step > 0) p = blendPose(p, walking(p, (u - 0.08) / 0.42, 0.45, 'none'), step);\\n    return withYaw(p, 0, -side * 0.3 * win(u, 0, 0.45, 0.12));\\n  },\  }, head: { pitch: 0.0 }, armR: A(0.82, 0.1, 0.95) })],\\n      [0.9, P(SEAT, { torso: { pitch: -0.04 }, armL: A(0.5, 0.06, 1.14) })],\\n      [1, P(SEAT, { torso: { pitch: -0.04 }, armL: A(0.5, 0.06, 1.14) })]\\n    ]);\\n    const arm = p.armR ?? {};\\n    return withYaw({ ...p, armR: { ...arm, lift: (arm.lift ?? 0) + 0.06 * sw * swirl } }, (c.yaw ?? 0) * 0.3 * ramp(u, 0.85, 1), (c.yaw ?? 0) * 0.85 * ramp(u, 0.84, 0.96));\\n  },\\n  tilt: function (u) { return { R: { roll: 0.14 * Math.sin(u * TAU * 9) * win(u, 0.15, 0.33, 0.03), pitch: -0.25 * win(u, 0.42, 0.62, 0.04) } }; }\\n}));\\n\\nreg(def({\\n  id: 'rocket.askPointMenu', group: 'rocket', roles: ['guest'], loop: false, travel: false, base: 4,\\n  from: 'seated', to: 'seated', needs: 'chair', holds: { R: 'menu' }, ends: { L: 'menu' },\\n  events: [{ u: 0.02, type: 'switch', hand: 'R' }],\\n  next: ['guest.order', 'guest.seatedIdle', 'rocket.askPointMenu'],\\n  pose: function (u, c) {\\n    const up = win(u, 0.08, 1.01, 0.08) * (1 - 0.8 * (bell(u, 0.33, 0.05) + bell(u, 0.56, 0.05)));\\n    const dip = bell(u, 0.33, 0.03) + bell(u, 0.56, 0.03);\\n    const palm = win(u, 0.7, 0.96, 0.06);\\n    return withYaw(P(SEAT, {\\n      torso: { pitch: 0.12, roll: 0.1 * palm },\\n      head: { pitch: 0.35 - 0.5 * up, yaw: 0 },\\n      armL: A(0.68, 0.1, 1.2),\\n      armR: A(0.8 + 0.2 * palm, 0.04 + 0.28 * palm, 1.0 + 0.2 * dip - 0.3 * palm)\\n    }), (c.yaw ?? 0) * 0.3 * up, (c.yaw ?? 0) * 0.8 * up);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'rocket.walkToKitchen', group: 'rocket', roles: ['guest'], loop: true, travel: true, base: 1,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['rocket.walkToKitchen', 'staff.idle'],\\n  pose: function (u, c) {\\n    const p = walking(P(STAND, { torso: { pitch: 0.1 }, head: { pitch: -0.02 }, armR: A(0.4, 0.1, 0.9) }), c.phase ?? u, (c.stride ?? 1) * 1.15, 'L');\\n    return p;\\n  }\\n}));\\n\\n\\n// ===== leverans 3: händelsernas klipp ============== ----\\n// Åtta gester för gästens stämning, sittande på stol, barstol och lounge (reseat). Tempot är styrkan:\\n// c.stress 0 (lugn) ger en antydan, 1 (stressad) en gest som läses från 24 m. Stämningen läses på armarna,\\n// höjden och bålens lutning. Ansiktet (figureFace.ts) syns först när kameran är närmare än 9 m.\\n\\nconst ARMS_X: PoseArm = A(0.32, -0.28, 1.9);\\nfunction moodK(c: ClipCtx): number { return 0.75 + 0.5 * (c.stress ?? 0.3); }\\n\\nreg(def({\\n  id: 'guest.leanCurious', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 3.2, mood: 'content',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.nodApprove', 'guest.laugh', 'guest.seatedIdle', 'guest.lean'],\\n  pose: function (u, c) {\\n    // Lutar sig fram mot det som händer, underarmarna mot knäna, huvudet upp och lite på sned.\\n    const k = moodK(c), lean = win(u, 0.1, 0.88, 0.2), tip = bell(u, 0.52, 0.14);\\n    const b = base(c, true);\\n    return breathe(withYaw(P(b, {\\n      torso: { pitch: 0.06 + 0.34 * k * lean },\\n      head: { pitch: 0.06 - 0.24 * lean },\\n      armL: blendArm(A(0.78, 0.1, 0.95), A(0.95, 0.16, 1.7), lean), armR: blendArm(A(0.78, 0.1, 0.95), A(0.95, 0.12, 1.7), lean)\\n    }), (c.yaw ?? 0) * 0.35 * lean, (c.yaw ?? 0) * 0.8 * lean + 0.14 * tip), c.t ?? 0);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.laugh', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.4, mood: 'delighted',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.gesture', 'guest.cheers', 'guest.lean'],\\n  pose: function (u, c) {\\n    // Huvudet bakåt, axlarna som studsar, en hand mot bröstet. Sedan framåt, nästan dubbelvikt, och tillbaka.\\n    const k = moodK(c), a = win(u, 0.05, 0.92, 0.12), back = a * (1 - ramp(u, 0.5, 0.62)), fold = bell(u, 0.66, 0.11);\\n    const ha = Math.sin(u * TAU * 5) * a;\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.012 * k * ha,\\n      torso: { pitch: 0.06 - 0.2 * k * back + 0.3 * k * fold + 0.03 * ha },\\n      head: { pitch: 0.06 - 0.42 * k * back + 0.18 * fold },\\n      armR: A(0.78 + 0.45 * a, 0.1, 0.95 + 1.0 * a),\\n      armL: A(0.78 + 0.25 * fold, 0.1 + 0.2 * fold, 0.95 - 0.3 * fold)\\n    }), (c.yaw ?? 0) * 0.3, (c.yaw ?? 0) * 0.7 * (1 - back));\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.cheers', group: 'guest', roles: ['guest'], loop: false, travel: false, handed: true, base: 3.4, mood: 'delighted',\\n  from: 'seated', to: 'seated', needs: 'table', holds: {}, ends: {},\\n  events: [{ u: 0.1, type: 'grab', hand: 'R', at: 'table' }, { u: 0.48, type: 'clink' }, { u: 0.9, type: 'release', hand: 'R', at: 'table' }],\\n  next: ['guest.seatedIdle', 'guest.laugh', 'guest.gesture'],\\n  pose: function (u, c) {\\n    // Skålen med hela bordet: glaset över huvudhöjd, mot bordets mitt, och ingen klunk. guest.toast är skålen och klunken.\\n    const k = moodK(c), b = base(c, true), hi = 1.9 + 0.45 * (k - 0.75) * 2;\\n    const jig = 0.05 * Math.sin(u * TAU * 6) * win(u, 0.4, 0.62, 0.04);\\n    const up = P(b, { torso: { pitch: 0.16 }, head: { pitch: -0.3 }, armR: A(hi, 0.14 + jig, 0.35), armL: A(0.9, 0.18, 1.0) });\\n    const toward = (c.yaw ?? 0) * win(u, 0.15, 0.8, 0.12);\\n    return withYaw(keys(u, [\\n      [0, b],\\n      [0.14, P(b, { armR: A(0.85, 0.1, 0.9) })],\\n      [0.38, up], [0.6, up],\\n      [0.74, P(b, { torso: { pitch: 0.08 }, armR: A(1.3, 0.1, 0.8) })],\\n      [0.88, P(b, { armR: A(0.8, 0.1, 0.92) })],\\n      [1, b]\\n    ]), toward * 0.4, toward * 0.6);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.nodApprove', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.2, mood: 'content',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.leanCurious', 'guest.gesture', 'guest.cheers'],\\n  pose: function (u, c) {\\n    // Två långsamma nickar mot den som gjorde något, med handflatan öppen åt hen.\\n    const k = moodK(c), nod = 0.3 * k * (bell(u, 0.3, 0.075) + bell(u, 0.56, 0.075)), palm = win(u, 0.14, 0.82, 0.14);\\n    const b = base(c, true);\\n    return breathe(withYaw(P(b, {\\n      torso: { pitch: 0.06 + 0.06 * palm }, head: { pitch: 0.04 + nod },\\n      armR: A(0.78 + 0.18 * palm, 0.1 + 0.26 * palm, 0.95 - 0.3 * palm)\\n    }), (c.yaw ?? 0) * 0.3 * palm, (c.yaw ?? 0) * 0.85), c.t ?? 0);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.armsCrossed', group: 'guest', roles: ['guest'], loop: true, travel: false, base: 4, mood: 'displeased',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.armsCrossed', 'guest.checkWatch', 'guest.waveWaiter', 'guest.seatedIdle', 'guest.pushPlate'],\\n  pose: function (u, c) {\\n    // Armarna i kors, bålen tillbaka från bordet och blicken bort från det som stör. En suck per varv.\\n    const k = moodK(c), sigh = bell(u, 0.62, 0.08), s = Math.sin(u * TAU);\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.01 * sigh,\\n      torso: { pitch: 0.02 - 0.12 * k + 0.03 * s, roll: 0.04 * s },\\n      head: { pitch: 0.1 + 0.08 * sigh },\\n      armL: ARMS_X, armR: ARMS_X\\n    }), -(c.yaw ?? 0) * 0.1, -(c.yaw ?? 0) * 0.45 * k);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.checkWatch', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.6, mood: 'waiting',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.armsCrossed', 'guest.waveWaiter', 'guest.checkWatch'],\\n  pose: function (u, c) {\\n    // Vänster handled upp, blicken ned på klockan och sedan ut i rummet efter personalen.\\n    const k = moodK(c), watch = win(u, 0.1, 0.62, 0.12), look = win(u, 0.6, 0.96, 0.1);\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.008 * k * look,\\n      torso: { pitch: 0.06 + 0.06 * watch },\\n      head: { pitch: 0.06 + 0.44 * watch - 0.06 * look },\\n      armL: blendArm(A(0.78, 0.1, 0.95), A(0.62, 0.0, 1.95), watch)\\n    }), (c.yaw ?? 0) * 0.3 * look * k, (c.yaw ?? 0) * 0.9 * look);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.waveWaiter', group: 'guest', roles: ['guest'], loop: false, travel: false, handed: true, base: 2.8, mood: 'impatient',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.armsCrossed', 'guest.pay', 'guest.waveWaiter'],\\n  pose: function (u, c) {\\n    // Inte guest.waveStaff (fingret upp, vi vill beställa): armen rakt upp, halvvägs upp från sitsen, stora svep.\\n    const k = moodK(c), up = win(u, 0.08, 0.9, 0.1), wv = Math.sin(u * TAU * 5) * win(u, 0.2, 0.8, 0.06);\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.05 * k * up,\\n      torso: { pitch: 0.02 - 0.04 * up, roll: -0.1 * k * up },\\n      head: { pitch: 0.02 - 0.12 * up },\\n      armR: A(0.78 + (1.6 + 0.5 * (k - 0.75) * 2) * up, 0.1 + 0.14 * up + 0.24 * k * wv, 0.95 - 0.7 * up),\\n      armL: A(0.78 + 0.1 * up, 0.12 + 0.06 * up, 0.95 - 0.4 * up)\\n    }), (c.yaw ?? 0) * 0.35 * up, (c.yaw ?? 0) * 0.9 * up);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.pushPlate', group: 'guest', roles: ['guest'], loop: false, travel: false, handed: true, base: 3, mood: 'displeased',\\n  from: 'seated', to: 'seated', needs: 'table', holds: {}, ends: {},\\n  events: [{ u: 0.22, type: 'grab', hand: 'R', at: 'table' }, { u: 0.5, type: 'release', hand: 'R', at: 'table' }],\\n  next: ['guest.armsCrossed', 'guest.seatedIdle', 'guest.waveWaiter'],\\n  pose: function (u, c) {\\n    // Handen på tallrikens kant, en raksträckt arm som skjuter den ifrån sig, och sedan armarna i kors.\\n    const k = moodK(c), b = base(c, true);\\n    const crossed = P(b, { torso: { pitch: -0.1 * k }, head: { pitch: 0.12 }, armL: ARMS_X, armR: ARMS_X });\\n    return keys(u, [\\n      [0, b],\\n      [0.2, P(b, { torso: { pitch: 0.16 }, head: { pitch: 0.3 }, armR: A(0.78, 0.08, 1.0) })],\\n      [0.48, P(b, { torso: { pitch: 0.12 + 0.1 * k }, head: { pitch: 0.2 }, armR: A(1.12, 0.08, 0.28) })],\\n      [0.62, P(b, { torso: { pitch: 0.0 }, armR: A(0.9, 0.1, 0.8) })],\\n      [0.8, crossed], [1, crossed]\\n    ]);\\n  }\\n}));\\n\\n// ----- D5 följderna och konceptet (2026-10-04) -----\\n// Vagnarna (equipment.ts) är inte handrekvisita: vagnen följer figurens rot, handtaget 0,92 m och 0,34 m framför den.\\n// Händerna ligger på handtaget i trolley.push. Flamberingen och ostvagnen står vid bordets kortsida mot stråket.\\n\\nconst ON_HANDLE: PoseArm = A(0.62, 0.1, 0.62);\\n\\nreg(def({\\n  id: 'trolley.push', group: 'waiter', roles: ['waiter', 'host', 'sommelier', 'staff'], loop: true, travel: true, base: 1,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['trolley.push', 'trolley.present', 'cheese.cut', 'flambe.pour', 'staff.idle'],\\n  pose: function (u, c) {\\n    // Båda händerna på handtaget, bålen lite fram, kortare steg än vanlig gång (vagnen bromsar).\\n    return walking(P(STAND, { torso: { pitch: 0.14 }, head: { pitch: 0.12 }, armL: ON_HANDLE, armR: ON_HANDLE }), c.phase ?? u, (c.stride ?? 1) * 0.7, 'none');\\n  }\\n}));\\n\\nreg(def({\\n  id: 'trolley.present', group: 'waiter', roles: ['waiter', 'host', 'sommelier', 'staff'], loop: false, travel: false, base: 2.6, handed: true,\\n  from: 'stand', to: 'stand', needs: 'table', holds: {}, ends: {}, events: [],\\n  next: ['cheese.cut', 'flambe.pour', 'trolley.push', 'staff.idle'],\\n  pose: function (u) {\\n    // Vänster hand kvar på handtaget. Höger hand öppnas och sveper över vagnen mot gästerna, en kort bugning.\\n    const open = win(u, 0.12, 0.88, 0.18), bow = win(u, 0.35, 0.7, 0.12);\\n    return withYaw(P(STAND, { torso: { pitch: 0.06 + 0.16 * bow }, head: { pitch: 0.1 + 0.1 * bow }, armL: ON_HANDLE, armR: A(0.35 + 0.5 * open, 0.12 + 0.4 * open, 0.5 - 0.25 * open) }), 0.25 * open, 0.35 * open);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'cheese.cut', group: 'waiter', roles: ['waiter', 'host', 'sommelier', 'staff'], loop: false, travel: false, base: 3.6,\\n  from: 'stand', to: 'stand', needs: 'table', holds: {}, ends: {}, events: [{ u: 0.4, type: 'cut' }, { u: 0.7, type: 'cut' }],\\n  next: ['trolley.present', 'trolley.push', 'staff.idle'],\\n  pose: function (u) {\\n    // Lutad över brädan: vänster hand håller osten, höger skär två gånger med långa drag, sedan en bit upp på kniven.\\n    const lean = win(u, 0.05, 0.92, 0.12), saw = Math.sin(u * TAU * 4) * win(u, 0.2, 0.8, 0.08), lift = win(u, 0.8, 0.98, 0.06);\\n    return P(STAND, { lift: -0.02 * lean, torso: { pitch: 0.06 + 0.32 * lean }, head: { pitch: 0.2 + 0.35 * lean }, armL: A(0.7, 0.18, 0.95), armR: A(0.6 + 0.12 * saw + 0.25 * lift, 0.14, 0.8 - 0.1 * saw), legL: LEG_FRONT, legR: LEG_BACK });\\n  }\\n}));\\n\\nreg(def({\\n  id: 'flambe.pour', group: 'waiter', roles: ['host', 'waiter', 'sommelier', 'staff'], loop: false, travel: false, base: 2.4,\\n  from: 'stand', to: 'stand', needs: 'table', holds: {}, ends: {}, events: [{ u: 0.82, type: 'light' }],\\n  next: ['flambe.tilt'],\\n  pose: function (u) {\\n    // Vänster hand på pannans skaft över réchauden. Höger tar flaskan från vagnen och häller en skvätt, låg, nära pannan.\\n    const reach = win(u, 0.0, 0.85, 0.15), pour = win(u, 0.42, 0.78, 0.1);\\n    return P(STAND, { torso: { pitch: 0.16 + 0.08 * reach }, head: { pitch: 0.3 + 0.15 * pour }, armL: A(0.68, 0.14, 0.72), armR: A(0.55 + 0.25 * reach, 0.16 + 0.1 * pour, 1.05 - 0.2 * reach), legL: LEG_FRONT, legR: LEG_BACK });\\n  },\\n  tilt: function (u) { return { R: { pitch: 1.4 * win(u, 0.42, 0.78, 0.1) } }; }\\n}));\\n\\nreg(def({\\n  id: 'flambe.tilt', group: 'waiter', roles: ['host', 'waiter', 'sommelier', 'staff'], loop: false, travel: false, base: 3.4,\\n  from: 'stand', to: 'stand', needs: 'table', holds: {}, ends: {}, events: [{ u: 0.06, type: 'light' }],\\n  next: ['trolley.present', 'staff.idle', 'trolley.push'],\\n  pose: function (u) {\\n    // Pannan lutas mot lågan och den tar sig (u 0,06). Bålen drar sig lugnt bakåt ett ögonblick, inte ett ryck,\\n    // sedan två mjuka varv med pannan medan lågan sjunker. Höger hand öppen mot gästerna på slutet.\\n    const back = win(u, 0.05, 0.3, 0.1), swirl = Math.sin(u * TAU * 2) * win(u, 0.3, 0.8, 0.1), show = win(u, 0.78, 1, 0.12);\\n    return withYaw(P(STAND, { torso: { pitch: 0.16 - 0.14 * back }, head: { pitch: 0.3 - 0.2 * back }, armL: A(0.68 + 0.06 * swirl, 0.14 + 0.05 * swirl, 0.72), armR: A(0.2 + 0.45 * show, 0.1 + 0.35 * show, 0.5), legL: LEG_FRONT, legR: LEG_BACK }), 0.2 * show, 0.3 * show);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'staff.tiredIdle', group: 'staff', roles: STAFF, loop: true, travel: false, base: 4.4,\\n  from: 'stand', to: 'stand', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['staff.tiredIdle', 'staff.idle', 'staff.walk'],\\n  pose: function (u, c) {\\n    // Låg ork: axlarna ned, tyngden på ett ben, handen mot ländryggen en gång per varv. Ingen puls, bara hållningen.\\n    const back = win(u, 0.3, 0.75, 0.15);\\n    return breathe(P(STAND, { lift: -0.015, torso: { pitch: 0.1, roll: 0.05 }, head: { pitch: 0.22 }, armL: A(0.04, 0.02, 0.12), armR: A(-0.35 * back, 0.12 * back, 1.6 * back + 0.1), legL: { ...LEG_STAND, knee: 0.16 }, legR: LEG_STAND }), (c.t ?? 0) * 0.7);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'staff.hesitate', group: 'staff', roles: STAFF, loop: false, travel: false, base: 2.2,\\n  from: 'stand', to: 'stand', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['staff.idle', 'staff.walk', 'staff.listen'],\\n  pose: function (u) {\\n    // Kunskapen saknas: handen till hakan, en blick åt sidan mot en kollega och tillbaka. Kortare i lugnt tempo.\\n    const chin = win(u, 0.08, 0.86, 0.14), look = win(u, 0.3, 0.62, 0.1);\\n    return withYaw(P(STAND, { torso: { pitch: 0.04 }, head: { pitch: 0.12 - 0.06 * chin }, armR: A(0.3 + 0.2 * chin, 0.12, 0.2 + 1.9 * chin), armL: A(0.25 * chin, 0.05, 1.3 * chin + 0.15) }), 0.15 * look, 0.7 * look);\\n  }\\n}));\\n\\n/** Gesterna per stämning, i den ordning sim-lagret väljer dem. Sittande; stående i kön har egna klipp. */\\nexport const MOOD_GESTURES: Record<MoodId, string[]> = {\\n  delighted: ['guest.laugh', 'guest.cheers'],\\n  content: ['guest.nodApprove', 'guest.leanCurious'],\\n  waiting: ['guest.checkWatch'],\\n  impatient: ['guest.waveWaiter', 'guest.checkWatch'],\\n  displeased: ['guest.armsCrossed', 'guest.pushPlate']\\n};\\n\\nfunction blendArm(a: PoseArm, b: PoseArm, k: number): PoseArm {\\n  const m = function (x: number | undefined, y: number | undefined) { return (x ?? 0) + ((y ?? 0) - (x ?? 0)) * k; };\\n  return { swing: m(a.swing, b.swing), lift: m(a.lift, b.lift), elbow: m(a.elbow, b.elbow) };\\n}\\n\\n// ---------- uppspelning -----------------------------------------------\\n\\nexport function clipSeconds(id: string, tempo: TempoId): number {\\n  return CLIPS[id].seconds[tempo];\\n}\\n\\n/** Sekunder från klippets start till första händelsen av en typ (och hand, om angiven). */\\nexport function eventTime(id: string, type: ClipEventType, tempo: TempoId, hand?: HandSide): number {\\n  const c = CLIPS[id];\\n  const e = c.events.find(function (x) { return x.type === type && (hand === undefined || x.hand === hand); });\\n  if (!e) return -1;\\n  return e.u * c.seconds[tempo];\\n}\\n\\n/**\\n * Ett klipp vid tiden `time` sekunder sedan klippet började. Loopar tar fasen modulo en\\n * cykel. Klipp som går (travel) tar ctx.phase från sträckan och bryr sig inte om tiden.\\n */\\nexport function sampleClip(id: string, time: number, tempo: TempoId, ctx?: ClipCtx): ClipSample {\\n  const c = CLIPS[id];\\n  const T = TEMPO[tempo];\\n  const sec = c.seconds[tempo];\\n  const t = Math.max(0, time);\\n  let u = c.loop ? (t / sec) % 1 : clamp01(t / sec);\\n  const cx: ClipCtx = { ...(ctx ?? {}), t: t, stress: ctx?.stress ?? T.stress, stride: T.stride };\\n  if (c.travel) { cx.phase = ctx?.phase ?? t / sec; u = ((cx.phase % 1) + 1) % 1; }\\n  const mirror = c.handed === true && cx.hand === 'L';\\n  if (mirror) cx.yaw = -(cx.yaw ?? 0);\\n  let pose = c.pose(u, cx);\\n  let tilt = c.tilt ? c.tilt(u, cx) : {};\\n  let root: [number, number, number] = c.root ? c.root(u, cx) : [0, 0, 0];\\n  if (mirror) {\\n    pose = mirrorPose(pose);\\n    tilt = { L: tilt.R, R: tilt.L };\\n    root = [-root[0], root[1], -root[2]];\\n  }\\n  if (c.roles.indexOf('guest') < 0 && c.group !== 'rocket') pose = strain(pose, (cx.stress ?? 0) * 0.6);\\n  let chairPull = c.chair ? c.chair(u) : 0;\\n  if ((pose.hipDrop ?? 0) > 0 && c.roles.indexOf('guest') >= 0) {\\n    const authored: SeatKind = c.seatKind ?? 'chair';\\n    const target: SeatKind = c.seatKind ?? cx.seatKind ?? 'chair';\\n    pose = reseat(pose, authored, target, cx.heightMult ?? 1);\\n    if (target !== 'chair') chairPull = 0;\\n    // Resa sig från loungen går framåt, inte bakåt in i ryggstödet.\\n    if (authored === 'chair' && target === 'lounge' && c.root) root = [root[0], Math.abs(root[1]) * 1.2, root[2]];\\n  }\\n  // Sittande och på väg ned eller upp: ingen fot under golvet. Lyfter kroppen det som saknas.\\n  if (c.roles.indexOf('guest') >= 0 && (c.from === 'seated' || c.to === 'seated') && !c.travel) {\\n    const sole = soleHeight(pose, cx.heightMult ?? 1);\\n    if (sole < 0) pose = { ...pose, lift: (pose.lift ?? 0) - sole };\\n  }\\n  const keep = ctx?.keep;\\n  if (keep) pose = { ...pose, armL: keep.L ?? pose.armL, armR: keep.R ?? pose.armR };\\n  return { pose: pose, tilt: tilt, root: root, chair: chairPull, u: u };\\n}\\n\\n/**\\n * Lägger om en sittande pose från den sits den är författad för till en annan. Hur sittande\\n * posen är (k) läses ur höftens sänkning, så övergångar (resa sig, sätta sig) läggs om lika\\n * mycket som de sitter. Därefter läggs seatLift till, så att höften landar på sitsen även\\n * för en skalad gäst.\\n */\\nexport function reseat(p: FigurePose, from: SeatKind, to: SeatKind, heightMult: number): FigurePose {\\n  const F = SEAT_KINDS[from], T = SEAT_KINDS[to];\\n  const k = clamp01((p.hipDrop ?? 0) / F.drop);\\n  let r = p;\\n  if (from !== to) {\\n    const leg = function (l: any) {\\n      const a = l ?? {};\\n      const m = function (x: number | undefined, y: number) { return (x ?? 0) + (y - (x ?? 0)) * k; };\\n      return { swing: m(a.swing, T.legs.swing), spread: m(a.spread, T.legs.spread), knee: m(a.knee, T.legs.knee), ankle: m(a.ankle, T.legs.ankle) };\\n    };\\n    const t = p.torso ?? {}, h = p.head ?? {};\\n    r = {\\n      ...p, hipDrop: k * T.drop, legL: leg(p.legL), legR: leg(p.legR),\\n      torso: { ...t, pitch: (t.pitch ?? 0) + k * (T.torso - F.torso) },\\n      head: { ...h, pitch: (h.pitch ?? 0) + k * (T.head - F.head) }\\n    };\\n  }\\n  const kt = clamp01((r.hipDrop ?? 0) / T.drop);\\n  r = { ...r, lift: (r.lift ?? 0) + kt * seatLift(to, heightMult) };\\n  return plantFeet(r, to, heightMult, kt);\\n}\\n\\n/** Sulans lägsta punkt över golvet, räknad i figurens sidoplan (höft → knä → fotled → fotens\\n *  fyra hörn). Samma led och mått som figureRig. Räcker för att hålla fötterna ovan golvet\\n *  när någon sätter sig eller reser sig. */\\nexport function soleHeight(p: FigurePose, heightMult: number): number {\\n  const hm = heightMult ?? 1;\\n  const h = p.hipDrop ?? 0;\\n  const body = (p.lift ?? 0) - h + FIGURE.hipY * (1 - hm) * Math.min(1, h / FIGURE.seatedHipDrop);\\n  const hipY = body + FIGURE.hipY * hm;\\n  let low = 9;\\n  [p.legL, p.legR].forEach(function (l: any) {\\n    const L = l ?? {};\\n    const t1 = -(L.swing ?? 0), t2 = t1 + (L.knee ?? 0), t3 = t2 - (L.ankle ?? 0);\\n    const ankleY = hipY - FIGURE.thigh * hm * Math.cos(t1) - FIGURE.shin * hm * Math.cos(t2);\\n    const back = -0.055, front = FIGURE.footLength - 0.055;\\n    [[0, back], [0, front], [-FIGURE.footHeight, back], [-FIGURE.footHeight, front]].forEach(function (q) {\\n      low = Math.min(low, ankleY + hm * (q[0] * Math.cos(t3) - q[1] * Math.sin(t3)));\\n    });\\n  });\\n  return low;\\n}\\n\\n/**\\n * Sätter fötterna i golvet (stol, lounge) eller på fotringen (barstol) när figuren sitter\\n * eller är på väg ned. Höftens vinkel behålls; knät och fotleden räknas ut så att fotleden\\n * hamnar på rätt höjd och sulan står plan. Riktningen (fötterna bakom eller framför knät)\\n * tas från posen. Når benet inte ned hänger foten, som för en kort gäst på en hög sits.\\n * Det här är den enkla ben-IK som figureRig FRÅGOR §3 och §5 efterfrågade, för sittande.\\n */\\nexport function plantFeet(p: FigurePose, kind: SeatKind, heightMult: number, k: number): FigurePose {\\n  const hm = heightMult ?? 1;\\n  const h = p.hipDrop ?? 0;\\n  if (kind === 'stool' ? k < 0.9 : h < 0.05) return p;\\n  const body = (p.lift ?? 0) - h + FIGURE.hipY * (1 - hm) * Math.min(1, h / FIGURE.seatedHipDrop);\\n  const pelvisY = body + FIGURE.hipY * hm;\\n  const target = (kind === 'stool' ? (SEAT_KINDS.stool.footrest ?? 0.3) : 0) + FIGURE.ankleY * hm;\\n  const w = kind === 'stool' ? ramp(k, 0.9, 1) : 1;\\n  const leg = function (l: any) {\\n    const L = l ?? {};\\n    const sw = L.swing ?? 0;\\n    const sgn = (L.knee ?? 0) - sw >= 0 ? 1 : -1;\\n    const c = (pelvisY - target - FIGURE.thigh * hm * Math.cos(sw)) / (FIGURE.shin * hm);\\n    const ang = Math.acos(Math.max(-1, Math.min(1, c)));\\n    const knee = sw + sgn * ang, ankle = sgn * ang;\\n    return { ...L, knee: (L.knee ?? 0) + (knee - (L.knee ?? 0)) * w, ankle: (L.ankle ?? 0) + (ankle - (L.ankle ?? 0)) * w };\\n  };\\n  return { ...p, legL: leg(p.legL), legR: leg(p.legR) };\\n}\\n\\n/** Övergång mellan två klipp: blanda från föregående klipps sista pose under TEMPO.blendSec. */\\nexport function crossfade(prev: ClipSample, next: ClipSample, sinceStart: number, tempo: TempoId): ClipSample {\\n  const k = clamp01(sinceStart / TEMPO[tempo].blendSec);\\n  if (k >= 1) return next;\\n  return { ...next, pose: blendPose(prev.pose, next.pose, smooth(k)) };\\n}\\n\\n// ---------- prov ------------------------------------------------------\\n\\n/** Kontrollerar katalogen: att varje efterföljare finns, att läget i slutet av ett klipp är\\n *  läget i början av efterföljaren, och att det ett klipp håller i slutet är det nästa\\n *  klipp börjar med. Returnerar en lista med fel; tom lista = godkänt. */\\nexport function validateClips(): string[] {\\n  const errors: string[] = [];\\n  const compatible = function (a: Stance, b: Stance): boolean {\\n    if (a === b) return true;\\n    return (a === 'walk' && b === 'stand') || (a === 'stand' && b === 'walk') || (a === 'hurt' && b === 'walk');\\n  };\\n  Object.keys(CLIPS).forEach(function (id) {\\n    const c = CLIPS[id];\\n    c.next.forEach(function (n) {\\n      const d = CLIPS[n];\\n      if (!d) { errors.push(id + ' → ' + n + ': finns inte'); return; }\\n      if (!compatible(c.to, d.from)) errors.push(id + ' → ' + n + ': slutar ' + c.to + ', nästa börjar ' + d.from);\\n    });\\n    c.events.forEach(function (e) { if (e.u < 0 || e.u > 1) errors.push(id + ': händelse utanför 0..1'); });\\n    if (c.seatKind && c.needs !== c.seatKind && !(c.seatKind === 'chair' && c.needs === 'chair')) errors.push(id + ': seatKind ' + c.seatKind + ' men needs ' + c.needs);\\n  });\\n  return errors;\\n}\\n\\n/** Tabellen i LEVERANSNOT byggs ur den här. */\\nexport function clipTable() {\\n  return Object.keys(CLIPS).map(function (id) {\\n    const c = CLIPS[id];\\n    return { id: id, group: c.group, loop: c.loop, travel: c.travel, seconds: c.seconds, from: c.from, to: c.to, needs: c.needs, seatKind: c.seatKind, holds: c.holds, ends: c.ends, events: c.events, next: c.next };\\n  });\\n}\\n\",\"asaClips.ts\":\"// asaClips.ts — Åsas tre klipp: hälsar, pekar mot en plats och nickar gillande. D6, 2026-10-07 (ORDER 313 §1).\\n//\\n// Läggs in i figureClips.ts efter staff.idle. Använder filens egna hjälpare (reg, def, keys, P, A, STAND, win, bell,\\n// withYaw) och samma kontrakt: rena funktioner, inga nya led, längd per tempo via def() (base / rate).\\n// Typer: Role + 'mentor'. ClipGroup + 'mentor'.\\n//\\n// Längder (s): asa.greet 3,00 / 2,40 / 1,60, asa.point 3,25 / 2,60 / 1,75, asa.nodApprove 2,75 / 2,20 / 1,45.\\n// Åsa spelas nästan alltid lugnt. Hon har bråttom bara om scenen har det.\\n//\\n// ── Läsbarhet ────────────────────────────────────────────────────\\n// Hatten är det kameran ser från 24 m, så alla tre klippen rör hatten: handen till brättet när hon hälsar,\\n// brättet vrids mot platsen när hon pekar, och brättet gungar två gånger när hon nickar.\\n//   asa.greet       Höger hand upp till brättet, en liten bugning, handen ned. Läses som ett hej på avstånd.\\n//   asa.point       Bålen och huvudet vrids mot platsen (ctx.yaw), armen rak ut i axelhöjd, stilla, tillbaka.\\n//                   Pekar mot Måltidens hus, bankens dörr eller vinbarens skylt. Vänster arm om platsen ligger till\\n//                   vänster (ctx.hand = 'L', handed).\\n//   asa.nodApprove  Händerna knäppta framför sig, två långsamma nickar och en lätt lutning bakåt. Gillande, aldrig\\n//                   rätt eller fel: ingen färg, ingen puls.\\n\\nreg(def({\\n  id: 'asa.greet', group: 'mentor', roles: ['mentor'], loop: false, travel: false, handed: true, base: 2.4,\\n  from: 'stand', to: 'stand', needs: 'floor', holds: {}, ends: {}, events: [{ u: 0.3, type: 'signal' }],\\n  next: ['staff.idle', 'asa.point', 'asa.nodApprove'],\\n  pose: function (u, c) {\\n    const touch = P(STAND, { torso: { roll: -0.03 }, armR: A(1.72, 0.16, 2.2), armL: A(0.08, 0.04, 0.2) });\\n    const bow = P(touch, { torso: { pitch: 0.12 }, head: { pitch: 0.26 } });\\n    const p = keys(u, [\\n      [0, STAND],\\n      [0.26, touch],\\n      [0.44, bow],\\n      [0.6, bow],\\n      [0.74, touch],\\n      [0.94, STAND],\\n      [1, STAND]\\n    ]);\\n    const toward = (c.yaw ?? 0) * win(u, 0.1, 0.9, 0.15);\\n    return withYaw(p, toward * 0.3, toward * 0.7);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'asa.point', group: 'mentor', roles: ['mentor'], loop: false, travel: false, handed: true, base: 2.6,\\n  from: 'stand', to: 'stand', needs: 'floor', holds: {}, ends: {}, events: [{ u: 0.4, type: 'signal' }],\\n  next: ['staff.idle', 'asa.nodApprove', 'asa.greet'],\\n  pose: function (u, c) {\\n    // 0–0,3 vrider sig och lyfter armen, 0,3–0,72 stilla (förlängs med c.holdUntil), 0,72–1 tillbaka.\\n    const k = win(u, 0.04, 0.96, 0.28), yaw = (c.yaw ?? 0) * k;\\n    const p = P(STAND, {\\n      torso: { pitch: 0.03 - 0.03 * k, roll: -0.04 * k }, head: { pitch: 0.04 - 0.06 * k },\\n      armR: A(0.1 + 1.42 * k, 0.12 + 0.1 * k, 0.15 - 0.1 * k),\\n      armL: A(0.1 + 0.12 * k, 0.05, 0.35 + 0.5 * k)\\n    });\\n    return withYaw(p, yaw * 0.55, yaw * 0.9);\\n  },\\n  tilt: function (u) { return { R: { pitch: 0.1 * win(u, 0.04, 0.96, 0.28) } }; } // pekfingret i armens linje\\n}));\\n\\nreg(def({\\n  id: 'asa.nodApprove', group: 'mentor', roles: ['mentor'], loop: false, travel: false, base: 2.2,\\n  from: 'stand', to: 'stand', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['staff.idle', 'asa.point', 'asa.greet'],\\n  pose: function (u, c) {\\n    const clasp = win(u, 0.02, 0.98, 0.18);\\n    const nod = 0.24 * bell(u, 0.36, 0.07) + 0.24 * bell(u, 0.62, 0.07);\\n    const back = 0.05 * win(u, 0.7, 0.98, 0.12);\\n    const p = P(STAND, {\\n      torso: { pitch: 0.03 - back }, head: { pitch: 0.04 + nod - back },\\n      armR: A(0.08 + 0.34 * clasp, -0.02 - 0.06 * clasp, 0.2 + 0.95 * clasp),\\n      armL: A(0.08 + 0.34 * clasp, -0.02 - 0.06 * clasp, 0.2 + 0.95 * clasp)\\n    });\\n    const toward = (c.yaw ?? 0) * clasp;\\n    return withYaw(p, toward * 0.25, toward * 0.7);\\n  }\\n}));\\n\",\"asaFigure.ts\":\"// asaFigure.ts — Intendent Åsa, mentorn från Campus. D6, 2026-10-07 (ORDER 313 §1).\\n//\\n// Åsa byggs på figureRig som personalen (variant 'staff', höjdlåst 1,70 m utan hatt) och kläs med dressAsa().\\n// Utseendet enligt beställningen: mörkt, ganska kort hår (en page till käklinjen), en blåvit klänning och en\\n// matchande stor hatt med brett brätte, klassiskt och elegant. Inga varumärken eller logotyper.\\n//\\n// ── Läsbarhet ────────────────────────────────────────────────────\\n// Från 24 m och uppifrån är det hatten kameran ser. Brättet är 0,66 m brett (turistens solhatt är 0,46 m och\\n// ljust kräm), djupblått med en vit kant, och kullen är vit med ett blått band. Uppifrån blir det en blå skiva\\n// med vit ring och vit mitt, som ingen annan figur har. Från sidan och på nära håll läses klänningen: blått liv,\\n// vit krage och vitt skärp, och en klockformad kjol med vit fåll till mitt på vaden.\\n// Klänningens blå ligger i kontrastbandet för kroppar (L 0,0509–0,0913, guestGroups.ts): #24477a har L 0,0604.\\n// Inget rött och inget grönt. Det blå är ett annat än spelarens vagn (#2f4b6e, dalablå) och kockens ring (#7fa8ff).\\n//\\n// ── I spelet ─────────────────────────────────────────────────────\\n// Ersätter mentorn (MENTOR_GARMENT #585b31 i wineBarRoom.ts, Ingrid i öppningen). Hatten bärs alltid, också inne.\\n// Kjolen hänger i pelvis, så den följer kroppen men inte bålens lutning. Åsa sitter inte i några klipp. Om hon\\n// ska sitta senare plattas kjolen till med setAsaSeated(rig, true).\\n// Hatten höjer figuren till 1,81 m. headAnchor flyttas upp över kullen, så pip och nål hamnar ovanför hatten.\\n\\nimport * as THREE from 'three';\\n\\nexport const ASA = {\\n  id: 'asa',\\n  role: 'mentor',\\n  dress: '#24477a',\\n  dressShade: '#1b3760',\\n  white: '#eef0ec',\\n  hatBrim: '#2b5797',\\n  hatCrown: '#eef0ec',\\n  hatBand: '#24477a',\\n  hair: '#1f1814',\\n  skin: '#d6b08a',\\n  /** Mått i meter. */\\n  brimRadius: 0.33,\\n  crownRadius: 0.118,\\n  crownHeight: 0.105,\\n  skirtTop: 0.19,\\n  skirtBottom: 0.335,\\n  skirtLength: 0.6,\\n  /** Hjässan med hatt. */\\n  heightWithHat: 1.81\\n};\\n\\n/** Riggens alternativ för Åsa. Skicka till createFigureRig och klä sedan med dressAsa. */\\nexport const ASA_RIG_OPTIONS = { variant: 'staff' as const, garmentColour: ASA.dress, limbColour: ASA.dressShade, skinColour: ASA.skin };\\n\\nexport function createAsa(R: { createFigureRig: (o: any) => any }): any {\\n  const rig = R.createFigureRig(ASA_RIG_OPTIONS);\\n  dressAsa(rig);\\n  return rig;\\n}\\n\\n/** Lägger håret, hatten och klänningen på en figurrigg (figureRig: joints.head, joints.chest, joints.pelvis). */\\nexport function dressAsa(rig: any): THREE.Object3D[] {\\n  const J = rig.joints, head = J.head, chest = J.chest, pelvis = J.pelvis;\\n  const sw = rig.shoulderWidth, depth = sw * 0.44, waist = sw * 0.78, added: THREE.Object3D[] = [];\\n  const m = (c: string, r = 0.8, side: THREE.Side = THREE.FrontSide) => { const k = new THREE.MeshStandardMaterial({ color: c, roughness: r, side }); rig.materials.push(k); return k; };\\n  const add = (parent: THREE.Object3D, geo: THREE.BufferGeometry, mat: THREE.Material, name: string) => {\\n    const o = new THREE.Mesh(geo, mat); o.name = 'asa.' + name; o.castShadow = true; o.receiveShadow = true; parent.add(o); added.push(o); return o;\\n  };\\n\\n  // Håret: en page. Toppen täcker hela hjässan, sidorna och nacken går ned till käklinjen och lämnar ansiktet fritt.\\n  const hair = m(ASA.hair, 0.6);\\n  add(head, new THREE.SphereGeometry(0.128, 20, 10, 0, Math.PI * 2, 0, 0.95), hair, 'hairTop').position.y = 0.118;\\n  const bob = add(head, new THREE.SphereGeometry(0.132, 20, 12, Math.PI / 2 + 0.85, Math.PI * 2 - 1.7, 0.6, 1.25), hair, 'hairBob');\\n  bob.position.y = 0.112;\\n\\n  // Hatten: brett brätte i djupblått med vit kant, vit kulle med blått band. Lätt lutad framåt, som en klassisk hatt bärs.\\n  const hat = new THREE.Group(); hat.name = 'asa.hat'; hat.position.set(0, 0.205, 0.004); hat.rotation.x = 0.07; head.add(hat); added.push(hat);\\n  // Brättet sluttar svagt nedåt mot kanten (en flack kon), som en klassisk damhatt, och kullen är rundad.\\n  add(hat, new THREE.CylinderGeometry(ASA.crownRadius + 0.01, ASA.brimRadius, 0.04, 40, 1, true), m(ASA.hatBrim, 0.75, THREE.DoubleSide), 'brim').position.y = -0.008;\\n  const edge = add(hat, new THREE.TorusGeometry(ASA.brimRadius - 0.004, 0.011, 6, 48), m(ASA.white, 0.7), 'brimEdge'); edge.rotation.x = Math.PI / 2; edge.position.y = -0.028;\\n  add(hat, new THREE.CylinderGeometry(ASA.crownRadius * 0.9, ASA.crownRadius, ASA.crownHeight * 0.75, 28), m(ASA.hatCrown, 0.75), 'crown').position.y = ASA.crownHeight * 0.375 + 0.006;\\n  const dome = add(hat, new THREE.SphereGeometry(ASA.crownRadius * 0.9, 24, 8, 0, Math.PI * 2, 0, Math.PI / 2), m(ASA.hatCrown, 0.75), 'dome'); dome.position.y = ASA.crownHeight * 0.75 + 0.004; dome.scale.y = 0.35;\\n  add(hat, new THREE.CylinderGeometry(ASA.crownRadius + 0.004, ASA.crownRadius + 0.004, 0.03, 28), m(ASA.hatBand, 0.6), 'band').position.y = 0.024;\\n  // Rosetten på bandet, vänster sida. Ingen logotyp.\\n  add(hat, new THREE.SphereGeometry(0.026, 10, 8), m(ASA.hatBand, 0.6), 'bow').position.set(-ASA.crownRadius - 0.01, 0.026, 0.02);\\n\\n  // Klänningen: vit krage, vitt skärp i midjan, vita manschetter, och kjolen.\\n  const white = m(ASA.white, 0.7);\\n  const collar = add(chest, new THREE.TorusGeometry(0.085, 0.022, 8, 22), white, 'collar'); collar.rotation.x = Math.PI / 2; collar.position.y = 0.575;\\n  add(chest, new THREE.BoxGeometry(waist + 0.012, 0.05, depth * 0.92 + 0.012), white, 'belt').position.y = 0.235;\\n  ['L', 'R'].forEach((s) => { const e = J['elbow' + s]; if (!e) return; add(e, new THREE.CylinderGeometry(0.05, 0.05, 0.04, 10), white, 'cuff' + s).position.y = -0.22; });\\n  const skirt = new THREE.Group(); skirt.name = 'asa.skirt'; pelvis.add(skirt); added.push(skirt);\\n  add(skirt, new THREE.CylinderGeometry(ASA.skirtTop, ASA.skirtBottom, ASA.skirtLength, 28, 1, true), m(ASA.dress, 0.85, THREE.DoubleSide), 'skirt').position.y = 0.02 - ASA.skirtLength / 2;\\n  add(skirt, new THREE.CylinderGeometry(ASA.skirtBottom + 0.003, ASA.skirtBottom + 0.006, 0.07, 28, 1, true), m(ASA.white, 0.75, THREE.DoubleSide), 'hem').position.y = 0.02 - ASA.skirtLength + 0.035;\\n  rig.asaSkirt = skirt;\\n\\n  // Pip och nål ovanför hatten.\\n  if (J.headAnchor) J.headAnchor.position.y += 0.11;\\n  return added;\\n}\\n\\n/** Kjolen när Åsa sitter: kortare och vidare, så den inte går genom stolen. Inget klipp använder det än. */\\nexport function setAsaSeated(rig: any, seated: boolean): void {\\n  const s = rig.asaSkirt; if (!s) return;\\n  s.scale.set(seated ? 1.25 : 1, seated ? 0.45 : 1, seated ? 1.25 : 1);\\n}\\n\",\"figureFace.ts\":\"// figureFace.ts — ansiktena i närbild. Leverans 2026-10-03 (D1).\\n// Ett tunt skal framför huvudsfären (figureRig: head:sphere, radie 0,12) med fem uttryck: ögon, bryn och mun\\n// i bläck på huden. Skalet sitter under kalotten och följer huvudets led, så blicken går dit huvudet vrids.\\n// Riggen ändras inte. Skalet tonas efter kamerans avstånd (guestMood.FACE): osynligt från 9 m och längre bort,\\n// fullt vid 7 m. Ett skal per figur, men geometrin och de fem texturerna delas.\\n\\nimport * as THREE from 'three';\\nimport { FIGURE } from './figureRig';\\nimport { FACE, faceOpacity } from './guestMood';\\nimport type { MoodId } from './guestMood';\\n\\n/** Skalets utsnitt av sfären. Under kalotten (som slutar 1,15 rad från hjässan) och 86° brett. */\\nconst PATCH = { phiLen: 1.5, thetaStart: 1.15, thetaLen: 1.2, lift: 1.012 };\\nconst W = 160, H = 128;   // 106,7 px per radian åt båda hållen\\n\\nlet geo: THREE.SphereGeometry | null = null;\\nconst tex = new Map<MoodId, THREE.CanvasTexture>();\\n\\nfunction draw(id: MoodId): HTMLCanvasElement {\\n  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;\\n  const x = cv.getContext('2d')!;\\n  x.fillStyle = FACE.ink; x.strokeStyle = FACE.ink; x.lineCap = 'round'; x.lineJoin = 'round';\\n  const dot = (cx: number, cy: number, r: number) => { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };\\n  const line = (a: number, b: number, c: number, d: number, w: number) => { x.lineWidth = w; x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); };\\n  const arc = (cx: number, cy: number, r: number, a0: number, a1: number, w: number) => { x.lineWidth = w; x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };\\n  const L = 46, R = 114;\\n  if (id === 'delighted') {\\n    // Glada ögon som hopknipna bågar och en öppen mun.\\n    arc(L, 38, 11, Math.PI * 1.05, Math.PI * 1.95, 10); arc(R, 38, 11, Math.PI * 1.05, Math.PI * 1.95, 9);\\n    x.beginPath(); x.moveTo(54, 74); x.quadraticCurveTo(80, 112, 106, 74); x.closePath(); x.fill();\\n  } else if (id === 'content') {\\n    dot(L, 32, 10); dot(R, 32, 10);\\n    arc(80, 58, 28, Math.PI * 0.22, Math.PI * 0.78, 9);\\n  } else if (id === 'waiting') {\\n    // Blicken åt sidan, mot dörren eller personalen, och munnen rak.\\n    dot(L + 8, 32, 10); dot(R + 8, 32, 10);\\n    line(66, 86, 96, 86, 9);\\n  } else if (id === 'impatient') {\\n    dot(L, 34, 9.5); dot(R, 34, 9.5);\\n    line(32, 19, 60, 21, 9); line(100, 21, 128, 19, 9);\\n    line(64, 88, 96, 82, 9);\\n  } else {\\n    // Missnöjd: bryn som sluttar inåt och en mun som går nedåt.\\n    dot(L, 35, 9.5); dot(R, 35, 9.5);\\n    line(30, 15, 60, 24, 9); line(100, 24, 130, 15, 9);\\n    arc(80, 112, 26, Math.PI * 1.25, Math.PI * 1.75, 9);\\n  }\\n  return cv;\\n}\\n\\nfunction texture(id: MoodId): THREE.CanvasTexture {\\n  let t = tex.get(id);\\n  if (!t) {\\n    t = new THREE.CanvasTexture(draw(id));\\n    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;\\n    // SphereGeometry lägger u = 0 på figurens vänstra sida; speglas så att bilden ses rättvänd framifrån.\\n    t.wrapS = THREE.RepeatWrapping; t.repeat.set(-1, 1); t.offset.set(1, 0);\\n    tex.set(id, t);\\n  }\\n  return t;\\n}\\n\\nexport interface FaceHandle { mesh: THREE.Mesh; mood: MoodId; set: (m: MoodId) => void; update: (camera: THREE.Camera) => number; dispose: () => void }\\n\\n/** Sätter ett ansikte på riggens huvud. Anropa update(camera) varje bildruta efter applyPose. */\\nexport function attachFace(rig: { joints: { head: THREE.Object3D } }, mood?: MoodId): FaceHandle {\\n  const r = FIGURE.headRadius;\\n  if (!geo) geo = new THREE.SphereGeometry(r * PATCH.lift, 16, 12, Math.PI / 2 - PATCH.phiLen / 2, PATCH.phiLen, PATCH.thetaStart, PATCH.thetaLen);\\n  const mat = new THREE.MeshStandardMaterial({ map: texture(mood ?? 'content'), transparent: true, opacity: 0, depthWrite: false, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -2 });\\n  const mesh = new THREE.Mesh(geo, mat);\\n  mesh.name = 'face'; mesh.position.y = r; mesh.renderOrder = 2; mesh.visible = false;\\n  rig.joints.head.add(mesh);\\n  const V = new THREE.Vector3(), C = new THREE.Vector3();\\n  const h: FaceHandle = {\\n    mesh, mood: mood ?? 'content',\\n    set(m) { if (m === h.mood) return; h.mood = m; mat.map = texture(m); mat.needsUpdate = true; },\\n    update(camera) {\\n      mesh.getWorldPosition(V); camera.getWorldPosition(C);\\n      const k = faceOpacity(V.distanceTo(C));\\n      mat.opacity = k; mesh.visible = k > 0.01;\\n      return k;\\n    },\\n    dispose() { mesh.removeFromParent(); mat.dispose(); }\\n  };\\n  return h;\\n}\\n\\n/** Bilden för ett uttryck, för dokumentationen. */\\nexport function faceCanvas(id: MoodId): HTMLCanvasElement { return draw(id); }\\n\",\"guestMood.ts\":\"// guestMood.ts — gästernas stämning. Leverans 2026-10-03 (D1), tillägg till vardagens koreografi.\\n// Fem lägen, symbolerna över borden, ansiktena i närbild, mätaren i HUD:en och konsekvensögonblicket\\n// efter ett raketsvar. Den varma formen (nexusTheme.warm.ts) och regeln från 2026-09-30 gäller:\\n// rött och grönt är bara rätt och fel svar, så ingen stämning är röd eller grön.\\n// Inga speltal: gränser, vikter och förändringar ligger i balance.ts (MOOD_BALANCE nedan är nycklarna).\\n\\nexport type MoodId = 'delighted' | 'content' | 'waiting' | 'impatient' | 'displeased';\\n\\n/** Bäst först. Indexet är också mätarens steg (0 = glad). */\\nexport const MOODS: MoodId[] = ['delighted', 'content', 'waiting', 'impatient', 'displeased'];\\n\\n/** Nycklarna i balance.ts. Code sätter värdena; null tills dess. */\\nexport const MOOD_BALANCE = {\\n  /** Gästens stämning 0..1 → läge. Under gränsen gäller nästa läge. */\\n  threshold: { delighted: null as number | null, content: null as number | null, waiting: null as number | null, impatient: null as number | null },\\n  /** Hur mycket ett raketsvar flyttar de gäster som såg det: {gain} vid rätt, {loss} vid fel. */\\n  rocket: { gain: null as number | null, loss: null as number | null, witnessRadiusM: null as number | null },\\n  /** Väntan utan att någon kommer: stämningen sjunker {decay} per spelminut. */\\n  decayPerGameMinute: null as number | null,\\n  /** Rummets mätare är medelvärdet av gästernas stämning, vägt per sällskap. */\\n  roomWeighting: 'perParty' as 'perParty' | 'perGuest'\\n};\\n\\n// ---------- symbolerna ----------------------------------------------------\\n// En rund bricka med en ritad figur, 24 px på skärmen oavsett kamerans avstånd. Två grupper:\\n// ljus bricka med mörk figur (allt är bra eller på väg) och mörk bricka med ljus figur och\\n// mässingskant (det behövs något). Figuren skiljer lägena åt, inte färgen: solgnistor, hjärta,\\n// timglas, väckarklocka och moln. Mätt i full storlek i båda ljusen (kontrollbilderna symboler-*).\\n\\nexport interface GlyphPart { d: string; mode: 'fill' | 'stroke'; w?: number; evenodd?: boolean }\\nexport interface MoodSymbolSpec { plate: string; rim: string; glyph: string; halo: string; parts: GlyphPart[]; group: 'light' | 'dark' }\\n\\nexport const MOOD_SYMBOL = {\\n  sizePx: 24,\\n  /** Ritat på ett rutnät 24 × 24. Brickan har radien 10,5 och kanten 2 px. */\\n  grid: 24, plateR: 10.5, rimW: 2,\\n  /** Över bordets mitt (småbord), över dynornas mitt i loungen (huvudena skymmer annars bordet), eller över\\n   *  huvudet på en ensam gäst (bar, kö). Meter över golvet; guestHeadM räknas från hjässan. */\\n  anchor: { tableM: 1.6, loungeM: 1.75, guestHeadM: 0.42 },\\n  /** Mellan två symboler som skulle överlappa på skärmen: minst 4 px, den senast ändrade överst. */\\n  minGapPx: 4,\\n  /** Visas: alltid för väntar, otålig och missnöjd. Glad och nöjd i {showPositiveS} s efter att läget ändrats. */\\n  show: { always: ['waiting', 'impatient', 'displeased'] as MoodId[], showPositiveS: 4, fadeS: 0.4 },\\n  /** Rörelserna följer svarsraderna (WARM_RIGHT_WRONG.motion): bättre lyfter, sämre skakar. Aldrig puls. */\\n  motion: {\\n    better: { from: 0, scale: [0.6, 1.08, 1], scaleMs: [0, 220, 360], lift: { px: -6, to: 520, curve: 'sin' } },\\n    worse: { from: 0, scale: [0.6, 1], scaleMs: [0, 200], shake: { px: 4, cycles: 3, from: 120, to: 480, damped: true } },\\n    reducedMotion: 'tonas in på 160 ms, ingen lyftning eller skakning'\\n  },\\n  moods: {\\n    delighted: {\\n      group: 'light', plate: '#e8b93a', rim: '#2a1c13', glyph: '#2a1c13', halo: 'rgba(255,213,143,.55)',\\n      parts: [\\n        { mode: 'fill', d: 'M10.5 5.6 Q11.3 11.2 16.9 12.2 Q11.3 13.2 10.5 18.8 Q9.7 13.2 4.1 12.2 Q9.7 11.2 10.5 5.6 Z' },\\n        { mode: 'fill', d: 'M16.6 4.4 Q17 6.5 19 6.9 Q17 7.3 16.6 9.4 Q16.2 7.3 14.2 6.9 Q16.2 6.5 16.6 4.4 Z' }\\n      ]\\n    },\\n    content: {\\n      group: 'light', plate: '#f5ead5', rim: '#2a1c13', glyph: '#2a1c13', halo: 'rgba(255,213,143,.55)',\\n      parts: [{ mode: 'fill', d: 'M12 18.2 C6.8 14.6 5.6 11.8 5.6 9.9 C5.6 7.8 7.1 6.4 9 6.4 C10.4 6.4 11.4 7.2 12 8.3 C12.6 7.2 13.6 6.4 15 6.4 C16.9 6.4 18.4 7.8 18.4 9.9 C18.4 11.8 17.2 14.6 12 18.2 Z' }]\\n    },\\n    waiting: {\\n      group: 'light', plate: '#e9d9bc', rim: '#2a1c13', glyph: '#2a1c13', halo: 'rgba(255,213,143,.55)',\\n      parts: [\\n        { mode: 'fill', evenodd: true, d: 'M7.2 5.4 H16.8 V7 H15.9 C15.9 9.6 14.1 10.9 12.9 12 C14.1 13.1 15.9 14.4 15.9 17 H16.8 V18.6 H7.2 V17 H8.1 C8.1 14.4 9.9 13.1 11.1 12 C9.9 10.9 8.1 9.6 8.1 7 H7.2 Z M12 13.3 C13.1 14.1 14.3 15.1 14.3 17 H9.7 C9.7 15.1 10.9 14.1 12 13.3 Z' },\\n        { mode: 'fill', d: 'M10.2 17 Q12 15.5 13.8 17 Z' }\\n      ]\\n    },\\n    impatient: {\\n      group: 'dark', plate: '#3a281c', rim: '#f0cd82', glyph: '#ffd58f', halo: 'rgba(20,13,9,.55)',\\n      parts: [\\n        { mode: 'stroke', w: 2, d: 'M12 7.9 A5.3 5.3 0 1 1 11.99 7.9 Z' },\\n        { mode: 'stroke', w: 1.9, d: 'M12 10.3 V13.3 L14.1 14.5' },\\n        { mode: 'stroke', w: 1.9, d: 'M5.6 8.3 A3.1 3.1 0 0 1 8.4 5.5 M15.6 5.5 A3.1 3.1 0 0 1 18.4 8.3' }\\n      ]\\n    },\\n    displeased: {\\n      group: 'dark', plate: '#1a120d', rim: '#f0cd82', glyph: '#f4e6cc', halo: 'rgba(20,13,9,.55)',\\n      parts: [\\n        { mode: 'fill', d: 'M8.2 15.6 C6.2 15.6 5 14.2 5 12.6 C5 11 6.2 9.8 7.8 9.7 C8.3 7.6 10 6.3 12 6.3 C14.4 6.3 16.2 8 16.5 10.2 C18 10.3 19.1 11.5 19.1 12.9 C19.1 14.4 17.9 15.6 16.4 15.6 Z' },\\n        { mode: 'stroke', w: 1.7, d: 'M9.6 17.4 L8.9 19 M12.6 17.4 L11.9 19 M15.6 17.4 L14.9 19' }\\n      ]\\n    }\\n  } as Record<MoodId, MoodSymbolSpec>\\n};\\n\\n/** SVG för en symbol (HUD, dokumentation). Samma figurer som duken ritar i teatern. */\\nexport function moodSymbolSvg(id: MoodId, px?: number): string {\\n  const s = MOOD_SYMBOL.moods[id], n = px ?? MOOD_SYMBOL.sizePx;\\n  const parts = s.parts.map((p) => p.mode === 'fill'\\n    ? `<path d=\\\"${p.d}\\\" fill=\\\"${s.glyph}\\\"${p.evenodd ? ' fill-rule=\\\"evenodd\\\"' : ''}/>`\\n    : `<path d=\\\"${p.d}\\\" fill=\\\"none\\\" stroke=\\\"${s.glyph}\\\" stroke-width=\\\"${p.w ?? 2}\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>`).join('');\\n  return `<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"${n}\\\" height=\\\"${n}\\\" viewBox=\\\"0 0 24 24\\\"><circle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"11.6\\\" fill=\\\"${s.halo}\\\"/><circle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"${MOOD_SYMBOL.plateR}\\\" fill=\\\"${s.plate}\\\" stroke=\\\"${s.rim}\\\" stroke-width=\\\"${MOOD_SYMBOL.rimW}\\\"/>${parts}<\u002Fsvg>`;\\n}\\n\\n/** Ritar symbolen på en 2D-duk med mitten i (x, y). Path2D läser samma sökvägar som SVG:n. */\\nexport function drawMoodSymbol(ctx: CanvasRenderingContext2D, id: MoodId, x: number, y: number, px?: number, alpha?: number): void {\\n  const s = MOOD_SYMBOL.moods[id], k = (px ?? MOOD_SYMBOL.sizePx) / 24;\\n  ctx.save(); ctx.globalAlpha = alpha ?? 1; ctx.translate(x - 12 * k, y - 12 * k); ctx.scale(k, k);\\n  ctx.fillStyle = s.halo; ctx.beginPath(); ctx.arc(12, 12, 11.6, 0, Math.PI * 2); ctx.fill();\\n  ctx.fillStyle = s.plate; ctx.strokeStyle = s.rim; ctx.lineWidth = MOOD_SYMBOL.rimW;\\n  ctx.beginPath(); ctx.arc(12, 12, MOOD_SYMBOL.plateR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\\n  s.parts.forEach((p) => {\\n    const path = new Path2D(p.d);\\n    if (p.mode === 'fill') { ctx.fillStyle = s.glyph; ctx.fill(path, p.evenodd ? 'evenodd' : 'nonzero'); }\\n    else { ctx.strokeStyle = s.glyph; ctx.lineWidth = p.w ?? 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(path); }\\n  });\\n  ctx.restore();\\n}\\n\\n// ---------- ansiktena -----------------------------------------------------\\n// Fem uttryck med ögon, bryn och mun på huvudets framsida (figureFace.ts). De tänds först när kameran\\n// är nära: från 9 m mellan kameran och huvudet tonas de in, och vid 7 m är de fullt synliga.\\n// Vid 7 m är huvudet 32 px högt i 1280 × 720 och 40 px i 1440 × 900. Raketens 10–14 m och spelets\\n// 24 m visar aldrig ansikten; där bär gesterna och symbolerna stämningen.\\nexport const FACE = {\\n  fadeStartM: 9, fullM: 7,\\n  /** Personalen har alltid 'content'. Uttrycken är gästernas. */\\n  staffMood: 'content' as MoodId,\\n  /** Ett nytt uttryck byts in på 120 ms, samtidigt som gesten börjar. */\\n  swapMs: 120,\\n  ink: '#2a1c13'\\n};\\n\\nexport function faceOpacity(cameraToHeadM: number): number {\\n  const k = (FACE.fadeStartM - cameraToHeadM) / (FACE.fadeStartM - FACE.fullM);\\n  return Math.max(0, Math.min(1, k));\\n}\\n\\n// ---------- mätaren -------------------------------------------------------\\n// ”Stämningen i rummet”, i HUD:ens översta rad till höger om kassan. Ett spår i fem steg med en\\n// fyllning i guld och den aktuella symbolen. Det som förloras står kvar streckat (som fel i den\\n// varma formen) i {lossHoldMs} och tonas sedan ut. Inga siffror.\\nexport const MOOD_METER = {\\n  widthCqw: 17, minWidthPx: 230,\\n  steps: 5,\\n  fill: 'linear-gradient(90deg, #d9b476, #ffd58f)',\\n  track: 'rgba(245,234,213,.1)',\\n  lost: '2px dashed rgba(244,230,204,.75)',\\n  lossHoldMs: 1600,\\n  gainGlow: '0 0 12px rgba(232,185,58,.6)',\\n  moveMs: 900, ease: 'cubic-bezier(.4,0,.2,1)',\\n  /** Mätaren ändras bara av det som händer i rummet, och alltid efter symbolerna över borden. */\\n  delayAfterSymbolMs: 150\\n};\\n\\n// ---------- konsekvensögonblicket -----------------------------------------\\n// De 3,8 sekunderna efter ett raketsvar. Tider i sekunder från att svaret låses (WARM_RIGHT_WRONG.motion\\n// räknar från samma ögonblick). Kortet står kvar till vänster med förklaringen, så bordet ramas i de\\n// högra två tredjedelarna (frameX). Rätt och fel har olika kamerarörelser, som svarsraderna.\\nexport const CONSEQUENCE = {\\n  durationS: 3.8,\\n  /** Kortet tar 3,5–32,5 % av bredden. Det som reagerar ramas mellan 36 och 96 %: mitten av gruppen hamnar på\\n   *  frameX (62 % för ett bord, upp till 72 % för två grannbord som i födelsedagen). */\\n  frameX: { oneTable: 0.62, twoTables: 0.72, cardRight: 0.325, safeLeft: 0.36, safeRight: 0.96 },\\n  camera: {\\n    holdUntil: 0.45,            // kortets färg och lyftning/skakning, kameran står kvar på raketens 10–14 m\\n    inFrom: 0.45, inTo: 1.45,   // glider in mot bordet\\n    nearM: 7,                   // ansiktena är fullt synliga\\n    // Kameran sänks när den går in, så att ansiktena syns under hjässan: 35° vid rätt, 40° vid fel (spelets är 50°).\\n    right: { arcYawRad: 0.21, pitchRad: 0.62, ease: 'easeOutCubic' },              // en mjuk båge in, som lyftningen på kortet\\n    wrong: { arcYawRad: 0, pitchRad: 0.7, delayS: 0.15, ease: 'easeInOutSine' },  // rakt in, ingen båge\\n    // Beslut 2026-10-03: huvudena förstoras inte. De sista 1,5 s går kameran långsamt in till 5,5 m, där huvudet är\\n    // 41 px högt i 1280 × 720 och 51 px i 1440 × 900. Efter ögonblicket går den tillbaka till 24 m på 1 s.\\n    closeFrom: 2.3, closeTo: 3.8, closeM: 5.5, closeEase: 'easeInOutSine',\\n    backFrom: 3.8, backTo: 4.8, backM: 24                                 // tillbaka till spelets kamera, efter ögonblicket\\n  },\\n  guests: { firstGestureAt: 0.6, staggerS: 0.18, faceSwapAt: 0.6 },\\n  symbol: { at: 1.1 },\\n  meter: { at: 1.25 },\\n  /** Strålkastaren (teaterScen.spot) ligger kvar på bordet tills kameran vänder. */\\n  spot: { until: 3.8, fadeS: 0.5 }\\n};\\n\",\"guestGroups.ts\":\"// guestGroups.ts — D5 (2026-10-04): gästerna i fem grupper, åtskilda på kläderna och avläsbara på 14 m.\\n// Varje grupp har en färgfamilj (två varianter) och ett tecken som syns i siluetten uppifrån: ryggsäcken,\\n// kepsen, solhatten, sjalen och den vita skjortan. Tecknet är det som läses på 14 m, färgen hjälper till.\\n// Alla kroppsfärger ligger inom kontrastbandet mot vinbarens fem golv (1,8–3,6), i dagsljus (ambientScale 1,0)\\n// och i båda kvällsljusen (0,62 och 0,48): checkGroupsAgainstFloors() nedan. Tillägg 2026-10-05 (Code 309): åtta av tio\\n// låg för ljust och två för mörkt. Fönstret är kroppens luminans L 0,0509–0,0913 (det övre ur 0,48 mot DJ-golvet).\\n// Kroppsfärgerna skiljer sig från personalens uniformer. Inget rött, inget grönt som signal (grönt i kläder är dämpat oliv).\\n// Ersätter inte gästtyperna i leverans 4 (pengarna), utan visar ORDER 304:s grupper (vilka som kommer per klass).\\n\\nimport * as THREE from 'three';\\n\\nexport type GuestGroupId = 'student' | 'villager' | 'tourist' | 'gourmet' | 'business';\\n\\nexport interface GroupLook { body: string; limb: string; accent: string; /** Gatan och byn (tillägg 2026-10-06, Code 302b). */ street: { body: string; limb: string; accent: string } }\\n/** Var figuren står. 'room' = inne i vinbaren (golven i ZONE_FLOORS), 'street' = gatan, trottoaren, torget och byn. */\\nexport type LookWhere = 'room' | 'street';\\nexport interface GuestGroup {\\n  id: GuestGroupId;\\n  /** Det man ser på 14 m. */\\n  sign: 'backpack' | 'cap' | 'sunhat' | 'scarf' | 'shirt';\\n  looks: [GroupLook, GroupLook];\\n  /** Klasserna där gruppen kommer (ORDER 304 §1). */\\n  classes: ('simple' | 'bistro' | 'soigne')[];\\n  /** Kraven (ORDER 304 §2), som ord. Talen i balance.ts (GUEST_GROUP). */\\n  pays: 'low' | 'mid' | 'high';\\n  forgives: 'much' | 'some' | 'little';\\n}\\n\\nexport const GUEST_GROUPS: Record<GuestGroupId, GuestGroup> = {\\n  student: { id: 'student', sign: 'backpack', classes: ['simple'], pays: 'low', forgives: 'much',\\n    looks: [{ body: '#074e7d', limb: '#093351', accent: '#c4a04a', street: { body: '#529bd8', limb: '#4376a1', accent: '#3a2412' } }, { body: '#2d447d', limb: '#1c2c51', accent: '#b8743a', street: { body: '#7494de', limb: '#5a71a6', accent: '#3d2614' } }] },\\n  villager: { id: 'villager', sign: 'cap', classes: ['simple', 'bistro'], pays: 'mid', forgives: 'some',\\n    looks: [{ body: '#6b4624', limb: '#472f1a', accent: '#3a2c20', street: { body: '#bb8b62', limb: '#8d6b4e', accent: '#3a2c20' } }, { body: '#3f5830', limb: '#2a3b21', accent: '#3a3028', street: { body: '#7f9e6c', limb: '#617754', accent: '#3a3028' } }] },\\n  tourist: { id: 'tourist', sign: 'sunhat', classes: ['bistro', 'soigne'], pays: 'mid', forgives: 'some',\\n    looks: [{ body: '#63510d', limb: '#43370e', accent: '#efe1c0', street: { body: '#aa934a', limb: '#80703d', accent: '#efe1c0' } }, { body: '#22584f', limb: '#183a34', accent: '#efe1c0', street: { body: '#61a095', limb: '#4c7971', accent: '#efe1c0' } }] },\\n  gourmet: { id: 'gourmet', sign: 'scarf', classes: ['soigne'], pays: 'high', forgives: 'little',\\n    looks: [{ body: '#63335c', limb: '#40203b', accent: '#d9a54a', street: { body: '#bf81b5', limb: '#916489', accent: '#f6d98e' } }, { body: '#4d3b61', limb: '#30253d', accent: '#c98a3e', street: { body: '#a28cbe', limb: '#7b6c8f', accent: '#f2cf86' } }] },\\n  business: { id: 'business', sign: 'shirt', classes: ['soigne'], pays: 'high', forgives: 'little',\\n    looks: [{ body: '#46526a', limb: '#262c3a', accent: '#f1ece2', street: { body: '#7e98b4', limb: '#617488', accent: '#f1ece2' } }, { body: '#3e4148', limb: '#22242a', accent: '#f1ece2', street: { body: '#9a948d', limb: '#75716c', accent: '#f1ece2' } }] }\\n};\\n\\n/** Lägger gruppens tecken på en figurrigg (figureRig: joints.head, joints.chest, shoulderWidth). Gäster sitter oftast,\\n *  så tecknen sitter på överkroppen och huvudet, aldrig på benen. */\\nexport function dressGroup(rig: any, group: GuestGroupId, variant = 0, where: LookWhere = 'room'): THREE.Object3D[] {\\n  const G = GUEST_GROUPS[group], L0 = G.looks[variant % 2], L = where === 'street' ? L0.street : L0, head = rig.joints.head, chest = rig.joints.chest;\\n  const depth = rig.shoulderWidth * 0.44, added: THREE.Object3D[] = [];\\n  const m = (c: string, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r });\\n  const add = (parent: THREE.Object3D, o: THREE.Mesh, name: string) => { o.name = 'sign.' + name; o.castShadow = true; parent.add(o); added.push(o); return o; };\\n  if (G.sign === 'backpack') {\\n    // Ryggsäcken: 0,30 × 0,38 × 0,14 m på ryggen, i en kontrastfärg. Sitter kvar när hen sitter (på stolsryggen i spelet).\\n    add(chest, new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.38, 0.14), m(L.accent)), 'backpack').position.set(0, -0.05, -depth / 2 - 0.08);\\n    // Tillägg 2026-10-05: luvan i ryggsäckens kontrastfärg, nedfälld som en krage runt halsen, så att studenterna läses från alla håll.\\n    const hood = add(chest, new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.055, 8, 20), m(L.accent)), 'hood'); hood.position.set(0, 0.49, -0.03); hood.rotation.set(Math.PI / 2 + 0.25, 0, 0); hood.scale.set(1.25, 1.25, 1);\\n  }\\n  if (G.sign === 'cap') {\\n    // Kepsen: platt skärmmössa, kullen 0,24 m bred, skärmen 0,07 m fram.\\n    add(head, new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.13, 0.05, 18), m(L.accent)), 'cap').position.set(0, 0.17, -0.005);\\n    add(head, new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.015, 0.08), m(L.accent)), 'capPeak').position.set(0, 0.155, 0.12);\\n  }\\n  if (G.sign === 'sunhat') {\\n    // Solhatten: brätte 0,46 m, ljust. Den tydligaste siluetten uppifrån. Kameraremmen över bröstet.\\n    add(head, new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.012, 24), m(L.accent, 0.95)), 'brim').position.set(0, 0.15, 0);\\n    add(head, new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.125, 0.09, 18), m(L.accent, 0.95)), 'crown').position.set(0, 0.2, 0);\\n    const strap = add(chest, new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.62, 0.012), m('#2a2420')), 'strap'); strap.position.set(0, 0.1, depth / 2 + 0.01); strap.rotation.z = 0.7;\\n    add(chest, new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.07, 0.06), m('#1c1814')), 'camera').position.set(0.13, -0.12, depth / 2 + 0.04);\\n  }\\n  if (G.sign === 'scarf') {\\n    // Sjalen: tjock, i mässing eller bärnsten, lindad och med en ände ned över bröstet.\\n    const s = add(chest, new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.05, 8, 18), m(L.accent)), 'scarf'); s.position.set(0, 0.56, 0); s.rotation.x = Math.PI / 2;\\n    add(chest, new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.32, 0.03), m(L.accent)), 'scarfEnd').position.set(0.07, 0.34, depth / 2 + 0.03);\\n  }\\n  if (G.sign === 'shirt') {\\n    // Den vita skjortan i kavajens V och en slips i kavajens egen ton, mörkare. Syns som en ljus kil uppifrån och framifrån.\\n    const v = add(chest, new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.0, 0.34, 3), m(L.accent, 0.6)), 'shirt'); v.position.set(0, 0.36, depth / 2 + 0.008); v.rotation.set(Math.PI / 2, 0, Math.PI); v.scale.set(1, 1, 0.12);\\n    add(chest, new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.24, 0.012), m(L.limb, 0.5)), 'tie').position.set(0, 0.32, depth / 2 + 0.022);\\n    const col = add(chest, new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.018, 6, 16), m(L.accent, 0.6)), 'collar'); col.position.set(0, 0.6, 0.01); col.rotation.x = Math.PI / 2;\\n  }\\n  return added;\\n}\\n\\n/** Utseendet som teaterScen.LOOKS-post (body, limb), så att samma rigg och kontrastkontroll gäller. */\\nexport function lookOf(group: GuestGroupId, variant = 0, where: LookWhere = 'room'): { body: string; limb: string } {\\n  const L0 = GUEST_GROUPS[group].looks[variant % 2], L = where === 'street' ? L0.street : L0; return { body: L.body, limb: L.limb };\\n}\\n\\n// ---------- Kontrastbandet i dagsljus och kvällsljus (tillägg 2026-10-05, Code 309) ----------\\n// Samma kvot som wineBarRoom.contrast(), men med golvets och kroppens luminans skalade med ljuset. Flaren (+0,05) skalas\\n// inte, så kvoten sjunker i kvällsljus. Det är därför det övre fönstret är 0,0913 och inte 0,1154.\\nexport const LIGHT_SCALES = { day: 1.0, evening: 0.62, lateEvening: 0.48 };\\nconst WINE_BAR_FLOORS = ['#a89577', '#a49075', '#a08d74', '#97866f', '#a09786'];\\nfunction lum(hex: string): number {\\n  const ch = (i: number) => { const c = parseInt(hex.slice(1 + i * 2, 3 + i * 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };\\n  return 0.2126 * ch(0) + 0.7152 * ch(1) + 0.0722 * ch(2);\\n}\\n/** Alla tio kroppsfärger mot de fem golven i de tre ljusen. Tom lista = godkänt. */\\nexport function checkGroupsAgainstFloors(floors = WINE_BAR_FLOORS, lo = 1.8, hi = 3.6) {\\n  const fails: { group: GuestGroupId; variant: number; floor: string; light: string; ratio: number }[] = [];\\n  (Object.keys(GUEST_GROUPS) as GuestGroupId[]).forEach((g) => GUEST_GROUPS[g].looks.forEach((L, v) => floors.forEach((f) =>\\n    Object.entries(LIGHT_SCALES).forEach(([light, k]) => {\\n      const a = k * lum(f), b = k * lum(L.body), r = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);\\n      if (r < lo || r > hi) fails.push({ group: g, variant: v, floor: f, light, ratio: r });\\n    }))));\\n  return fails;\\n}\\n\\n// ---------- Gatan och byn (tillägg 2026-10-06, Code 302b) ----------\\n// Inne i vinbaren är kropparna mörkare än golvet. På gatan är markytorna mörkare än vinbarens golv (L 0,051–0,115), så där\\n// flöt kropparna ihop med marken och bara tecknen bar läsningen. Gatans kroppar är därför ljusare än marken, med samma kulör\\n// som i rummet. Fönstret är L 0,2904–0,3145: det undre ur 0,48 mot venuePavement, det övre ur dagsljus mot greens.\\n// Tecknen vänds där de annars försvinner: studenternas ryggsäck och luva blir mörka, gourmeternas sjal ljusare guld.\\n/** Gatans markytor, ur byKvall.js. Kantstenen (#7d796e, 0,15 m bred) ingår inte: ingen står på den. */\\nexport const STREET_SURFACES: { id: string; colour: string }[] = [\\n  { id: 'road', colour: '#4f4030' }, { id: 'path', colour: '#5e4c38' }, { id: 'torget', colour: '#6b5842' },\\n  { id: 'ourPavement', colour: '#4b433c' }, { id: 'venuePavement', colour: '#6b5d4e' },\\n  { id: 'grass', colour: '#3a4434' }, { id: 'residential', colour: '#3d4536' }, { id: 'greens', colour: '#36442f' }\\n];\\n/** Bytet vid dörren: figuren byter från gatans färger till rummets när den passerar dörrmattan, på blendS sekunder. */\\nexport const STREET_BLEND = { at: 'room.queueSpots[0] (dörrmattan)', blendS: 0.6, ease: 'inOutSine' };\\n/** Kropparna (gatans variant) mot gatans markytor i de tre ljusen. Tom lista = godkänt. */\\nexport function checkGroupsAgainstStreet(surfaces = STREET_SURFACES.map((x) => x.colour), lo = 1.8, hi = 3.6) {\\n  const fails: { group: GuestGroupId; variant: number; surface: string; light: string; ratio: number }[] = [];\\n  (Object.keys(GUEST_GROUPS) as GuestGroupId[]).forEach((g) => GUEST_GROUPS[g].looks.forEach((L, v) => surfaces.forEach((f) =>\\n    Object.entries(LIGHT_SCALES).forEach(([light, k]) => {\\n      const a = k * lum(f), b = k * lum(L.street.body), r = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);\\n      if (r < lo || r > hi) fails.push({ group: g, variant: v, surface: f, light, ratio: r });\\n    }))));\\n  return fails;\\n}\\n/** Tecknet mot kroppen på gatan, i dagsljus. Under 1,8 försvinner tecknet. */\\nexport function checkStreetSigns(min = 1.8) {\\n  const fails: { group: GuestGroupId; variant: number; ratio: number }[] = [];\\n  (Object.keys(GUEST_GROUPS) as GuestGroupId[]).forEach((g) => GUEST_GROUPS[g].looks.forEach((L, v) => {\\n    const a = lum(L.street.accent), b = lum(L.street.body), r = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);\\n    if (r < min) fails.push({ group: g, variant: v, ratio: r });\\n  }));\\n  return fails;\\n}\\n\"};<\u002Fscript>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ddd7f912-6668-4ec6-b132-bc60510ee365\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"1afe738d-80bf-40a5-8498-81d42f1d2d7a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"ddd7f912-6668-4ec6-b132-bc60510ee365\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F,
