n och loungen (tillägget) ==============================\\n\\nconst STOOL: FigurePose = P(SEAT, {\\n  hipDrop: SEAT_KINDS.stool.drop, torso: { pitch: 0.1 }, head: { pitch: 0.06 },\\n  legL: SEAT_KINDS.stool.legs, legR: SEAT_KINDS.stool.legs\\n});\\nconst LOUNGE: FigurePose = P(SEAT, {\\n  hipDrop: SEAT_KINDS.lounge.drop, torso: { pitch: -0.12 }, head: { pitch: 0.16 },\\n  legL: SEAT_KINDS.lounge.legs, legR: SEAT_KINDS.lounge.legs\\n});\\n/** Djup sänkning mot en låg dyna: bålen fram som motvikt, händerna fram. Fotleden = knä − höft. */\\nconst LOUNGE_CROUCH: FigurePose = P(STAND, {\\n  hipDrop: 0.3, torso: { pitch: 0.55 }, head: { pitch: -0.05 },\\n  armL: A(0.65, 0.15, 0.5), armR: A(0.65, 0.15, 0.5),\\n  legL: { swing: 1.1, spread: 0.08, knee: 1.7, ankle: 0.6 }, legR: { swing: 1.1, spread: 0.08, knee: 1.7, ankle: 0.6 }\\n});\\n\\nreg(def({\\n  id: 'guest.sitStool', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.6, seatKind: 'stool',\\n  from: 'stand', to: 'seated', needs: 'stool', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.gesture', 'guest.readMenu', 'guest.lean'],\\n  pose: function (u, c) {\\n    const side = c.side ?? 1;\\n    const reach = P(STAND, { torso: { pitch: 0.12 }, armR: A(1.0, 0.12, 0.7), armL: A(0.25, 0.1, 0.4) });\\n    // Foten på ringen: det närmaste benet lyfts först.\\n    const footUp = { swing: 0.95, spread: 0.08, knee: 1.75, ankle: 0.8 };\\n    const climb: FigurePose = side > 0\\n      ? P(reach, { hipDrop: 0, torso: { pitch: 0.2 }, legR: footUp })\\n      : P(reach, { hipDrop: 0, torso: { pitch: 0.2 }, legL: footUp });\\n    let p = keys(u, [\\n      [0, STAND],\\n      [0.35, reach],\\n      [0.6, climb],\\n      [0.82, P(STOOL, { armR: A(0.9, 0.12, 0.9) })],\\n      [1, STOOL]\\n    ]);\\n    const step = win(u, 0.08, 0.5, 0.06);\\n    if (step > 0) p = blendPose(p, walking(p, (u - 0.08) / 0.42, 0.45, 'none'), step);\\n    return withYaw(p, 0, -side * 0.3 * win(u, 0, 0.45, 0.12));\\n  },\  }, head: { pitch: 0.0 }, armR: A(0.82, 0.1, 0.95) })],\\n      [0.9, P(SEAT, { torso: { pitch: -0.04 }, armL: A(0.5, 0.06, 1.14) })],\\n      [1, P(SEAT, { torso: { pitch: -0.04 }, armL: A(0.5, 0.06, 1.14) })]\\n    ]);\\n    const arm = p.armR ?? {};\\n    return withYaw({ ...p, armR: { ...arm, lift: (arm.lift ?? 0) + 0.06 * sw * swirl } }, (c.yaw ?? 0) * 0.3 * ramp(u, 0.85, 1), (c.yaw ?? 0) * 0.85 * ramp(u, 0.84, 0.96));\\n  },\\n  tilt: function (u) { return { R: { roll: 0.14 * Math.sin(u * TAU * 9) * win(u, 0.15, 0.33, 0.03), pitch: -0.25 * win(u, 0.42, 0.62, 0.04) } }; }\\n}));\\n\\nreg(def({\\n  id: 'rocket.askPointMenu', group: 'rocket', roles: ['guest'], loop: false, travel: false, base: 4,\\n  from: 'seated', to: 'seated', needs: 'chair', holds: { R: 'menu' }, ends: { L: 'menu' },\\n  events: [{ u: 0.02, type: 'switch', hand: 'R' }],\\n  next: ['guest.order', 'guest.seatedIdle', 'rocket.askPointMenu'],\\n  pose: function (u, c) {\\n    const up = win(u, 0.08, 1.01, 0.08) * (1 - 0.8 * (bell(u, 0.33, 0.05) + bell(u, 0.56, 0.05)));\\n    const dip = bell(u, 0.33, 0.03) + bell(u, 0.56, 0.03);\\n    const palm = win(u, 0.7, 0.96, 0.06);\\n    return withYaw(P(SEAT, {\\n      torso: { pitch: 0.12, roll: 0.1 * palm },\\n      head: { pitch: 0.35 - 0.5 * up, yaw: 0 },\\n      armL: A(0.68, 0.1, 1.2),\\n      armR: A(0.8 + 0.2 * palm, 0.04 + 0.28 * palm, 1.0 + 0.2 * dip - 0.3 * palm)\\n    }), (c.yaw ?? 0) * 0.3 * up, (c.yaw ?? 0) * 0.8 * up);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'rocket.walkToKitchen', group: 'rocket', roles: ['guest'], loop: true, travel: true, base: 1,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['rocket.walkToKitchen', 'staff.idle'],\\n  pose: function (u, c) {\\n    const p = walking(P(STAND, { torso: { pitch: 0.1 }, head: { pitch: -0.02 }, armR: A(0.4, 0.1, 0.9) }), c.phase ?? u, (c.stride ?? 1) * 1.15, 'L');\\n    return p;\\n  }\\n}));\\n\\n\\n// ===== leverans 3: händelsernas klipp ============== ----\\n// Åtta gester för gästens stämning, sittande på stol, barstol och lounge (reseat). Tempot är styrkan:\\n// c.stress 0 (lugn) ger en antydan, 1 (stressad) en gest som läses från 24 m. Stämningen läses på armarna,\\n// höjden och bålens lutning. Ansiktet (figureFace.ts) syns först när kameran är närmare än 9 m.\\n\\nconst ARMS_X: PoseArm = A(0.32, -0.28, 1.9);\\nfunction moodK(c: ClipCtx): number { return 0.75 + 0.5 * (c.stress ?? 0.3); }\\n\\nreg(def({\\n  id: 'guest.leanCurious', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 3.2, mood: 'content',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.nodApprove', 'guest.laugh', 'guest.seatedIdle', 'guest.lean'],\\n  pose: function (u, c) {\\n    // Lutar sig fram mot det som händer, underarmarna mot knäna, huvudet upp och lite på sned.\\n    const k = moodK(c), lean = win(u, 0.1, 0.88, 0.2), tip = bell(u, 0.52, 0.14);\\n    const b = base(c, true);\\n    return breathe(withYaw(P(b, {\\n      torso: { pitch: 0.06 + 0.34 * k * lean },\\n      head: { pitch: 0.06 - 0.24 * lean },\\n      armL: blendArm(A(0.78, 0.1, 0.95), A(0.95, 0.16, 1.7), lean), armR: blendArm(A(0.78, 0.1, 0.95), A(0.95, 0.12, 1.7), lean)\\n    }), (c.yaw ?? 0) * 0.35 * lean, (c.yaw ?? 0) * 0.8 * lean + 0.14 * tip), c.t ?? 0);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.laugh', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.4, mood: 'delighted',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.gesture', 'guest.cheers', 'guest.lean'],\\n  pose: function (u, c) {\\n    // Huvudet bakåt, axlarna som studsar, en hand mot bröstet. Sedan framåt, nästan dubbelvikt, och tillbaka.\\n    const k = moodK(c), a = win(u, 0.05, 0.92, 0.12), back = a * (1 - ramp(u, 0.5, 0.62)), fold = bell(u, 0.66, 0.11);\\n    const ha = Math.sin(u * TAU * 5) * a;\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.012 * k * ha,\\n      torso: { pitch: 0.06 - 0.2 * k * back + 0.3 * k * fold + 0.03 * ha },\\n      head: { pitch: 0.06 - 0.42 * k * back + 0.18 * fold },\\n      armR: A(0.78 + 0.45 * a, 0.1, 0.95 + 1.0 * a),\\n      armL: A(0.78 + 0.25 * fold, 0.1 + 0.2 * fold, 0.95 - 0.3 * fold)\\n    }), (c.yaw ?? 0) * 0.3, (c.yaw ?? 0) * 0.7 * (1 - back));\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.cheers', group: 'guest', roles: ['guest'], loop: false, travel: false, handed: true, base: 3.4, mood: 'delighted',\\n  from: 'seated', to: 'seated', needs: 'table', holds: {}, ends: {},\\n  events: [{ u: 0.1, type: 'grab', hand: 'R', at: 'table' }, { u: 0.48, type: 'clink' }, { u: 0.9, type: 'release', hand: 'R', at: 'table' }],\\n  next: ['guest.seatedIdle', 'guest.laugh', 'guest.gesture'],\\n  pose: function (u, c) {\\n    // Skålen med hela bordet: glaset över huvudhöjd, mot bordets mitt, och ingen klunk. guest.toast är skålen och klunken.\\n    const k = moodK(c), b = base(c, true), hi = 1.9 + 0.45 * (k - 0.75) * 2;\\n    const jig = 0.05 * Math.sin(u * TAU * 6) * win(u, 0.4, 0.62, 0.04);\\n    const up = P(b, { torso: { pitch: 0.16 }, head: { pitch: -0.3 }, armR: A(hi, 0.14 + jig, 0.35), armL: A(0.9, 0.18, 1.0) });\\n    const toward = (c.yaw ?? 0) * win(u, 0.15, 0.8, 0.12);\\n    return withYaw(keys(u, [\\n      [0, b],\\n      [0.14, P(b, { armR: A(0.85, 0.1, 0.9) })],\\n      [0.38, up], [0.6, up],\\n      [0.74, P(b, { torso: { pitch: 0.08 }, armR: A(1.3, 0.1, 0.8) })],\\n      [0.88, P(b, { armR: A(0.8, 0.1, 0.92) })],\\n      [1, b]\\n    ]), toward * 0.4, toward * 0.6);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.nodApprove', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.2, mood: 'content',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.leanCurious', 'guest.gesture', 'guest.cheers'],\\n  pose: function (u, c) {\\n    // Två långsamma nickar mot den som gjorde något, med handflatan öppen åt hen.\\n    const k = moodK(c), nod = 0.3 * k * (bell(u, 0.3, 0.075) + bell(u, 0.56, 0.075)), palm = win(u, 0.14, 0.82, 0.14);\\n    const b = base(c, true);\\n    return breathe(withYaw(P(b, {\\n      torso: { pitch: 0.06 + 0.06 * palm }, head: { pitch: 0.04 + nod },\\n      armR: A(0.78 + 0.18 * palm, 0.1 + 0.26 * palm, 0.95 - 0.3 * palm)\\n    }), (c.yaw ?? 0) * 0.3 * palm, (c.yaw ?? 0) * 0.85), c.t ?? 0);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.armsCrossed', group: 'guest', roles: ['guest'], loop: true, travel: false, base: 4, mood: 'displeased',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.armsCrossed', 'guest.checkWatch', 'guest.waveWaiter', 'guest.seatedIdle', 'guest.pushPlate'],\\n  pose: function (u, c) {\\n    // Armarna i kors, bålen tillbaka från bordet och blicken bort från det som stör. En suck per varv.\\n    const k = moodK(c), sigh = bell(u, 0.62, 0.08), s = Math.sin(u * TAU);\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.01 * sigh,\\n      torso: { pitch: 0.02 - 0.12 * k + 0.03 * s, roll: 0.04 * s },\\n      head: { pitch: 0.1 + 0.08 * sigh },\\n      armL: ARMS_X, armR: ARMS_X\\n    }), -(c.yaw ?? 0) * 0.1, -(c.yaw ?? 0) * 0.45 * k);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.checkWatch', group: 'guest', roles: ['guest'], loop: false, travel: false, base: 2.6, mood: 'waiting',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.armsCrossed', 'guest.waveWaiter', 'guest.checkWatch'],\\n  pose: function (u, c) {\\n    // Vänster handled upp, blicken ned på klockan och sedan ut i rummet efter personalen.\\n    const k = moodK(c), watch = win(u, 0.1, 0.62, 0.12), look = win(u, 0.6, 0.96, 0.1);\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.008 * k * look,\\n      torso: { pitch: 0.06 + 0.06 * watch },\\n      head: { pitch: 0.06 + 0.44 * watch - 0.06 * look },\\n      armL: blendArm(A(0.78, 0.1, 0.95), A(0.62, 0.0, 1.95), watch)\\n    }), (c.yaw ?? 0) * 0.3 * look * k, (c.yaw ?? 0) * 0.9 * look);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.waveWaiter', group: 'guest', roles: ['guest'], loop: false, travel: false, handed: true, base: 2.8, mood: 'impatient',\\n  from: 'seated', to: 'seated', needs: 'chair', holds: {}, ends: {}, events: [],\\n  next: ['guest.seatedIdle', 'guest.armsCrossed', 'guest.pay', 'guest.waveWaiter'],\\n  pose: function (u, c) {\\n    // Inte guest.waveStaff (fingret upp, vi vill beställa): armen rakt upp, halvvägs upp från sitsen, stora svep.\\n    const k = moodK(c), up = win(u, 0.08, 0.9, 0.1), wv = Math.sin(u * TAU * 5) * win(u, 0.2, 0.8, 0.06);\\n    const b = base(c, true);\\n    return withYaw(P(b, {\\n      lift: 0.05 * k * up,\\n      torso: { pitch: 0.02 - 0.04 * up, roll: -0.1 * k * up },\\n      head: { pitch: 0.02 - 0.12 * up },\\n      armR: A(0.78 + (1.6 + 0.5 * (k - 0.75) * 2) * up, 0.1 + 0.14 * up + 0.24 * k * wv, 0.95 - 0.7 * up),\\n      armL: A(0.78 + 0.1 * up, 0.12 + 0.06 * up, 0.95 - 0.4 * up)\\n    }), (c.yaw ?? 0) * 0.35 * up, (c.yaw ?? 0) * 0.9 * up);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'guest.pushPlate', group: 'guest', roles: ['guest'], loop: false, travel: false, handed: true, base: 3, mood: 'displeased',\\n  from: 'seated', to: 'seated', needs: 'table', holds: {}, ends: {},\\n  events: [{ u: 0.22, type: 'grab', hand: 'R', at: 'table' }, { u: 0.5, type: 'release', hand: 'R', at: 'table' }],\\n  next: ['guest.armsCrossed', 'guest.seatedIdle', 'guest.waveWaiter'],\\n  pose: function (u, c) {\\n    // Handen på tallrikens kant, en raksträckt arm som skjuter den ifrån sig, och sedan armarna i kors.\\n    const k = moodK(c), b = base(c, true);\\n    const crossed = P(b, { torso: { pitch: -0.1 * k }, head: { pitch: 0.12 }, armL: ARMS_X, armR: ARMS_X });\\n    return keys(u, [\\n      [0, b],\\n      [0.2, P(b, { torso: { pitch: 0.16 }, head: { pitch: 0.3 }, armR: A(0.78, 0.08, 1.0) })],\\n      [0.48, P(b, { torso: { pitch: 0.12 + 0.1 * k }, head: { pitch: 0.2 }, armR: A(1.12, 0.08, 0.28) })],\\n      [0.62, P(b, { torso: { pitch: 0.0 }, armR: A(0.9, 0.1, 0.8) })],\\n      [0.8, crossed], [1, crossed]\\n    ]);\\n  }\\n}));\\n\\n/** Gesterna per stämning, i den ordning sim-lagret väljer dem. Sittande; stående i kön har egna klipp. */\\nexport const MOOD_GESTURES: Record<MoodId, string[]> = {\\n  delighted: ['guest.laugh', 'guest.cheers'],\\n  content: ['guest.nodApprove', 'guest.leanCurious'],\\n  waiting: ['guest.checkWatch'],\\n  impatient: ['guest.waveWaiter', 'guest.checkWatch'],\\n  displeased: ['guest.armsCrossed', 'guest.pushPlate']\\n};\\n\\nfunction blendArm(a: PoseArm, b: PoseArm, k: number): PoseArm {\\n  const m = function (x: number | undefined, y: number | undefined) { return (x ?? 0) + ((y ?? 0) - (x ?? 0)) * k; };\\n  return { swing: m(a.swing, b.swing), lift: m(a.lift, b.lift), elbow: m(a.elbow, b.elbow) };\\n}\\n\\n// ---------- uppspelning -----------------------------------------------\\n\\nexport function clipSeconds(id: string, tempo: TempoId): number {\\n  return CLIPS[id].seconds[tempo];\\n}\\n\\n/** Sekunder från klippets start till första händelsen av en typ (och hand, om angiven). */\\nexport function eventTime(id: string, type: ClipEventType, tempo: TempoId, hand?: HandSide): number {\\n  const c = CLIPS[id];\\n  const e = c.events.find(function (x) { return x.type === type && (hand === undefined || x.hand === hand); });\\n  if (!e) return -1;\\n  return e.u * c.seconds[tempo];\\n}\\n\\n/**\\n * Ett klipp vid tiden `time` sekunder sedan klippet började. Loopar tar fasen modulo en\\n * cykel. Klipp som går (travel) tar ctx.phase från sträckan och bryr sig inte om tiden.\\n */\\nexport function sampleClip(id: string, time: number, tempo: TempoId, ctx?: ClipCtx): ClipSample {\\n  const c = CLIPS[id];\\n  const T = TEMPO[tempo];\\n  const sec = c.seconds[tempo];\\n  const t = Math.max(0, time);\\n  let u = c.loop ? (t / sec) % 1 : clamp01(t / sec);\\n  const cx: ClipCtx = { ...(ctx ?? {}), t: t, stress: ctx?.stress ?? T.stress, stride: T.stride };\\n  if (c.travel) { cx.phase = ctx?.phase ?? t / sec; u = ((cx.phase % 1) + 1) % 1; }\\n  const mirror = c.handed === true && cx.hand === 'L';\\n  if (mirror) cx.yaw = -(cx.yaw ?? 0);\\n  let pose = c.pose(u, cx);\\n  let tilt = c.tilt ? c.tilt(u, cx) : {};\\n  let root: [number, number, number] = c.root ? c.root(u, cx) : [0, 0, 0];\\n  if (mirror) {\\n    pose = mirrorPose(pose);\\n    tilt = { L: tilt.R, R: tilt.L };\\n    root = [-root[0], root[1], -root[2]];\\n  }\\n  if (c.roles.indexOf('guest') < 0 && c.group !== 'rocket') pose = strain(pose, (cx.stress ?? 0) * 0.6);\\n  let chairPull = c.chair ? c.chair(u) : 0;\\n  if ((pose.hipDrop ?? 0) > 0 && c.roles.indexOf('guest') >= 0) {\\n    const authored: SeatKind = c.seatKind ?? 'chair';\\n    const target: SeatKind = c.seatKind ?? cx.seatKind ?? 'chair';\\n    pose = reseat(pose, authored, target, cx.heightMult ?? 1);\\n    if (target !== 'chair') chairPull = 0;\\n    // Resa sig från loungen går framåt, inte bakåt in i ryggstödet.\\n    if (authored === 'chair' && target === 'lounge' && c.root) root = [root[0], Math.abs(root[1]) * 1.2, root[2]];\\n  }\\n  // Sittande och på väg ned eller upp: ingen fot under golvet. Lyfter kroppen det som saknas.\\n  if (c.roles.indexOf('guest') >= 0 && (c.from === 'seated' || c.to === 'seated') && !c.travel) {\\n    const sole = soleHeight(pose, cx.heightMult ?? 1);\\n    if (sole < 0) pose = { ...pose, lift: (pose.lift ?? 0) - sole };\\n  }\\n  const keep = ctx?.keep;\\n  if (keep) pose = { ...pose, armL: keep.L ?? pose.armL, armR: keep.R ?? pose.armR };\\n  return { pose: pose, tilt: tilt, root: root, chair: chairPull, u: u };\\n}\\n\\n/**\\n * Lägger om en sittande pose från den sits den är författad för till en annan. Hur sittande\\n * posen är (k) läses ur höftens sänkning, så övergångar (resa sig, sätta sig) läggs om lika\\n * mycket som de sitter. Därefter läggs seatLift till, så att höften landar på sitsen även\\n * för en skalad gäst.\\n */\\nexport function reseat(p: FigurePose, from: SeatKind, to: SeatKind, heightMult: number): FigurePose {\\n  const F = SEAT_KINDS[from], T = SEAT_KINDS[to];\\n  const k = clamp01((p.hipDrop ?? 0) / F.drop);\\n  let r = p;\\n  if (from !== to) {\\n    const leg = function (l: any) {\\n      const a = l ?? {};\\n      const m = function (x: number | undefined, y: number) { return (x ?? 0) + (y - (x ?? 0)) * k; };\\n      return { swing: m(a.swing, T.legs.swing), spread: m(a.spread, T.legs.spread), knee: m(a.knee, T.legs.knee), ankle: m(a.ankle, T.legs.ankle) };\\n    };\\n    const t = p.torso ?? {}, h = p.head ?? {};\\n    r = {\\n      ...p, hipDrop: k * T.drop, legL: leg(p.legL), legR: leg(p.legR),\\n      torso: { ...t, pitch: (t.pitch ?? 0) + k * (T.torso - F.torso) },\\n      head: { ...h, pitch: (h.pitch ?? 0) + k * (T.head - F.head) }\\n    };\\n  }\\n  const kt = clamp01((r.hipDrop ?? 0) / T.drop);\\n  r = { ...r, lift: (r.lift ?? 0) + kt * seatLift(to, heightMult) };\\n  return plantFeet(r, to, heightMult, kt);\\n}\\n\\n/** Sulans lägsta punkt över golvet, räknad i figurens sidoplan (höft → knä → fotled → fotens\\n *  fyra hörn). Samma led och mått som figureRig. Räcker för att hålla fötterna ovan golvet\\n *  när någon sätter sig eller reser sig. */\\nexport function soleHeight(p: FigurePose, heightMult: number): number {\\n  const hm = heightMult ?? 1;\\n  const h = p.hipDrop ?? 0;\\n  const body = (p.lift ?? 0) - h + FIGURE.hipY * (1 - hm) * Math.min(1, h / FIGURE.seatedHipDrop);\\n  const hipY = body + FIGURE.hipY * hm;\\n  let low = 9;\\n  [p.legL, p.legR].forEach(function (l: any) {\\n    const L = l ?? {};\\n    const t1 = -(L.swing ?? 0), t2 = t1 + (L.knee ?? 0), t3 = t2 - (L.ankle ?? 0);\\n    const ankleY = hipY - FIGURE.thigh * hm * Math.cos(t1) - FIGURE.shin * hm * Math.cos(t2);\\n    const back = -0.055, front = FIGURE.footLength - 0.055;\\n    [[0, back], [0, front], [-FIGURE.footHeight, back], [-FIGURE.footHeight, front]].forEach(function (q) {\\n      low = Math.min(low, ankleY + hm * (q[0] * Math.cos(t3) - q[1] * Math.sin(t3)));\\n    });\\n  });\\n  return low;\\n}\\n\\n/**\\n * Sätter fötterna i golvet (stol, lounge) eller på fotringen (barstol) när figuren sitter\\n * eller är på väg ned. Höftens vinkel behålls; knät och fotleden räknas ut så att fotleden\\n * hamnar på rätt höjd och sulan står plan. Riktningen (fötterna bakom eller framför knät)\\n * tas från posen. Når benet inte ned hänger foten, som för en kort gäst på en hög sits.\\n * Det här är den enkla ben-IK som figureRig FRÅGOR §3 och §5 efterfrågade, för sittande.\\n */\\nexport function plantFeet(p: FigurePose, kind: SeatKind, heightMult: number, k: number): FigurePose {\\n  const hm = heightMult ?? 1;\\n  const h = p.hipDrop ?? 0;\\n  if (kind === 'stool' ? k < 0.9 : h < 0.05) return p;\\n  const body = (p.lift ?? 0) - h + FIGURE.hipY * (1 - hm) * Math.min(1, h / FIGURE.seatedHipDrop);\\n  const pelvisY = body + FIGURE.hipY * hm;\\n  const target = (kind === 'stool' ? (SEAT_KINDS.stool.footrest ?? 0.3) : 0) + FIGURE.ankleY * hm;\\n  const w = kind === 'stool' ? ramp(k, 0.9, 1) : 1;\\n  const leg = function (l: any) {\\n    const L = l ?? {};\\n    const sw = L.swing ?? 0;\\n    const sgn = (L.knee ?? 0) - sw >= 0 ? 1 : -1;\\n    const c = (pelvisY - target - FIGURE.thigh * hm * Math.cos(sw)) / (FIGURE.shin * hm);\\n    const ang = Math.acos(Math.max(-1, Math.min(1, c)));\\n    const knee = sw + sgn * ang, ankle = sgn * ang;\\n    return { ...L, knee: (L.knee ?? 0) + (knee - (L.knee ?? 0)) * w, ankle: (L.ankle ?? 0) + (ankle - (L.ankle ?? 0)) * w };\\n  };\\n  return { ...p, legL: leg(p.legL), legR: leg(p.legR) };\\n}\\n\\n/** Övergång mellan två klipp: blanda från föregående klipps sista pose under TEMPO.blendSec. */\\nexport function crossfade(prev: ClipSample, next: ClipSample, sinceStart: number, tempo: TempoId): ClipSample {\\n  const k = clamp01(sinceStart / TEMPO[tempo].blendSec);\\n  if (k >= 1) return next;\\n  return { ...next, pose: blendPose(prev.pose, next.pose, smooth(k)) };\\n}\\n\\n// ---------- prov ------------------------------------------------------\\n\\n/** Kontrollerar katalogen: att varje efterföljare finns, att läget i slutet av ett klipp är\\n *  läget i början av efterföljaren, och att det ett klipp håller i slutet är det nästa\\n *  klipp börjar med. Returnerar en lista med fel; tom lista = godkänt. */\\nexport function validateClips(): string[] {\\n  const errors: string[] = [];\\n  const compatible = function (a: Stance, b: Stance): boolean {\\n    if (a === b) return true;\\n    return (a === 'walk' && b === 'stand') || (a === 'stand' && b === 'walk') || (a === 'hurt' && b === 'walk');\\n  };\\n  Object.keys(CLIPS).forEach(function (id) {\\n    const c = CLIPS[id];\\n    c.next.forEach(function (n) {\\n      const d = CLIPS[n];\\n      if (!d) { errors.push(id + ' → ' + n + ': finns inte'); return; }\\n      if (!compatible(c.to, d.from)) errors.push(id + ' → ' + n + ': slutar ' + c.to + ', nästa börjar ' + d.from);\\n    });\\n    c.events.forEach(function (e) { if (e.u < 0 || e.u > 1) errors.push(id + ': händelse utanför 0..1'); });\\n    if (c.seatKind && c.needs !== c.seatKind && !(c.seatKind === 'chair' && c.needs === 'chair')) errors.push(id + ': seatKind ' + c.seatKind + ' men needs ' + c.needs);\\n  });\\n  return errors;\\n}\\n\\n/** Tabellen i LEVERANSNOT byggs ur den här. */\\nexport function clipTable() {\\n  return Object.keys(CLIPS).map(function (id) {\\n    const c = CLIPS[id];\\n    return { id: id, group: c.group, loop: c.loop, travel: c.travel, seconds: c.seconds, from: c.from, to: c.to, needs: c.needs, seatKind: c.seatKind, holds: c.holds, ends: c.ends, events: c.events, next: c.next };\\n  });\\n}\\n\",\"tableware.ts\":\"// tableware — rekvisitan för teaterns grund: tallrikar, glas, flaskor, bricka, bestick,\\n// servett, karaff och tårta med ljus. Plus det som rummet behöver för att raketerna ska synas:\\n// menykort, beställningsblock och notamapp.\\n//\\n// Leverans 2 efter tredje provspelet (teaterns grund), 2026-09-29.\\n// Bygger på figureRig.ts. Läses av figureClips.ts (vad klippen håller) och av rummen.\\n//\\n// Kontrakt (samma som riggen):\\n//   • Ren three.js, primitiver och svarvade profiler (LatheGeometry). Inga loaders, inga\\n//     texturer, inga binära assets. Delad geometri; material delas per färg.\\n//   • Allt i meter, samma som scenens världskoordinater.\\n//   • NOLLPUNKT = mitten av undersidan. y = 0 är ytan föremålet står på, så ett glas som\\n//     ställs på bordet får y = SURFACE.table och inget annat.\\n//   • FÄSTPUNKT = punkten som ligger i handens grepp när föremålet hålls. Den finns som en\\n//     namngiven nod 'attach' i gruppen och som spec.attach (i föremålets ram).\\n//   • Ett hållet föremål hänger INTE i handen i scengrafen. updateHeld() lägger det i\\n//     världen efter handankaret varje bildruta. Två skäl:\\n//       1. Gästens heightMult är en skala på riggens 'body'. En tallrik som hängde under\\n//          handen skulle krympa med gästen. Rekvisitan har rummets mått, inte kroppens.\\n//       2. En tallrik och en bricka ska vara vågräta oavsett underarmens vinkel. Lutningen\\n//          kommer från klippet (tilt), inte från armen.\\n\\nimport * as THREE from 'three';\\nimport type { FigureRig } from './figureRig';\\n\\n// #region types\\n\\nexport type PropId =\\n  | 'plate' | 'sidePlate' | 'soupBowl'\\n  | 'wineGlass' | 'waterGlass'\\n  | 'wineBottle' | 'waterBottle' | 'carafe'\\n  | 'tray' | 'fork' | 'knife' | 'spoon' | 'napkin'\\n  | 'cake' | 'menu' | 'pad' | 'billFolder'\\n  // Leverans 3, händelserna\\n  | 'hostDesk' | 'wheelchair' | 'vase' | 'broom' | 'dustpan'\\n  | 'councilId' | 'policeId' | 'licenceFolder' | 'apron' | 'lighter'\\n  // Vardagens koreografi (efter leverans 3): brödkorgen, karaffen att dekantera i, fördrinksglaset och backen\\n  | 'breadBasket' | 'decanter' | 'flute' | 'crate';\\n\\nexport type HandSide = 'L' | 'R';\\n\\n/** Handpunkterna. Varje föremål har ett grepp; greppet bestämmer var i handen det ligger. */\\nexport type GripId = 'flat' | 'palm' | 'stem' | 'tumbler' | 'body' | 'neck' | 'handle' | 'pinch' | 'book' | 'twoHands' | 'pole' | 'card' | 'push' | 'none';\\n\\nexport type Surface = 'table' | 'bar' | 'pass' | 'station' | 'sink' | 'tray' | 'plate' | 'desk' | 'floor';\\n\\nexport interface PropSpec {\\n  id: PropId;\\n  /** Yttermått i meter: bredd (x), höjd (y), djup (z). measureProp() ska ge samma tal. */\\n  size: [number, number, number];\\n  /** Fästpunkten i föremålets ram (meter från nollpunkten). */\\n  attach: [number, number, number];\\n  grip: GripId;\\n  /** Ytor föremålet kan ställas på. */\\n  restsOn: Surface[];\\n  /** Har en fyllning som kan slås av och på: mat, soppa, vin, vatten, ljusens lågor. */\\n  fill?: 'food' | 'soup' | 'dessert' | 'wine' | 'water' | 'flames' | 'flowers';\\n}\\n\\nexport interface Handpoint {\\n  /** Förskjutning från riggens handankare, i figurens ram (x höger, y upp, z framåt).\\n   *  Speglas i x för vänster hand. */\\n  offset: [number, number, number];\\n  /** Grundlutning framåt (radianer). 0 = föremålet står upprätt. Klippets tilt läggs till. */\\n  pitch: number;\\n  /** Vad greppet är, för den som läser. */\\n  note: string;\\n}\\n\\nexport interface Tilt { pitch?: number; roll?: number; yaw?: number }\\n\\nexport interface PropHandle {\\n  id: PropId;\\n  spec: PropSpec;\\n  group: THREE.Group;\\n  attach: THREE.Object3D;\\n  held: null | { rig: FigureRig; side: HandSide };\\n  setFill: (on: boolean) => void;\\n}\\n\\n// #endregion types\\n\\n// ---------- ytorna ----------------------------------------------------\\n//\\n// Höjderna över golvet som rummen redan använder. Ett föremål som släpps läggs på ytans höjd.\\n\\nexport const SURFACE = { table: 0.75, bar: 1.05, pass: 0.95, station: 0.90, sink: 0.88, desk: 1.10, floor: 0 };\\n\\n// ---------- handpunkterna ---------------------------------------------\\n//\\n// Riggen har ett handankare per hand (handAnchorL/R): i handens spets, 3 cm framför\\n// handflatan. Handpunkterna är förskjutningar från det ankaret. De ligger i figurens ram,\\n// inte i handens, så att en tallrik hamnar framför handen även när underarmen lutar.\\n//\\n// Mätt med waiter.carryPlate vid normalt tempo: handankaret på 1,12 m och 0,44 m framför\\n// roten. Brickans handankare (waiter.carryTray) ligger på 1,33 m.\\n// Storlekarna i CATALOGUE är uppmätta med measureProp() och omfattar fyllningen (maten,\\n// soppan, ljusens lågor).\\n\\nexport const HANDPOINTS: Record<GripId, Handpoint> = {\\n  flat:     { offset: [0, 0.010, 0.02], pitch: 0, note: 'Handflatan under tallrikens bakre del. Tallriken sticker ut framåt.' },\\n  palm:     { offset: [0, 0.012, -0.03], pitch: 0, note: 'Brickan balanseras mitt på handflatan, i axelhöjd.' },\\n  stem:     { offset: [0, -0.004, 0.012], pitch: 0, note: 'Tumme och pekfinger om foten av kupan.' },\\n  tumbler:  { offset: [0, 0, 0.03], pitch: 0, note: 'Handen runt glaset, en tredjedel upp.' },\\n  body:     { offset: [0, 0, 0.035], pitch: 0, note: 'Handen runt flaskans kropp, under etiketten.' },\\n  neck:     { offset: [0, 0, 0.022], pitch: 0, note: 'Handen om karaffens hals.' },\\n  handle:   { offset: [0, 0.004, 0.01], pitch: 0.45, note: 'Skaftet i handen, spetsen framåt och nedåt.' },\\n  pinch:    { offset: [0, -0.008, 0.02], pitch: 0, note: 'Servetten mellan fingrarna.' },\\n  book:     { offset: [0, 0.01, 0.035], pitch: -1.05, note: 'Kortet lutat upp mot den som läser.' },\\n  twoHands: { offset: [0.16, 0.012, 0.04], pitch: 0, note: 'Tårtan bärs med båda händer. Fästet i höger hand, mitten mellan händerna.' },\\n  pole:     { offset: [0, 0, 0.02], pitch: 0.35, note: 'Handen runt skaftet, borsten framåt mot golvet.' },\\n  card:     { offset: [0, 0.006, 0.03], pitch: -1.2, note: 'Legitimationen hålls upp mot den som ska läsa den.' },\\n  push:     { offset: [0.22, 0, 0.02], pitch: 0, note: 'Båda händerna på handtagen. Fästet i höger hand, mitten mellan handtagen.' },\\n  none:     { offset: [0, 0, 0], pitch: 0, note: 'Står på golvet och hålls inte.' }\\n};\\n\\n// ---------- katalogen -------------------------------------------------\\n\\nexport const CATALOGUE: Record<PropId, PropSpec> = {\\n  plate:       { id: 'plate', size: [0.27, 0.055, 0.27], attach: [0, 0, -0.08], grip: 'flat', restsOn: ['table', 'pass', 'station', 'sink', 'tray'], fill: 'food' },\\n  sidePlate:   { id: 'sidePlate', size: [0.17, 0.041, 0.17], attach: [0, 0, -0.05], grip: 'flat', restsOn: ['table', 'tray', 'sink'], fill: 'dessert' },\\n  soupBowl:    { id: 'soupBowl', size: [0.23, 0.052, 0.23], attach: [0, 0, -0.07], grip: 'flat', restsOn: ['table', 'pass', 'sink', 'tray'], fill: 'soup' },\\n  wineGlass:   { id: 'wineGlass', size: [0.086, 0.21, 0.086], attach: [0, 0.09, 0], grip: 'stem', restsOn: ['table', 'bar', 'tray'], fill: 'wine' },\\n  waterGlass:  { id: 'waterGlass', size: [0.074, 0.11, 0.074], attach: [0, 0.04, 0], grip: 'tumbler', restsOn: ['table', 'bar', 'tray'], fill: 'water' },\\n  wineBottle:  { id: 'wineBottle', size: [0.077, 0.30, 0.077], attach: [0, 0.11, 0], grip: 'body', restsOn: ['table', 'bar', 'tray'] },\\n  waterBottle: { id: 'waterBottle', size: [0.07, 0.267, 0.07], attach: [0, 0.10, 0], grip: 'body', restsOn: ['table', 'bar', 'tray'] },\\n  carafe:      { id: 'carafe', size: [0.13, 0.26, 0.13], attach: [0, 0.19, 0], grip: 'neck', restsOn: ['table', 'bar', 'tray'], fill: 'water' },\\n  tray:        { id: 'tray', size: [0.40, 0.02, 0.40], attach: [0, 0, 0], grip: 'palm', restsOn: ['table', 'bar', 'pass'] },\\n  fork:        { id: 'fork', size: [0.024, 0.005, 0.188], attach: [0, 0, -0.07], grip: 'handle', restsOn: ['table', 'plate', 'tray'] },\\n  knife:       { id: 'knife', size: [0.018, 0.008, 0.22], attach: [0, 0, -0.08], grip: 'handle', restsOn: ['table', 'plate', 'tray'] },\\n  spoon:       { id: 'spoon', size: [0.04, 0.008, 0.18], attach: [0, 0, -0.06], grip: 'handle', restsOn: ['table', 'plate', 'tray'] },\\n  napkin:      { id: 'napkin', size: [0.12, 0.014, 0.12], attach: [0, 0.007, -0.05], grip: 'pinch', restsOn: ['table', 'bar', 'plate'] },\\n  cake:        { id: 'cake', size: [0.30, 0.213, 0.30], attach: [0, 0, 0], grip: 'twoHands', restsOn: ['table', 'pass', 'tray'], fill: 'flames' },\\n  menu:        { id: 'menu', size: [0.22, 0.008, 0.31], attach: [0, 0, -0.12], grip: 'book', restsOn: ['table'] },\\n  pad:         { id: 'pad', size: [0.08, 0.012, 0.11], attach: [0, 0, -0.04], grip: 'book', restsOn: ['table'] },\\n  billFolder:  { id: 'billFolder', size: [0.11, 0.012, 0.21], attach: [0, 0, -0.08], grip: 'book', restsOn: ['table'] },\\n  // Leverans 3. Värdpulten och rullstolen står på golvet. Vasen står på pulten.\\n  hostDesk:    { id: 'hostDesk', size: [0.60, 1.10, 0.45], attach: [0, 1.10, 0], grip: 'none', restsOn: ['floor'] },\\n  wheelchair:  { id: 'wheelchair', size: [0.62, 0.92, 1.05], attach: [0, 0.905, -0.30], grip: 'push', restsOn: ['floor'] },\\n  vase:        { id: 'vase', size: [0.12, 0.42, 0.12], attach: [0, 0.12, 0], grip: 'body', restsOn: ['desk', 'table', 'bar', 'floor'], fill: 'flowers' },\\n  broom:       { id: 'broom', size: [0.30, 1.30, 0.06], attach: [0, 0.95, 0], grip: 'pole', restsOn: ['floor'] },\\n  dustpan:     { id: 'dustpan', size: [0.24, 0.10, 0.34], attach: [0, 0.09, -0.14], grip: 'handle', restsOn: ['floor'] },\\n  councilId:   { id: 'councilId', size: [0.086, 0.004, 0.054], attach: [0, 0.002, -0.02], grip: 'card', restsOn: ['table', 'bar', 'desk'] },\\n  policeId:    { id: 'policeId', size: [0.075, 0.014, 0.105], attach: [0, 0.006, -0.04], grip: 'card', restsOn: ['table', 'bar', 'desk'] },\\n  licenceFolder: { id: 'licenceFolder', size: [0.24, 0.03, 0.32], attach: [0, 0.015, -0.12], grip: 'book', restsOn: ['table', 'bar', 'desk'] },\\n  apron:       { id: 'apron', size: [0.30, 0.02, 0.25], attach: [0, 0.01, -0.1], grip: 'pinch', restsOn: ['table', 'bar', 'station'] },\\n  lighter:     { id: 'lighter', size: [0.025, 0.025, 0.24], attach: [0, 0.0125, -0.08], grip: 'handle', restsOn: ['table', 'bar', 'pass', 'tray'] },\\n  // Vardagens koreografi. Brödkorgen bärs på handflatan, karaffen i halsen, glaset i foten, backen med båda händerna.\\n  breadBasket: { id: 'breadBasket', size: [0.24, 0.09, 0.16], attach: [0, 0, -0.05], grip: 'flat', restsOn: ['table', 'tray', 'pass'], fill: 'food' },\\n  decanter:    { id: 'decanter', size: [0.20, 0.30, 0.20], attach: [0, 0.24, 0], grip: 'neck', restsOn: ['table', 'bar', 'tray'], fill: 'wine' },\\n  flute:       { id: 'flute', size: [0.064, 0.22, 0.064], attach: [0, 0.1, 0], grip: 'stem', restsOn: ['table', 'bar', 'tray'], fill: 'wine' },\\n  crate:       { id: 'crate', size: [0.42, 0.33, 0.30], attach: [0, 0.2, 0], grip: 'twoHands', restsOn: ['floor', 'bar'] }\\n};\\n\\n// ---------- färgerna --------------------------------------------------\\n//\\n// Samma regel som figureProps.ts §2: det som ligger mot kroppen hör till det LJUSA\\n// kontrastfönstret (L 0,64–0,80), annars försvinner det mot garment-färgerna från 24 m.\\n// Porslin, servett, papper, bricka och tårta ligger där. Flaskan är mörk, som en flaska är,\\n// men bär en ljus etikett och en mässingskapsyl, så att den läses i handen.\\n\\nexport const PROP_COLOURS = {\\n  porcelain: '#efe6d6',\\n  glass: '#e6eee8',\\n  wine: '#6d1822',\\n  water: '#cfe3e6',\\n  bottle: '#1f3526',\\n  label: '#eadbc1',\\n  capsule: '#d7a24c',\\n  trayTop: '#cdb48a',\\n  steel: '#d6d2ca',\\n  linen: '#f2e8d8',\\n  cake: '#f5ecdc',\\n  berry: '#b3485a',\\n  candle: '#f7efd9',\\n  flame: '#ffc46b',\\n  menu: '#e9d9bc',\\n  menuSpine: '#9a6a2a',\\n  pad: '#f5ead5',\\n  folder: '#c9942a',\\n  food: '#b5673a',\\n  greens: '#7c8a48',\\n  soup: '#d9a441',\\n  dessert: '#e9c9a0',\\n  // Leverans 3\\n  desk: '#4a3122', deskTop: '#6a4630', brass: '#b88a3e',\\n  chairFrame: '#3a3836', tyre: '#1c1a19', seatCloth: '#3d4450',\\n  vase: '#2f5d62', blossom: '#e8c24a', blossom2: '#efe4d0',\\n  pole: '#6b4a2e', bristle: '#c9a15a', pan: '#3c4a3f',\\n  card: '#f4f1ea', cardBand: '#2f6db5', wallet: '#1e2b4a', badge: '#d7a24c',\\n  licence: '#35506b', apron: '#efe4d0', lighter: '#2a2826',\\n  // Vardagens koreografi\\n  basket: '#b98a52', bread: '#d9a066', aperitif: '#e9c46a', crate: '#7a5a3a'\\n};\\n\\n// ---------- bygget ----------------------------------------------------\\n\\nconst GEO = new Map<string, THREE.BufferGeometry>();\\nfunction geo(key: string, build: () => THREE.BufferGeometry): THREE.BufferGeometry {\\n  let g = GEO.get(key);\\n  if (g === undefined) { g = build(); GEO.set(key, g); }\\n  return g;\\n}\\nconst MAT = new Map<string, THREE.Material>();\\nfunction mat(colour: string, o?: { rough?: number; metal?: number; glass?: boolean; glow?: boolean }): THREE.Material {\\n  const k = colour + JSON.stringify(o ?? {});\\n  let m = MAT.get(k);\\n  if (m === undefined) {\\n    const p = o ?? {};\\n    const s = new THREE.MeshStandardMaterial({ color: colour, roughness: p.rough ?? 0.6, metalness: p.metal ?? 0 });\\n    if (p.glass) { s.transparent = true; s.opacity = 0.42; s.side = THREE.DoubleSide; s.depthWrite = false; s.roughness = 0.08; }\\n    if (p.glow) { s.emissive = new THREE.Color(colour); s.emissiveIntensity = 2.2; }\\n    m = s;\\n    MAT.set(k, m);\\n  }\\n  return m;\\n}\\nfunction lathe(key: string, pts: number[][], seg?: number): THREE.BufferGeometry {\\n  return geo('lathe:' + key, function () {\\n    return new THREE.LatheGeometry(pts.map(function (p) { return new THREE.Vector2(p[0], p[1]); }), seg ?? 24);\\n  });\\n}\\nfunction box(w: number, h: number, d: number): THREE.BufferGeometry {\\n  return geo('box:' + w + ',' + h + ',' + d, function () { return new THREE.BoxGeometry(w, h, d); });\\n}\\nfunction cyl(r: number, h: number, seg?: number): THREE.BufferGeometry {\\n  return geo('cyl:' + r + ',' + h + ',' + (seg ?? 20), function () { return new THREE.CylinderGeometry(r, r, h, seg ?? 20); });\\n}\\nfunction sph(r: number): THREE.BufferGeometry {\\n  return geo('sph:' + r, function () { return new THREE.SphereGeometry(r, 12, 8); });\\n}\\nfunction add(g: THREE.Group, geometry: THREE.BufferGeometry, material: THREE.Material, x: number, y: number, z: number): THREE.Mesh {\\n  const m = new THREE.Mesh(geometry, material);\\n  m.position.set(x, y, z);\\n  m.castShadow = true;\\n  m.receiveShadow = true;\\n  g.add(m);\\n  return m;\\n}\\n\\nconst C = PROP_COLOURS;\\n\\n// Profilerna är (radie, höjd) i meter, nedifrån och upp. Undersidan ligger på y = 0.\\nconst PROFILE = {\\n  plate: [[0, 0], [0.085, 0], [0.095, 0.004], [0.1, 0.011], [0.135, 0.02], [0.135, 0.022], [0.098, 0.014], [0, 0.013]],\\n  sidePlate: [[0, 0], [0.055, 0], [0.062, 0.004], [0.066, 0.009], [0.085, 0.016], [0.085, 0.018], [0.064, 0.012], [0, 0.011]],\\n  soupBowl: [[0, 0], [0.05, 0], [0.056, 0.006], [0.09, 0.038], [0.115, 0.05], [0.114, 0.052], [0.087, 0.042], [0.05, 0.013], [0, 0.011]],\\n  wineGlass: [[0, 0], [0.036, 0], [0.036, 0.003], [0.005, 0.009], [0.004, 0.09], [0.02, 0.1], [0.04, 0.13], [0.043, 0.16], [0.036, 0.21]],\\n  waterGlass: [[0, 0], [0.032, 0], [0.037, 0.11]],\\n  wineBottle: [[0, 0], [0.0385, 0], [0.0385, 0.19], [0.034, 0.21], [0.016, 0.235], [0.014, 0.285], [0.0155, 0.3], [0, 0.3]],\\n  waterBottle: [[0, 0], [0.035, 0], [0.035, 0.18], [0.02, 0.225], [0.014, 0.26], [0, 0.26]],\\n  carafe: [[0, 0], [0.062, 0], [0.065, 0.05], [0.058, 0.12], [0.03, 0.17], [0.022, 0.23], [0.028, 0.26]],\\n  tray: [[0, 0], [0.19, 0], [0.2, 0.02], [0.194, 0.02], [0.188, 0.006], [0, 0.006]],\\n  cakePlate: [[0, 0], [0.11, 0], [0.13, 0.008], [0.15, 0.013], [0.15, 0.015], [0, 0.012]],\\n  flute: [[0, 0], [0.032, 0], [0.032, 0.003], [0.004, 0.008], [0.0035, 0.1], [0.018, 0.12], [0.025, 0.17], [0.026, 0.22]],\\n  decanter: [[0, 0], [0.1, 0], [0.1, 0.01], [0.095, 0.05], [0.06, 0.11], [0.025, 0.18], [0.02, 0.28], [0.024, 0.3]],\\n  vase: [[0, 0], [0.04, 0], [0.055, 0.06], [0.06, 0.13], [0.045, 0.21], [0.028, 0.25], [0.034, 0.26], [0.03, 0.26], [0.024, 0.25]]\\n};\\n\\nfunction buildInto(g: THREE.Group, id: PropId): THREE.Object3D | null {\\n  switch (id) {\\n    case 'plate': {\\n      add(g, lathe('plate', PROFILE.plate), mat(C.porcelain, { rough: 0.35 }), 0, 0, 0);\\n      const f = new THREE.Group(); f.name = 'fill';\\n      const mound = add(f, geo('mound', function () { return new THREE.SphereGeometry(0.055, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2); }), mat(C.food, { rough: 0.8 }), 0.01, 0.013, 0.005);\\n      mound.scale.set(1, 0.55, 0.8);\\n      add(f, geo('greens', function () { return new THREE.SphereGeometry(0.025, 10, 6); }), mat(C.greens, { rough: 0.9 }), -0.045, 0.03, -0.02);\\n      g.add(f); return f;\\n    }\\n    case 'sidePlate': {\\n      add(g, lathe('sidePlate', PROFILE.sidePlate), mat(C.porcelain, { rough: 0.35 }), 0, 0, 0);\\n      const f = new THREE.Group(); f.name = 'fill';\\n      add(f, cyl(0.035, 0.03, 16), mat(C.dessert, { rough: 0.7 }), 0, 0.026, 0);\\n      g.add(f); return f;\\n    }\\n    case 'soupBowl': {\\n      add(g, lathe('soupBowl', PROFILE.soupBowl), mat(C.porcelain, { rough: 0.35 }), 0, 0, 0);\\n      const f = new THREE.Group(); f.name = 'fill';\\n      add(f, geo('soupDisc', function () { return new THREE.CircleGeometry(0.083, 24).rotateX(-Math.PI / 2); }), mat(C.soup, { rough: 0.3 }), 0, 0.036, 0);\\n      g.add(f); return f;\\n    }\\n    case 'wineGlass': {\\n      add(g, lathe('wineGlass', PROFILE.wineGlass, 20), mat(C.glass, { glass: true }), 0, 0, 0);\\n      const f = new THREE.Group(); f.name = 'fill';\\n      add(f, geo('wineFill', function () { return new THREE.CylinderGeometry(0.039, 0.03, 0.035, 16); }), mat(C.wine, { rough: 0.2 }), 0, 0.128, 0);\\n      g.add(f); return f;\\n    }\\n    case 'waterGlass': {\\n      add(g, lathe('waterGlass', PROFILE.waterGlass, 18), mat(C.glass, { glass: true }), 0, 0, 0);\\n      const f = new THREE. ll;\\n    }\\n    case 'spoon': {\\n      add(g, box(0.011, 0.004, 0.12), mat(C.steel, { metal: 0.85, rough: 0.3 }), 0, 0.002, -0.03);\\n      const b = add(g, geo('spoonBowl', function () { return new THREE.SphereGeometry(0.02, 12, 6); }), mat(C.steel, { metal: 0.85, rough: 0.3 }), 0, 0.004, 0.06);\\n      b.scale.set(1, 0.2, 1.5);\\n      return null;\\n    }\\n    case 'napkin': {\\n      add(g, box(0.12, 0.014, 0.12), mat(C.linen, { rough: 0.95 }), 0, 0.007, 0);\\n      return null;\\n    }\\n    case 'cake': {\\n      add(g, lathe('cakePlate', PROFILE.cakePlate, 32), mat(C.porcelain, { rough: 0.35 }), 0, 0, 0);\\n      add(g, cyl(0.12, 0.1, 32), mat(C.cake, { rough: 0.7 }), 0, 0.063, 0);\\n      add(g, cyl(0.1205, 0.025, 32), mat(C.berry, { rough: 0.6 }), 0, 0.1, 0);\\n      const f = new THREE.Group(); f.name = 'fill';\\n      for (let i = 0; i < 6; i++) {\\n        const a = (i / 6) * Math.PI * 2;\\n        const x = Math.cos(a) * 0.075, z = Math.sin(a) * 0.075;\\n        add(g, cyl(0.005, 0.07, 8), mat(C.candle, { rough: 0.6 }), x, 0.148, z);\\n        const fl = add(f, geo('flame', function () { return new THREE.ConeGeometry(0.008, 0.025, 8); }), mat(C.flame, { glow: true }), x, 0.2, z);\\n        fl.castShadow = false;\\n      }\\n      g.add(f); return f;\\n    }\\n    case 'menu': {\\n      add(g, box(0.22, 0.008, 0.31), mat(C.menu, { rough: 0.9 }), 0, 0.004, 0);\\n      add(g, box(0.012, 0.0085, 0.31), mat(C.menuSpine, { rough: 0.8 }), -0.104, 0.004, 0);\\n      return null;\\n    }\\n    case 'pad': {\\n      add(g, box(0.08, 0.012, 0.11), mat(C.pad, { rough: 0.9 }), 0, 0.006, 0);\\n      return null;\\n    }\\n    case 'billFolder': {\\n      add(g, box(0.11, 0.012, 0.21), mat(C.folder, { rough: 0.5, metal: 0.3 }), 0, 0.006, 0);\\n      return null;\\n    }\\n    case 'hostDesk': {\\n      add(g, box(0.60, 0.06, 0.45), mat(C.desk, { rough: 0.7 }), 0, 0.03, 0);\\n      add(g, box(0.56, 0.98, 0.41), mat(C.desk, { rough: 0.7 }), 0, 0.55, 0);\\n      add(g, box(0.60, 0.04, 0.45), mat(C.deskTop, { rough: 0.5 }), 0, 1.08, 0);\\n      add(g, box(0.56, 0.02, 0.006), mat(C.brass, { rough: 0.35, metal: 0.7 }), 0, 0.92, 0.208);\\n      return null;\\n    }\\n    case 'wheelchair': {\\n      const fr = mat(C.chairFrame, { rough: 0.4, metal: 0.6 }), ty = mat(C.tyre, { rough: 0.9 }), cl = mat(C.seatCloth, { rough: 0.9 });\\n      [-1, 1].forEach(function (s) {\\n        const w = add(g, cyl(0.30, 0.03, 28), ty, s * 0.295, 0.30, -0.20); w.rotation.z = Math.PI / 2;\\n        const c = add(g, cyl(0.08, 0.03, 14), ty, s * 0.22, 0.08, 0.42); c.rotation.z = Math.PI / 2;\\n        add(g, box(0.03, 0.44, 0.03), fr, s * 0.22, 0.70, -0.24);\\n        add(g, box(0.03, 0.03, 0.14), fr, s * 0.22, 0.905, -0.30);\\n        add(g, box(0.03, 0.36, 0.03), fr, s * 0.20, 0.30, 0.40);\\n      });\\n      add(g, box(0.46, 0.05, 0.44), cl, 0, 0.48, 0.02);\\n      add(g, box(0.46, 0.42, 0.04), cl, 0, 0.70, -0.22);\\n      add(g, box(0.40, 0.02, 0.14), fr, 0, 0.12, 0.48);\\n      return null;\\n    }\\n    case 'vase': {\\n      add(g, lathe('vase', PROFILE.vase, 20), mat(C.vase, { rough: 0.3 }), 0, 0, 0);\\n      const f = new THREE.Group(); f.name = 'fill';\\n      [[-0.025, 0.38, 0.005], [0.025, 0.39, 0.01], [0.0, 0.37, -0.03]].forEach(function (p, i) {\\n        add(f, cyl(0.004, 0.16, 6), mat(C.greens, { rough: 0.8 }), p[0] * 0.5, 0.33, p[2] * 0.5);\\n        add(f, sph(0.03), mat(i === 1 ? C.blossom2 : C.blossom, { rough: 0.7 }), p[0], p[1], p[2]);\\n      });\\n      g.add(f); return f;\\n    }\\n    case 'broom': {\\n      add(g, cyl(0.013, 1.10, 10), mat(C.pole, { rough: 0.6 }), 0, 0.75, 0);\\n      add(g, box(0.30, 0.05, 0.06), mat(C.pole, { rough: 0.6 }), 0, 0.175, 0);\\n      add(g, box(0.28, 0.15, 0.05), mat(C.bristle, { rough: 0.95 }), 0, 0.075, 0);\\n      return null;\\n    }\\n    case 'dustpan': {\\n      const m = mat(C.pan, { rough: 0.5 });\\n      add(g, box(0.24, 0.004, 0.22), m, 0, 0.002, 0.06);\\n      add(g, box(0.24, 0.08, 0
