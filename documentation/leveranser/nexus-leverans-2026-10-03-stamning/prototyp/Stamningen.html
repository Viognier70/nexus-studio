document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f9d9218a-497b-4171-8d02-6b9b882c0781\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<script>window.__SRC = {\"figureRig.ts\":\"// figureRig — ledad figurrigg för den strategiska scenen.\\n//\\n// SUPERSEDING_DIRECTIVE_004 §3 (Kroppar i rummet), ORDER 121.\\n// Ersätter cylinderpuckarna i InteriorGuests.tsx och InteriorStaff.tsx.\\n//\\n// Kontrakt:\\n//   • Ren three.js. Inga externa beroenden, inga inlästa modeller,\\n//     ingen skinning, ingen AnimationMixer, inga binära assets.\\n//   • Riggen byggs imperativt EN gång (createFigureRig) och muteras\\n//     sedan per bildruta (applyPose). Inget skapas i render-loopen.\\n//   • Riggen äger ingen klocka. Poserna är rena funktioner av en fas\\n//     eller en tid som anroparen skickar in — spelet driver klockan.\\n//   • Inga ansikten. Hållning och gest bär uttrycket.\\n//\\n// Arv från AnimationPrototype.tsx (pre-ORDER 053): höft 0,86 m,\\n// bål 0,60 m, huvudradie 0,12 m, gångcykelns amplituder och\\n// distansdrivna kadens. Tre skillnader:\\n//   1. Två led per lem (armbåge, knä) i stället för ett.\\n//   2. Hjässan ligger på exakt 1,700 m. Prototypens 1,2 cm\\n//      underskott (1,688 m) blir här en synlig nacke i stället för\\n//      ett avrundningsfel — anatomin behåller sina proportioner och\\n//      höjdkontraktet håller.\\n//   3. Namngivna ledreferenser + ankarpunkter (huvud, båda händer).\\n//\\n// 1,700 m är ett TAK, inte ett medelvärde: ingen pose lyfter kroppen\\n// över noll. Gångstuds, andning och vaggning svajar nedåt från\\n// hjässan, så en mätning i vyn aldrig läser mer än 1,700 m.\\n//\\n// SD-004 §3.3 (ORDER 141, merge 6bd7fb9): taket gäller PERSONAL.\\n// Gäster bär heightMult från sin arketyp och mäter 1,700 × mult.\\n// Multen sitter som uniform skala på 'body', inte i FIGURE-måtten —\\n// geometrin förblir delad, så fyrtio olika längder kostar fyrtio\\n// noder och noll extra buffertar. variant 'staff' tvingar mult = 1.\\n//\\n// Koordinater: rot i golvplanet, +Y uppåt, figuren tittar mot +Z.\\n// Alla mått i meter, samma som scenens världskoordinater.\\n// Alla ledvinklar i radianer. Positiv vinkel = framåt, i den\\n// riktning figuren tittar. Positiv `lift`/`spread` = utåt från\\n// kroppens mittlinje. Positiv `knee` = hälen bakåt (knät böjs bara\\n// åt ett håll).\\n\\nimport * as THREE from 'three';\\n\\n// #region types\\n\\nexport type FigureVariant = 'guest' | 'staff';\\n\\nexport interface FigureRigOptions {\\n  variant?: FigureVariant;\\n  /** Axelbredd i meter. Default: 0,46 gäst / 0,40 personal. */\\n  shoulderWidth?: number;\\n  /** Hjässans färg — garment för gäst, uniform för personal. */\\n  garmentColour?: string;\\n  /** Bål/lemmar. Default: garmentColour mörknad. */\\n  limbColour?: string;\\n  skinColour?: string;\\n  /** Meter över hjässan där indikatorankaret ligger. Skicka\\n   *  PIP_OFFSET_ABOVE_PUCK_TOP_M från patternTransform.ts. */\\n  headAnchorOffset?: number;\\n  /** SD-004 §3.3: gästens längd som andel av kanonens 1,70 m. Klipps till\\n   *  0,70–1,12 (1,19–1,90 m; undre gränsen rymmer barnets 0,72). Ignoreras\\n   *  för variant 'staff' — personalen är höjdlåst. Default 1,000. */\\n  heightMult?: number;\\n}\\n\\nexport interface FigureJoints {\\n  /** Världsplacering + kurs (rotation.y = yaw). */\\n  root: THREE.Group;\\n  /** Vertikal förskjutning: gångstuds, sitthöjd. */\\n  body: THREE.Group;\\n  /** Höftlinjen. Bär benen. */\\n  pelvis: THREE.Group;\\n  /** Ryggraden. Bär bål, armar, huvud. Roteras för lutning. */\\n  chest: THREE.Group;\\n  neck: THREE.Group;\\n  head: THREE.Group;\\n  /** Tom Object3D över hjässan — ankare för indikator. */\\n  headAnchor: THREE.Object3D;\\n  shoulderL: THREE.Group;\\n  elbowL: THREE.Group;\\n  handL: THREE.Group;\\n  /** Tom Object3D i grepppunkten — fäste för föremål (poseCarry). */\\n  handAnchorL: THREE.Object3D;\\n  shoulderR: THREE.Group;\\n  elbowR: THREE.Group;\\n  handR: THREE.Group;\\n  handAnchorR: THREE.Object3D;\\n  hipL: THREE.Group;\\n  kneeL: THREE.Group;\\n  ankleL: THREE.Group;\\n  hipR: THREE.Group;\\n  kneeR: THREE.Group;\\n  ankleR: THREE.Group;\\n}\\n\\nexport interface FigureRig {\\n  /** Lägg denna i scengrafen. */\\n  root: THREE.Group;\\n  joints: FigureJoints;\\n  variant: FigureVariant;\\n  shoulderWidth: number;\\n  /** Tillämpad mult efter klippning. Alltid 1 för personal. */\\n  heightMult: number;\\n  /** Hjässans faktiska höjd: 1,70 × heightMult. */\\n  totalHeight: number;\\n  /** Material, för opacitet i interiörens fade-band. */\\n  materials: THREE.MeshStandardMaterial[];\\n  garment: THREE.MeshStandardMaterial;\\n}\\n\\nexport interface PoseArm {\\n  /** Axeln framåt/bakåt. */\\n  swing?: number;\\n  /** Axeln utåt från kroppen. */\\n  lift?: number;\\n  /** Armbågsböj. Alltid ≥ 0. */\\n  elbow?: number;\\n}\\n\\nexport interface PoseLeg {\\n  swing?: number;\\n  spread?: number;\\n  knee?: number;\\n  ankle?: number;\\n}\\n\\nexport interface PoseTorso {\\n  pitch?: number;\\n  yaw?: number;\\n  roll?: number;\\n}\\n\\nexport interface PoseHead {\\n  pitch?: number;\\n  yaw?: number;\\n}\\n\\nexport interface FigurePose {\\n  /** Höjer hela kroppen (gångstuds, andning). */\\n  lift?: number;\\n  /** Sänker höftlinjen (sittande). */\\n  hipDrop?: number;\\n  torso?: PoseTorso;\\n  head?: PoseHead;\\n  armL?: PoseArm;\\n  armR?: PoseArm;\\n  legL?: PoseLeg;\\n  legR?: PoseLeg;\\n}\\n\\nexport interface PoseOptions {\\n  /** Skalar gångens amplituder: 0,6 = släpig, 1,4 = snabb. */\\n  intensity?: number;\\n  /** Vilken sida som gestikulerar. 1 = höger, -1 = vänster. */\\n  side?: number;\\n  /** Huvudets/bålens vridning mot den man vänder sig till (radianer,\\n   *  relativt figurens kurs). Anroparen räknar ut den. */\\n  targetYaw?: number;\\n  /** Gångfas i cykler, om posen ska kombineras med gång\\n   *  (poseCarry under förflyttning). null = stillastående. */\\n  phase?: number | null;\\n}\\n\\nexport type PoseName =\\n  | 'poseWalk' | 'poseIdle' | 'poseSeated'\\n  | 'poseGreet' | 'poseWork' | 'poseCarry';\\n\\n// #endregion types\\n\\n// ---------- mått ------------------------------------------------------\\n//\\n// Hjässan: hipY + torsoHeight + neckLength + 2 × headRadius\\n//        = 0,860 + 0,588 + 0,012 + 0,240 = 1,700 m exakt.\\n// Benet: thigh + shin + ankleY = 0,44 + 0,36 + 0,06 = 0,86 = hipY.\\n// Foten står i golvplanet (y = 0).\\n\\nexport const FIGURE = {\\n  /** Kanonhöjd. Personalens lås, och den höjd alla poser är författade mot. */\\n  totalHeight: 1.70,\\n  /** Gästens heightMult klipps hit: 1,19 m – 1,90 m. Undre gränsen är satt\\n   *  av barnets arketyp (0,72), inte av en vuxenkurva. */\\n  heightMultMin: 0.70,\\n  heightMultMax: 1.12,\\n  /** poseSeated:s hipDrop. applyPose läser den för att sitsankra skalade kroppar. */\\n  seatedHipDrop: 0.41,\\n  hipY: 0.86,\\n  torsoHeight: 0.588,\\n  neckLength: 0.012,\\n  headRadius: 0.12,\\n  shoulderY: 1.37,\\n  upperArm: 0.29,\\n  foreArm: 0.25,\\n  handLength: 0.09,\\n  thigh: 0.44,\\n  shin: 0.36,\\n  ankleY: 0.06,\\n  footLength: 0.22,\\n  footWidth: 0.10,\\n  footHeight: 0.06,\\n  hipHalfWidth: 0.09,\\n  armRadius: 0.045,\\n  legRadius: 0.062,\\n  neckRadius: 0.045,\\n  guestShoulderWidth: 0.46,\\n  staffShoulderWidth: 0.40,\\n  /** Bålens djup som andel av axelbredden. */\\n  torsoDepthRatio: 0.44,\\n  /** Höftpartiets bredd som andel av axelbredden. */\\n  waistRatio: 0.78,\\n  headAnchorOffset: 0.18\\n};\\n\\n// Delade geometrier. Skapas vid första riggen och återanvänds av alla\\n// figurer med samma variant — 40 figurer i rummet ska inte betyda 40\\n// uppsättningar buffertar. Frigörs med disposeFigureGeometry().\\nconst geometryCache = new Map<string, THREE.BufferGeometry>();\\n\\nfunction cached(key: string, build: () => THREE.BufferGeometry): THREE.BufferGeometry {\\n  let g = geometryCache.get(key);\\n  if (g === undefined) {\\n    g = build();\\n    geometryCache.set(key, g);\\n  }\\n  return g;\\n}\\n\\nexport function disposeFigureGeometry(): void {\\n  geometryCache.forEach(function (g) { g.dispose(); });\\n  geometryCache.clear();\\n}\\n\\nfunction darken(hex: string, amount: number): string {\\n  const c = new THREE.Color(hex);\\n  c.multiplyScalar(1 - amount);\\n  return c.getStyle();\\n}\\n\\n/** Ett lemsegment: mesh som hänger nedåt från ledens origo. */\\nfunction limb(\\n  key: string, material: THREE.Material,\\n  radius: number, length: number, taper: number\\n): THREE.Mesh {\\n  const geo = cached(key, function () {\\n    return new THREE.CylinderGeometry(radius * taper, radius, length, 8);\\n  });\\n  const mesh = new THREE.Mesh(geo, material);\\n  mesh.position.y = -length / 2;\\n  return mesh;\\n}\\n\\nfunction joint(name: string, x: number, y: number, z: number): THREE.Group {\\n  const g = new THREE.Group();\\n  g.name = name;\\n  g.position.set(x, y, z);\\n  return g;\\n}\\n\\n// ---------- konstruktion ----------------------------------------------\\n//\\n// Byggs imperativt, en gång per figur. Ingen allokering sker sedan i\\n// applyPose — den skriver bara rotation/position på befintliga noder.\\n\\nexport function createFigureRig(options?: Partial<FigureRigOptions>): FigureRig {\\n  const opts = options ?? {};\\n  const variant = opts.variant ?? 'guest';\\n  let defaultWidth = FIGURE.guestShoulderWidth;\\n  if (variant === 'staff') defaultWidth = FIGURE.staffShoulderWidth;\\n  const shoulderWidth = opts.shoulderWidth ?? defaultWidth;\\n  // Personalen är höjdlåst; gästen skalas av sin arketyp.\\n  let heightMult = 1;\\n  if (variant !== 'staff' && opts.heightMult !== undefined) {\\n    heightMult = Math.min(FIGURE.heightMultMax, Math.max(FIGURE.heightMultMin, opts.heightMult));\\n  }\\n  const garmentColour = opts.garmentColour ?? '#c9c0a4';\\n  const limbColour = opts.limbColour ?? darken(garmentColour, 0.28);\\n  const skinColour = opts.skinColour ?? '#d8b48a';\\n  const anchorOffset = opts.headAnchorOffset ?? FIGURE.headAnchorOffset;\\n\\n  const garment = new THREE.MeshStandardMaterial({ color: garmentColour, roughness: 0.85 });\\n  const limbs = new THREE.MeshStandardMaterial({ color: limbColour, roughness: 0.9 });\\n  const skin = new THREE.MeshStandardMaterial({ color: skinColour, roughness: 0.9 });\\n  const materials = [garment, limbs, skin];\\n\\n  const depth = shoulderWidth * FIGURE.torsoDepthRatio;\\n  const waist = shoulderWidth * FIGURE.waistRatio;\\n  const shoulderHalf = shoulderWidth / 2 - FIGURE.armRadius;\\n  const key = variant + ':' + shoulderWidth.toFixed(3);\\n\\n  const root = joint('figureRoot', 0, 0, 0);\\n  const body = joint('body', 0, 0, 0);\\n  const pelvis = joint('pelvis', 0, FIGURE.hipY, 0);\\n  const chest = joint('chest', 0, 0, 0);\\n  root.add(body);\\n  // Uniform: en kortare gäst är proportionerligt mindre, inte tillplattad.\\n  // Skalan ligger under root, så root behåller rena världsmått för placering\\n  // och kurs — och headAnchor/handAnchor följer den verkliga kroppen, så pip\\n  // och föremål hamnar rätt utan egen korrigering.\\n  body.scale.setScalar(heightMult);\\n  body.add(pelvis);\\n  pelvis.add(chest);\\n\\n  // Bålen i två block: höftparti och bröstkorg. Båda hänger i chest,\\n  // så lutningen pivoterar i höftlinjen.\\n  const waistH = 0.24;\\n  const waistMesh = new THREE.Mesh(\\n    cached(key + ':waist', function () {\\n      return new THREE.BoxGeometry(waist, waistH, depth * 0.92);\\n    }),\\n    limbs\\n  );\\n  waistMesh.position.y = waistH / 2;\\n  chest.add(waistMesh);\\n\\n  const chestH = FIGURE.torsoHeight - waistH;\\n  const chestMesh = new THREE.Mesh(\\n    cached(key + ':chest', function () {\\n      return new THREE.BoxGeometry(shoulderWidth, chestH, depth);\\n    }),\\n    garment\\n  );\\n  chestMesh.position.y = waistH + chestH / 2;\\n  chest.add(chestMesh);\\n\\n  // Nacke → huvud. Inget ansikte: en sfär i hudton och en kalott i\\n  // garment-/uniformsfärg. Silhuettkontraktet — kameran ser hjässan\\n  // uppifrån, så färgen sitter där och inte på bröstet.\\n  const neck = joint('neck', 0, FIGURE.torsoHeight, 0);\\n  chest.add(neck);\\n  const neckMesh = new THREE.Mesh(\\n    cached(key + ':neck', function () {\\n      return new THREE.CylinderGeometry(\\n        FIGURE.neckRadius, FIGURE.neckRadius, FIGURE.neckLength, 8\\n      );\\n    }),\\n    skin\\n  );\\n  neckMesh.position.y = FIGURE.neckLength / 2;\\n  neck.add(neckMesh);\\n\\n  const head = joint('head', 0, FIGURE.neckLength, 0);\\n  neck.add(head);\\n  const headMesh = new THREE.Mesh(\\n    cached('head:sphere', function () {\\n      return new THREE.SphereGeometry(FIGURE.headRadius, 16, 12);\\n    }),\\n    skin\\n  );\\n  headMesh.position.y = FIGURE.headRadius;\\n  head.add(headMesh);\\n\\n  const crown = new THREE.Mesh(\\n    cached('head:crown', function () {\\n      return new THREE.SphereGeometry(\\n        FIGURE.headRadius * 1.03, 16, 8, 0, Math.PI * 2, 0, 1.15\\n      );\\n    }),\\n    garment\\n  );\\n  // Kalotten är 3 % större än huvudet för att undvika z-fighting, så\\n  // centret sänks med samma 3 % — skalet toppar då på exakt 2 × radien\\n  // och hjässan ligger kvar på 1,700 m i bounding box.\\n  crown.position.y = FIGURE.headRadius - FIGURE.headRadius * 0.03;\\n  head.add(crown);\\n\\n  const headAnchor = new THREE.Object3D();\\n  headAnchor.name = 'headAnchor';\\n  headAnchor.position.y = FIGURE.headRadius * 2 + anchorOffset;\\n  head.add(headAnchor);\\n\\n  // Armar. Två led: axel (framåt/bakåt + utåt) och armbåge.\\n  function buildArm(side: number, suffix: string) {\\n    const shoulder = joint(\\n      'shoulder' + suffix,\\n      side * shoulderHalf,\\n      FIGURE.shoulderY - FIGURE.hipY,\\n      0\\n    );\\n    shoulder.add(limb(key + ':upperArm', limbs, FIGURE.armRadius, FIGURE.upperArm, 0.92));\\n    const elbow = joint('elbow' + suffix, 0, -FIGURE.upperArm, 0);\\n    shoulder.add(elbow);\\n    elbow.add(limb(key + ':foreArm', limbs, FIGURE.armRadius * 0.88, FIGURE.foreArm, 0.9));\\n    const hand = joint('hand' + suffix, 0, -FIGURE.foreArm, 0);\\n    elbow.add(hand);\\n    const handMesh = new THREE.Mesh(\\n      cached('hand:box', function () {\\n        return new THREE.BoxGeometry(0.062, FIGURE.handLength, 0.05);\\n      }),\\n      skin\\n    );\\n    handMesh.position.y = -FIGURE.handLength / 2;\\n    hand.add(handMesh);\\n    // Fästet: grepppunkten i handen. Ett föremål monteras som barn\\n    // här (senare order) — riggen levererar bara ankaret.\\n    const anchor = new THREE.Object3D();\\n    anchor.name = 'handAnchor' + suffix;\\n    anchor.position.set(0, -FIGURE.handLength, 0.03);\\n    hand.add(anchor);\\n    chest.add(shoulder);\\n    return { shoulder: shoulder, elbow: elbow, hand: hand, anchor: anchor };\\n  }\\n\\n  const armL = buildArm(-1, 'L');\\n  const armR = buildArm(1, 'R');\\n\\n  // Ben. Två led: höft och knä, plus en fotled så steget kan rullas av.\\n  // Hänger i pelvis, inte i chest — bålens lutning flyttar inte benen.\\n  function buildLeg(side: number, suffix: string) {\\n    const hip = joint('hip' + suffix, side * FIGURE.hipHalfWidth, 0, 0);\\n    hip.add(limb(key + ':thigh', limbs, FIGURE.legRadius, FIGURE.thigh, 0.88));\\n    const knee = joint('knee' + suffix, 0, -FIGURE.thigh, 0);\\n    hip.add(knee);\\n    knee.add(limb(key + ':shin', limbs, FIGURE.legRadius * 0.86, FIGURE.shin, 0.82));\\n    const ankle = joint('ankle' + suffix, 0, -FIGURE.shin, 0);\\n    knee.add(ankle);\\n    const foot = new THREE.Mesh(\\n      cached('foot:box', function () {\\n        return new THREE.BoxGeometry(FIGURE.footWidth, FIGURE.footHeight, FIGURE.footLength);\\n      }),\\n      limbs\\n    );\\n    foot.position.set(0, -FIGURE.footHeight / 2, FIGURE.footLength / 2 - 0.055);\\n    ankle.add(foot);\\n    pelvis.add(hip);\\n    return { hip: hip, knee: knee, ankle: ankle };\\n  }\\n\\n  const legL = buildLeg(-1, 'L');\\n  const legR = buildLeg(1, 'R');\\n\\n  const joints: FigureJoints = {\\n    root: root, body: body, pelvis: pelvis, chest: chest,\\n    neck: neck, head: head, headAnchor: headAnchor,\\n    shoulderL: armL.shoulder, elbowL: armL.elbow, handL: armL.hand, handAnchorL: armL.anchor,\\n    shoulderR: armR.shoulder, elbowR: armR.elbow, handR: armR.hand, handAnchorR: armR.anchor,\\n    hipL: legL.hip, kneeL: legL.knee, ankleL: legL.ankle,\\n    hipR: legR.hip, kneeR: legR.knee, ankleR: legR.ankle\\n  };\\n\\n  const rig: FigureRig = {\\n    root: root,\\n    joints: joints,\\n    variant: variant,\\n    shoulderWidth: shoulderWidth,\\n    heightMult: heightMult,\\n    totalHeight: FIGURE.totalHeight * heightMult,\\n    materials: materials,\\n    garment: garment\\n  };\\n  applyPose(rig, poseIdle(0));\\n  return rig;\\n}\\n\\n/** Materialen är per figur; geometrin är delad. */\\nexport function disposeFigureRig(rig: FigureRig): void {\\n  rig.materials.forEach(function (m) { m.dispose(); });\\n  rig.root.removeFromParent();\\n}\\n\\n// ---------- applicering -----------------------------------------------\\n\\nfunction applyArm(\\n  shoulder: THREE.Group, elbow: THREE.Group,\\n  arm: PoseArm | undefined, side: number\\n): void {\\n  const a = arm ?? {};\\n  shoulder.rotation.set(-(a.swing ?? 0), 0, side * (a.lift ?? 0));\\n  elbow.rotation.x = -(a.elbow ?? 0);\\n}\\n\\nfunction applyLeg(\\n  hip: THREE.Group, knee: THREE.Group, ankle: THREE.Group,\\n  leg: PoseLeg | undefined, side: number\\n): void {\\n  const l = leg ?? {};\\n  hip.rotation.set(-(l.swing ?? 0), 0, side * (l.spread ?? 0));\\n  knee.rotation.x = l.knee ?? 0;\\n  ankle.rotation.x = -(l.ankle ?? 0);\\n}\\n\\n/**\\n * Skriver en pose på riggen. Allokerar inget — säker att anropa varje\\n * bildruta för varje figur i rummet.\\n */\\nexport function applyPose(rig: FigureRig, pose: FigurePose): void {\\n  const j = rig.joints;\\n  const hipDrop = pose.hipDrop ?? 0;\\n  // Sitsen är rummets mått, inte kroppens: en kort gäst ska ha höften på\\n  // samma sits som en lång. hipDrop är författad mot 1,700 m-kanonen, så den\\n  // skalade höften lyfts tillbaka upp till sitshöjden. Faktorn gör\\n  // korrigeringen proportionell mot hur sittande posen är, så blendPose kan\\n  // lerpa in och ur den utan hopp i övergången.\\n  const seatAnchor = Math.min(1, hipDrop / FIGURE.seatedHipDrop);\\n  const seatFix = FIGURE.hipY * (1 - (rig.heightMult ?? 1)) * seatAnchor;\\n  j.body.position.y = (pose.lift ?? 0) - hipDrop + seatFix;\\n  const t = pose.torso ?? {};\\n  j.chest.rotation.set(-(t.pitch ?? 0), t.yaw ?? 0, t.roll ?? 0);\\n  const h = pose.head ?? {};\\n  j.head.rotation.set(-(h.pitch ?? 0), h.yaw ?? 0, 0);\\n  applyArm(j.shoulderL, j.elbowL, pose.armL, -1);\\n  applyArm(j.shoulderR, j.elbowR, pose.armR, 1);\\n  applyLeg(j.hipL, j.kneeL, j.ankleL, pose.legL, -1);\\n  applyLeg(j.hipR, j.kneeR, j.ankleR, pose.legR, 1);\\n}\\n\\n/** Linjär blandning mellan två poser. k = 0 ger a, k = 1 ger b.\\n *  Används för att gå in i och ur sittande (SIT_STAND_DURATION_SEC)\\n *  och för att växla gest utan hopp. */\\nexport function blendPose(a: FigurePose, b: FigurePose, k: number): FigurePose {\\n  const m = Math.max(0, Math.min(1, k));\\n  function n(x?: number, y?: number): number { return (x ?? 0) + ((y ?? 0) - (x ?? 0)) * m; }\\n  function arm(x?: PoseArm, y?: PoseArm): PoseArm {\\n    const p = x ?? {};\\n    const q = y ?? {};\\n    return { swing: n(p.swing, q.swing), lift: n(p.lift, q.lift), elbow: n(p.elbow, q.elbow) };\\n  }\\n  function leg(x?: PoseLeg, y?: PoseLeg): PoseLeg {\\n    const p = x ?? {};\\n    const q = y ?? {};\\n    return {\\n      swing: n(p.swing, q.swing), spread: n(p.spread, q.spread),\\n      knee: n(p.knee, q.knee), ankle: n(p.ankle, q.ankle)\\n    };\\n  }\\n  const ta = a.torso ?? {};\\n  const tb = b.torso ?? {};\\n  const ha = a.head ?? {};\\n  const hb = b.head ?? {};\\n  return {\\n    lift: n(a.lift, b.lift),\\n    hipDrop: n(a.hipDrop, b.hipDrop),\\n    torso: { pitch: n(ta.pitch, tb.pitch), yaw: n(ta.yaw, tb.yaw), roll: n(ta.roll, tb.roll) },\\n    head: { pitch: n(ha.pitch, hb.pitch), yaw: n(ha.yaw, hb.yaw) },\\n    armL: arm(a.armL, b.armL), armR: arm(a.armR, b.armR),\\n    legL: leg(a.legL, b.legL), legR: leg(a.legR, b.legR)\\n  };\\n}\\n\\n// ---------- poser -----------------------------------------------------\\n//\\n// Rena funktioner. Ingen av dem håller tid, tillstånd eller\\n// slumptal — anroparen skickar in fas eller sekunder och sätter\\n// resultatet med applyPose. Samma indata ger alltid samma pose, så\\n// två klienter kan rendera samma bildruta likadant.\\n\\n/**\\n * Gång. `phase` i CYKLER, inte sekunder — driv den från tillryggalagd\\n * sträcka (phase += steg / stridLength) precis som AnimationPrototype\\n * gjorde, så kadensen hänger ihop med förflyttningen och inte med\\n * väggklockan. En cykel = två fotisättningar.\\n */\\nexport function poseWalk(phase: number, options?: Partial<PoseOptions>): FigurePose {\\n  const o = options ?? {};\\n  const k = o.intensity ?? 1;\\n  const w = (phase ?? 0) * Math.PI * 2;\\n  const s = Math.sin(w);\\n  const c = Math.cos(w);\\n  const legAmp = 0.55 * k;\\n  const armAmp = 0.42 * k;\\n  return {\\n    lift: -(1 - Math.abs(s)) * 0.028 * k,\\n    hipDrop: 0,\\n    torso: { pitch: 0.06, yaw: -0.07 * s, roll: 0.03 * c },\\n    head: { pitch: 0.02, yaw: 0.05 * s },\\n    armL: { swing: -armAmp * s, lift: 0.06, elbow: 0.26 + 0.22 * Math.max(0, -s) },\\n    armR: { swing: armAmp * s, lift: 0.06, elbow: 0.26 + 0.22 * Math.max(0, s) },\\n    legL: { swing: legAmp * s, spread: 0.02, knee: kneeSwing(w, k), ankle: -0.12 * c },\\n    legR: { swing: -legAmp * s, spread: 0.02, knee: kneeSwing(w + Math.PI, k), ankle: 0.12 * c }\\n  };\\n}\\n\\nfunction kneeIdle(shift: number): number {\\n  return 0.06 + 0.05 * Math.max(0, shift);\\n}\\n\\nfunction kneeSwing(w: number, k: number): number {\\n  return 0.12 + 0.80 * k * Math.max(0, Math.sin(w + 1.15));\\n}\\n\\n/**\\n * Stillastående. `t` i sekunder. Andning, tyngdöverföring och en\\n * långsam huvudvridning — nog för att en stillastående figur inte\\n * ska läsa som död, inte nog för att bli en manér.\\n */\\nexport function poseIdle(t: number, options?: Partial<PoseOptions>): FigurePose {\\n  const o = options ?? {};\\n  const k = o.intensity ?? 1;\\n  const time = t ?? 0;\\n  const shift = Math.sin(time * 0.35) * k;\\n  const breathe = Math.sin(time * 2 * Math.PI * 0.22);\\n  return {\\n    lift: (breathe - 1) * 0.003,\\n    hipDrop: 0,\\n    torso: { pitch: 0.015, yaw: 0.02 * shift, roll: 0.025 * shift },\\n    head: { pitch: 0.03, yaw: 0.16 * Math.sin(time * 0.18) },\\n    armL: { swing: 0.03, lift: 0.055 + 0.012 * shift, elbow: 0.16 + 0.03 * breathe },\\n    armR: { swing: 0.03, lift: 0.055 - 0.012 * shift, elbow: 0.16 - 0.03 * breathe },\\n    // Fotleden håller foten plan mot golvet: ankle = knä − höft, annars\\n    // dyker tåspetsen under golvplanet så fort knät böjs.\\n    legL: { swing: 0.02, spread: 0.035, knee: kneeIdle(shift), ankle: kneeIdle(shift) - 0.02 },\\n    legR: { swing: 0.02, spread: 0.035, knee: kneeIdle(-shift), ankle: kneeIdle(-shift) - 0.02 }\\n  };\\n}\\n\\n/**\\n * Sittande. Höften sänks 0,41 m till stolshöjd (sits 0,45 m), låret\\n * går ut vågrätt och underbenet lätt bakåt, så sulan står plan i\\n * golvplanet. Ersätter InteriorGuests SIT_DIP_M-tricket, där hela\\n * pucken sjönk 0,27 m utan att kroppen ändrade form.\\n */\\nexport function poseSeated(t: number, options?: Partial<PoseOptions>): FigurePose {\\n  const o = options ?? {};\\n  const time = t ?? 0;\\n  const breathe = Math.sin(time * 2 * Math.PI * 0.2);\\n  const nod = Math.sin(time * 2 * Math.PI * 0.35);\\n  return {\\n    lift: (breathe - 1) * 0.005,\\n    hipDrop: 0.41,\\n    torso: { pitch: 0.06 + 0.012 * breathe, yaw: (o.targetYaw ?? 0) * 0.3, roll: 0 },\\n    head: { pitch: 0.05 + 0.05 * nod, yaw: (o.targetYaw ?? 0) * 0.7 },\\n    armL: { swing: 0.52, lift: 0.06, elbow: 1.14 + 0.02 * breathe },\\n    armR: { swing: 0.52, lift: 0.06, elbow: 1.14 - 0.02 * breathe },\\n    // knä 1,77 och fotled 0,31 ger ankle_y = 0,060 och plan fot: sulan\\n    // står i golvplanet i stället för tre centimeter ner i det.\\n    legL: { swing: 1.46, spread: 0.06, knee: 1.77, ankle: 0.31 },\\n    legR: { swing: 1.46, spread: 0.06, knee: 1.77, ankle: 0.31 }\\n  };\\n}\\n\\n/**\\n * Hälsning. En arm upp och en vinkning på ~1,6 Hz, bålen vänd mot\\n * den man hälsar på. `options.side`: 1 = höger arm, -1 = vänster.\\n * `options.targetYaw` = vridningen mot mottagaren, relativt kursen.\\n */\\nexport function poseGreet(t: number, options?: Partial<PoseOptions>): FigurePose {\\n  const o = options ?? {};\\n  const time = t ?? 0;\\n  const yaw = o.targetYaw ?? 0;\\n  const wave = Math.sin(time * 2 * Math.PI * 1.6);\\n  const raised: PoseArm = { swing: 1.12, lift: 0.52 + 0.20 * wave, elbow: 0.82 - 0.16 * wave };\\n  const resting: PoseArm = { swing: 0.06, lift: 0.06, elbow: 0.22 };\\n  let armL: PoseArm = resting;\\n  let armR: PoseArm = raised;\\n  if ((o.side ?? 1) < 0) { armL = raised; armR = resting; }\\n  return {\\n    lift: (wave - 1) * 0.004,\\n    hipDrop: 0,\\n    torso: { pitch: 0.09, yaw: yaw * 0.4, roll: 0 },\\n    head: { pitch: 0.04, yaw: yaw * 0.6 },\\n    armL: armL,\\n    armR: armR,\\n    legL: { swing: 0.05, spread: 0.05, knee: 0.08, ankle: 0.03 },\\n    legR: { swing: -0.03, spread: 0.05, knee: 0.12, ankle: 0.15 }\\n  };\\n}\\n\\n/**\\n * Arbete vid en yta — passet, baren, ett bord. Bålen fram, huvudet\\n * ner mot händerna, armarna växelvis i arbete på ~1,3 Hz.\\n */\\nexport function poseWork(t: number, options?: Partial<PoseOptions>): FigurePose {\\n  const o = options ?? {};\\n  const k = o.intensity ?? 1;\\n  const time = t ?? 0;\\n  const beat = Math.sin(time * 2 * Math.PI * 1.3) * k;\\n  const off = Math.cos(time * 2 * Math.PI * 1.3) * k;\\n  return {\\n    lift: 0.012 * Math.abs(beat),\\n    hipDrop: 0,\\n    torso: { pitch: 0.22, yaw: 0.05 * off, roll: 0.02 * beat },\\n    head: { pitch: 0.30, yaw: 0.05 * off },\\n    armL: { swing: 0.84 + 0.14 * beat, lift: 0.14, elbow: 0.96 - 0.18 * beat },\\n    armR: { swing: 0.84 - 0.14 * beat, lift: 0.14, elbow: 0.96 + 0.18 * beat },\\n    legL: { swing: 0.04, spread: 0.07, knee: 0.10, ankle: 0.06 },\\n    legR: { swing: -0.06, spread: 0.07, knee: 0.14, ankle: 0.20 }\\n  };\\n}\\n\\n/**\\n * Bär något. Båda armar fram, underarmarna vågräta, händerna möts\\n * ~0,40 m framför bålen på ~1,15 m höjd — där en bricka ligger.\\n * Föremålet ingår inte i leveransen; montera det som barn till\\n * joints.handAnchorL / handAnchorR.\\n *\\n * `options.phase` (cykler) blandar in gångbenen, så bärande under\\n * förflyttning är samma pose och inte en fjärde variant.\\n */\\nexport function poseCarry(t: number, options?: Partial<PoseOptions>): FigurePose {\\n  const o = options ?? {};\\n  const time = t ?? 0;\\n  const settle = Math.sin(time * 2 * Math.PI * 0.9) * 0.02;\\n  let base = poseIdle(time, o);\\n  if (o.phase !== null && o.phase !== undefined) base = poseWalk(o.phase, o);\\n  const bt = base.torso ?? {};\\n  const bh = base.head ?? {};\\n  return {\\n    lift: base.lift,\\n    hipDrop: 0,\\n    torso: { pitch: -0.02, yaw: (bt.yaw ?? 0) * 0.5, roll: (bt.roll ?? 0) * 0.5 },\\n    head: { pitch: 0.10, yaw: (bh.yaw ?? 0) * 0.5 },\\n    armL: { swing: 0.55 + settle, lift: 0.16, elbow: 1.05 - settle },\\n    armR: { swing: 0.55 - settle, lift: 0.16, elbow: 1.05 + settle },\\n    legL: base.legL,\\n    legR: base.legR\\n  };\\n}\\n\\n// ---------- not: vilka ledvinklar varje pose sätter -------------------\\n//\\n// Alla sex sätter bål, huvud, båda armar och båda ben — applyPose\\n// skriver alltid hela riggen, så ingen pose kan lämna ett led kvar i\\n// en tidigare poses vinkel. Det som skiljer dem är vilka led som\\n// faktiskt bär gesten:\\n\\nexport const POSE_JOINT_NOTES: Record<PoseName, string> = {\\n  poseWalk:\\n    'Höft ±0,55 rad ur fas, knä 0,12–0,92 rad på svingbenet, fotled ±0,12. ' +\\n    'Axel ±0,42 rad motfas mot benen, armbåge 0,26–0,48. Bål 0,06 fram, ' +\\n    'vrid ±0,07 och rull ±0,03 per cykel. Kroppen dippar 0,028 m mot ' +\\n    'dubbelstöd — hjässan är taket, inte medelvärdet. ' +\\n    'Fasen kommer från sträcka, inte klocka.',\\n  poseIdle:\\n    'Nära noll överallt. Tyngdöverföring 0,35 Hz på bålens rull ±0,025 och ' +\\n    'knäna 0,06–0,11, fotled = knä − höft så sulan står plan. Andning ' +\\n    '0,22 Hz på kroppens y, 0–0,006 m nedåt. Huvudvridning ' +\\n    '±0,16 rad på 0,18 Hz. Armbåge 0,16 så armarna inte hänger som brädor.',\\n  poseSeated:\\n    'hipDrop 0,41 m (sits 0,45). Höft 1,46 rad fram, knä 1,77 rad, fotled 0,31 ' +\\n    '— låret vågrätt, underbenet lätt bakåt, sulan plan i golvplanet. Axel 0,52 / armbåge 1,14 ' +\\n    'lägger händerna på låren. Bål 0,06 fram, nick 0,35 Hz. targetYaw vrider ' +\\n    'huvud 0,7 och bål 0,3 mot bordet.',\\n  poseGreet:\\n    'En axel 1,12 rad fram och 0,52 rad ut, armbåge 0,82 — handen i huvudhöjd. ' +\\n    'Vinkning 1,6 Hz på axelns lift ±0,20 och armbågen ∓0,16. Andra armen 0,06/0,22. ' +\\n    'Bål 0,09 fram, targetYaw vrider bål 0,4 och huvud 0,6. Benen står isär 0,05.',\\n  poseWork:\\n    'Bål 0,22 fram, huvud 0,30 ner mot händerna. Båda axlar 0,84 rad fram, ' +\\n    'armbåge 0,96, växelvis ±0,14/∓0,18 på 1,3 Hz så händerna arbetar i motfas. ' +\\n    'Benen isär 0,07, bakre knä 0,14, fotled 0,06/0,20 så fötterna står plana.',\\n  poseCarry:\\n    'Båda axlar 0,55 rad fram och 0,16 ut, armbåge 1,05 — handankarna möts ' +\\n    '0,40 m fram på 1,15 m höjd. Bål 0,02 bakåt som motvikt, huvud 0,10 ner. ' +\\n    'Vaggning 0,9 Hz ±0,02 på axel och armbåge. options.phase byter ut benen ' +\\n    'mot poseWalk, så bärande under gång är samma pose.'\\n};\\n\\n// ---------- mätning ---------------------------------------------------\\n\\n/**\\n * Faktisk utbredning i världsmått. ORDER 121 §7 mäter figuren i vyn,\\n * inte i scengrafen — den här funktionen ger samma tal som\\n * playwright-mätningen ska bekräfta (höjd 1,70 × heightMult i stående pose —\\n * 1,70 m exakt för personal — bredd = axelbredden).\\n */\\nexport function measureFigure(rig: FigureRig) {\\n  rig.root.updateWorldMatrix(true, true);\\n  // Exakta hörn, inte transformerade AABB:er. Box3.setFromObject roterar\\n  // varje geometris AABB, och en lutad sfärs AABB blåser upp höjden med\\n  // ~6 mm — då skulle kontraktet läsa 1,706 m fast silhuetten toppar på\\n  // 1,700. Här samlas verkliga världskoordinater i stället.\\n  const box = new THREE.Box3();\\n  const v = new THREE.Vector3();\\n  rig.root.traverse(function (o) {\\n    if (!o.isMesh || !o.geometry) return;\\n    const pos = o.geometry.attributes.position;\\n    if (!pos) return;\\n    for (let i = 0; i < pos.count; i++) {\\n      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);\\n      box.expandByPoint(v);\\n    }\\n  });\\n  const size = new THREE.Vector3();\\n  box.getSize(size);\\n  return {\\n    height: size.y,\\n    width: size.x,\\n    depth: size.z,\\n    crownY: box.max.y,\\n    anchorY: rig.joints.headAnchor.getWorldPosition(new THREE.Vector3()).y\\n  };\\n}\\n\\n// ---------- ÖPPNA FRÅGOR TILL SIMULERINGEN ----------------------------\\n//\\n// ORDER 121 §4: en pose som kräver information spelet inte har ska\\n// flaggas, inte uppfinnas. Tre poser saknar indata i dag. Riggen\\n// exponerar dem ändå — de fungerar så snart någon skickar in ett\\n// tillstånd — men presentationslagret väljer dem inte självt.\\n//\\n// 1. poseWork  — TeamMember bär bara `role`. Det finns ingen uppgift\\n//    på den entitet InteriorStaff.tsx renderar, så \\\"arbetar just nu\\\"\\n//    går inte att läsa av. `staffTasks` i strings.sv.ts är text utan\\n//    koppling till en tillståndsmaskin. Fram till dess är poseWork\\n//    korrekt bara som roll-konstant (kock vid passet), inte som\\n//    händelse. FLAGGAT.\\n//\\n// 2. poseCarry — samma sak, plus: ingenting säger VAD som bärs eller\\n//    mellan vilka två punkter. Handankaret finns; valet av pose\\n//    kräver ett bär-tillstånd som inte existerar. FLAGGAT.\\n//\\n// 3. Golvkontakt vid studs — inte en saknad indata, men ett val som hör\\n//    hit. 1,700 m är ett tak, så gångstuds och andning sänker kroppen i\\n//    stället för att lyfta den. Mätt lägsta punkt över hela cykeln, per\\n//    pose: poseWalk och poseCarry −0,029 m (gångstudsen), poseSeated\\n//    −0,012 m, poseGreet −0,009 m, poseIdle −0,007 m, poseWork\\n//    −0,000 m. De stillastående poserna håller sulan i golvplanet med\\n//    plan fotled (ankle = knä − höft); det som återstår är studsen.\\n//    Osynligt i strategisk kamera. Ska kontakten vara exakt även under\\n//    studs hör den i knäböjen, och det kräver en enkel ben-IK som inte\\n//    ingår i den här ordern.\\n//\\n// 4. poseGreet — riktningen (targetYaw) kräver vem figuren vänder sig\\n//    mot. För personal finns kanten redan: StaffMember.targetGuestId\\n//    plus bryggan i teamStaffBridge.ts (samma som pip-en använder).\\n//    För gäst mot gäst finns ingen sådan kant. Om värden ska hälsa på\\n//    en ankommande gäst behöver simuleringen säga vilken gäst.\\n//    HÄRLEDBAR FÖR PERSONAL, FLAGGAT FÖR GÄST.\\n//\\n// 5. Kort gäst på fast sits (nytt med SD-004 §3.3). Sitsen ankras, så\\n//    höften hamnar rätt oavsett längd — men underbenet skalas med\\n//    kroppen, och vid mult under ~0,95 når sulan inte golvet från en\\n//    0,45 m sits. Fötterna hänger, vilket är anatomiskt hederligt och\\n//    osynligt i strategisk kamera. Exakt golvkontakt kräver samma\\n//    ben-IK som punkt 3 och ingår inte här. FLAGGAT, EJ BLOCKANDE.\\n//\\n// poseWalk, poseIdle och poseSeated behöver ingen ny information:\\n// GuestState och den befintliga positionsinterpolationen räcker\\n// (arriving/waiting/leaving/declined → poseWalk med fas ur sträckan,\\n// stillastående → poseIdle, seated/ordering/dining/paying/sleeping →\\n// poseSeated).\\n\",\"figureClips.ts\":\"// figureClips — rummets kroppsspråk: namngivna klipp på den befintliga riggen.\\n//\\n// Leverans 2 efter tredje provspelet (teaterns grund), 2026-09-29.\\n// Bygger på figureRig.ts (applyPose, blendPose, poseWalk, FIGURE) och tableware.ts\\n// (vad händerna håller). Ersätter inget. figureActs.ts poser gäller som förut; klippen är\\n// lagret ovanpå, med längd, tempo, början och slut.\\n//\\n// Kontrakt (samma som riggen):\\n//   • Rena funktioner. sampleClip(id, tid, tempo, ctx) ger samma bildruta för samma indata.\\n//     Ingen klocka, inget tillstånd, inga slumptal.\\n//   • Inga nya led och inga nya mått. Allt är ledvinklar på riggen som redan finns.\\n//   • Varje klipp har ett namn, en längd per tempo, loop eller engång, vad händerna håller\\n//     vid start och slut, händelserna (grepp, släpp, överlämning) och vilka klipp som får följa.\\n//\\n// ── Varför klipp ──────────────────────────────────────────────────\\n// I provspelet stod det i raketen att servitören skar sig i handen, men i rummet syntes\\n// ingenting. Personalen gick slumpvis och robotaktigt. Med klippen kan en raket börja med\\n// något spelaren ser: den som ska göra något gör det i rummet först, och frågan kommer sedan.\\n//\\n// ── Läsbarhet från 24 m ───────────────────────────────────────────\\n// Spelets kamera står på 24 m med 50° lutning (SVAR §25). En figur är 55–80 px hög. Det som\\n// läses är höjd, riktning, armar över axelhöjd och föremål i handen. Därför är gesterna\\n// förstorade: vinkningen går över huvudet, hällningen tippar flaskan 1,9 rad, skålen möts\\n// över bordets mitt och den som skär sig viker sig framåt och backar ett steg.\\n//\\n// ── Tempo ─────────────────────────────────────────────────────────\\n// Tre tempon: lugn, normal och stressad. Tempot ändrar tre saker: takten (klippets längd),\\n// gångfarten och hållningen (bålen fram, blicken som rycker upp). Driv klippets tid med en\\n// integrerad klocka, clipTime += dt × 1, och byt tempo bara vid klippgräns, annars hoppar\\n// fasen. Det är samma regel som staffTempo() i figureActs.ts.\\n\\nimport { FIGURE, blendPose, poseWalk } from './figureRig';\\nimport type { FigurePose, PoseArm } from './figureRig';\\nimport type { PropId, HandSide, Tilt, Surface } from './tableware';\\n\\n// #region types\\n\\nexport type TempoId = 'calm' | 'normal' | 'stressed';\\nexport type Role = 'waiter' | 'bartender' | 'sommelier' | 'cook' | 'dishwasher' | 'guest' | 'staff' | 'host';\\nexport type ClipGroup = 'staff' | 'waiter' | 'bartender' | 'sommelier' | 'cook' | 'dishwasher' | 'guest' | 'rocket' | 'host';\\n/** Kroppens läge vid klippets start och slut. Två klipp kan följa på varandra bara om\\n *  slutet på det ena är början på det andra. */\\nexport type Stance = 'stand' | 'seated' | 'walk' | 'hurt';\\n/** Platsen klippet kräver. 'chair' betyder en stol som följer sittregeln (SEAT_RULE). */\\nexport type Needs = 'floor' | 'chair' | 'stool' | 'lounge' | 'table' | 'bar' | 'pass' | 'station' | 'sink' | 'desk' | 'wheelchair';\\n/** Sittplatsens sort. Vinbarens 'bar' är 'stool' och 'twotop' är 'chair' (seatKindFromRoom). */\\nexport type SeatKind = 'chair' | 'stool' | 'lounge';\\n/** Stämningen ett klipp uttrycker (guestMood.ts). Leverans 2026-10-03. */\\nexport type MoodId = 'delighted' | 'content' | 'waiting' | 'impatient' | 'displeased';\\nexport type ClipEventType =\\n  | 'grab' | 'release' | 'give' | 'switch' | 'stack'\\n  | 'clink' | 'cork' | 'plated' | 'bell' | 'pay' | 'cut'\\n  // Leverans 3: tända ett ljus, släppa (ljuset som faller), visa upp något, kvävas (lågan under förklädet)\\n  | 'light' | 'drop' | 'show' | 'smother';\\n\\nexport interface ClipEvent {\\n  /** Var i klippet, 0..1. */\\n  u: number;\\n  type: ClipEventType;\\n  hand?: HandSide;\\n  /** Varifrån (grab) eller vart (release). 'partner' = den andra figuren i samspelet. */\\n  at?: Surface | 'partner';\\n}\\n\\nexport interface Hands { L?: PropId | 'any'; R?: PropId | 'any' }\\n\\nexport interface ClipCtx {\\n  /** Sekunder sedan klippet började (sätts av sampleClip). */\\n  t?: number;\\n  /** 0..1. Sätts av tempot om den saknas. */\\n  stress?: number;\\n  /** Gångfas i cykler, för klipp som går (travel). Från sträckan, inte klockan. */\\n  phase?: number;\\n  /** Vridning mot den figuren vänder sig till, radianer i figurens ram. */\\n  yaw?: number;\\n  /** 1 eller -1. Vilken sida figuren kliver åt (sitta, resa sig, väja). */\\n  side?: number;\\n  /** Vilken hand ett enhandsklipp använder. Default 'R'. Speglar klippet. */\\n  hand?: HandSide;\\n  /** Skål och gester finns både sittande och stående. Default: klippets 'from'. */\\n  seated?: boolean;\\n  /** Sittplatsen gästen sitter på. Sittande klipp som är författade för stol läggs om till\\n   *  barstol eller lounge (reseat). Default 'chair'. */\\n  seatKind?: SeatKind;\\n  /** Gästens heightMult (figureRig). Behövs för att höften ska landa på en barstol. */\\n  heightMult?: number;\\n  /** Armar som håller något från ett tidigare klipp och inte ska röras. */\\n  keep?: { L?: PoseArm; R?: PoseArm };\\n  /** Sätts av sampleClip. */\\n  stride?: number;\\n}\\n\\nexport interface ClipSpec {\\n  id: string;\\n  group: ClipGroup;\\n  /** Vilka som kan spela klippet. */\\n  roles: Role[];\\n  loop: boolean;\\n  /** Går figuren under klippet? Benen drivs då av ctx.phase och roten av anroparen. */\\n  travel: boolean;\\n  /** Längd vid normalt tempo, sekunder. För loopar: en cykel. */\\n  base: number;\\n  /** Längd per tempo, sekunder. Fylls i av def(). */\\n  seconds: Record<TempoId, number>;\\n  from: Stance;\\n  to: Stance;\\n  needs: Needs;\\n  /** Vad händerna håller vid start och vid slut. */\\n  holds: Hands;\\n  ends: Hands;\\n  events: ClipEvent[];\\n  next: string[];\\n  /** Enhandsklipp kan speglas med ctx.hand = 'L'. */\\n  handed?: boolean;\\n  pose: (u: number, c: ClipCtx) => FigurePose;\\n  /** Lutning på det som hålls (flaskan vid hällning, glaset vid klunken). */\\n  tilt?: (u: number, c: ClipCtx) => { L?: Tilt; R?: Tilt };\\n  /** Förflyttning under klippet i figurens ram vid start: [x, z, vridning]. x åt höger\\n   *  hands sida, z framåt. Används av sitta, resa sig, väja och backa. */\\n  root?: (u: number, c: ClipCtx) => [number, number, number];\\n  /** Hur långt stolen är utdragen, meter bakåt från sitt läge. */\\n  chair?: (u: number) => number;\\n  /** Sittplatsen klippet är författat för. Saknas = stol. Klipp med egen sort läggs inte om. */\\n  seatKind?: SeatKind;\\n  /** Stämningsgesterna: vilken stämning klippet visar. Tempot är styrkan: lugn = antydd, stressad = tydlig. */\\n  mood?: MoodId;\\n}\\n\\nexport interface ClipSample {\\n  pose: FigurePose;\\n  tilt: { L?: Tilt; R?: Tilt };\\n  root: [number, number, number];\\n  chair: number;\\n  u: number;\\n}\\n\\nexport interface Seat {\\n  /** Sitsens mitt i världen. */\\n  x: number;\\n  z: number;\\n  /** Vart den som sitter tittar (mot bordet). */\\n  yaw: number;\\n  /** Sitshöjd över golvet. */\\n  seatHeight: number;\\n  /** Stol, barstol eller lounge. Saknas = stol. */\\n  kind?: SeatKind;\\n}\\n\\n// #endregion types\\n\\n// ---------- tempo -----------------------------------------------------\\n\\nexport const TEMPO: Record<TempoId, { rate: number; walkSpeed: number; stride: number; stress: number; blendSec: number }> = {\\n  /** Lugnt: 0,8 × takten, 0,9 m/s. Bålen upprätt, blicken stilla. */\\n  calm: { rate: 0.8, walkSpeed: 0.9, stride: 0.9, stress: 0, blendSec: 0.4 },\\n  /** Normalt: 1,2 m/s, som gästernas gång i rummen. */\\n  normal: { rate: 1.0, walkSpeed: 1.2, stride: 1.0, stress: 0.3, blendSec: 0.3 },\\n  /** Stressat: 1,5 × takten, 1,6 m/s, längre steg. Bålen fram, blicken rycker upp. Över 1,6\\n   *  blir hällningen ryckig vid 60 bildrutor. */\\n  stressed: { rate: 1.5, walkSpeed: 1.6, stride: 1.2, stress: 1, blendSec: 0.18 }\\n};\\n\\n/** En gångcykel (två fotisättningar) vid stride 1. */\\nexport const CYCLE_M = 1.25;\\n\\n// ---------- sittregeln ------------------------------------------------\\n//\\n// I provspelet satt en gäst på golvet. Orsaken var att den sittande posen spelades där\\n// gästen råkade stå, utan stol under. Regeln:\\n//   1. En sittande pose får bara spelas av en figur som har en stol (Seat) och vars rot står\\n//      på stolens sitsmitt. canSit() säger nej om stolen saknas eller har fel höjd.\\n//   2. Man kommer till stolen från sidan, inte bakifrån: sitApproach() ger punkten. Gången\\n//      ska sluta där, och guest.sit börjar där.\\n//   3. Höften sänks först när roten är över sitsen. I guest.sit har höften sjunkit 0,1 m\\n//      först vid u = 0,70, och då står bäckenet 0,04 m från sitsens mitt (uppmätt).\\n//   4. Stolen dras ut 0,26 m medan gästen kliver in och skjuts in medan hen sätter sig\\n//      (chair(u)). Rummet ska flytta stolen efter klippet, inte tvärtom.\\n//   5. checkSeated() mäter efteråt: höftens höjd mot sitsen och avståndet till sitsens mitt.\\n//      Kör den på varje sittande gäst i provet. Tolerans 2 cm och 12 cm.\\n// Poserna är författade för sitshöjd 0,45 m (figureRig poseSeated, hipDrop 0,41).\\n//\\n// Tillägget (2026-09-29): barstol och lounge, med vinbarens mått (wineBarRoom.ts).\\n//   Barstol  sits 0,75, fotring 0,30, disken 1,10 och 0,50 m fram. Man kommer bakifrån och\\n//            snett från sidan, tar stöd mot disken, sätter foten på ringen och glider upp.\\n//            Stolen står still. guest.sitStool / guest.leaveStool.\\n//   Lounge   dyna 0,38, 0,72 djup, ryggstöd bakom. Man kommer framifrån, vänder sig om,\\n//            backar in och sänker sig med bålen framåt som motvikt. Sitter tillbakalutad.\\n//            guest.sitLounge / guest.leaveLounge.\\n// Alla sittande loopar (seatedIdle, toast, gesture, lean, pay …) är författade för stol.\\n// sampleClip lägger om dem till den sits ctx.seatKind säger (reseat): höftens sänkning,\\n// benen och bålens lutning byts, armarna behålls. På barstolen ligger disken lika högt\\n// över axeln som bordet på stolen (0,21 m), så underarmarna hamnar på disken utan ändring.\\n//\\n// En kort gäst på barstol: riggens sitsankare (applyPose) är byggt för 0,41 m sänkning och\\n// räcker inte för 0,11. seatLift() ger den lyftning som saknas, så höften landar på sitsen\\n// för heightMult 0,70–1,12. För stol och lounge är den noll.\\n\\nexport const SEAT_RULE = {\\n  seatHeight: 0.45,\\n  seatHeightTolerance: 0.03,\\n  approachSide: 0.45,\\n  approachFront: 0.12,\\n  chairPull: 0.26,\\n  hipTolerance: 0.02,\\n  xzTolerance: 0.12\\n};\\n\\n/** Lokal punkt i stolens ram (x åt höger hands sida, z framåt) till världen. */\\nexport function seatToWorld(seat: Seat, lx: number, lz: number): [number, number] {\\n  const s = Math.sin(seat.yaw), c = Math.cos(seat.yaw);\\n  return [seat.x + lx * c + lz * s, seat.z - lx * s + lz * c];\\n}\\n\\n/** Sittplatsernas mått och kroppens läge på dem. drop = hur mycket höften sänks (hipY − sits).\\n *  approach = var gången slutar, i sitsens ram [x per sida, z]. */\\nexport const SEAT_KINDS: Record<SeatKind, {\\n  height: number; drop: number; approach: [number, number];\\n  legs: { swing: number; spread: number; knee: number; ankle: number };\\n  torso: number; head: number; sit: string; leave: string; footrest?: number;\\n}> = {\\n  chair: { height: 0.45, drop: 0.41, approach: [0.45, 0.12], legs: { swing: 1.46, spread: 0.06, knee: 1.77, ankle: 0.31 }, torso: 0, head: 0, sit: 'guest.sit', leave: 'guest.leave' },\\n  /** Låret 1,1 rad fram, knät 2,1 — sulan på fotringen 0,30 m, tårna 0,25 m fram. */\\n  stool: { height: 0.75, drop: 0.11, approach: [0.3, -0.42], legs: { swing: 1.1, spread: 0.08, knee: 2.1, ankle: 1.0 }, torso: 0.04, head: 0, sit: 'guest.sitStool', leave: 'guest.leaveStool', footrest: 0.30 },\\n  /** Låret 1,55 rad (knät lite över höften), underbenet fram — sulan i golvplanet 0,62 m fram. */\\n  lounge: { height: 0.38, drop: 0.48, approach: [0, 0.6], legs: { swing: 1.55, spread: 0.08, knee: 1.02, ankle: -0.53 }, torso: -0.18, head: 0.1, sit: 'guest.sitLounge', leave: 'guest.leaveLounge' }\\n};\\n\\n/** wineBarRoom.SeatKind → sittregelns sort. */\\nexport function seatKindFromRoom(kind: string): SeatKind {\\n  if (kind === 'bar') return 'stool';\\n  if (kind === 'lounge') return 'lounge';\\n  return 'chair';\\n}\\n\\n/** Den lyftning som saknas för att höften ska landa på sitsen för en skalad gäst.\\n *  applyPose lägger tillbaka hipY × (1 − mult) × min(1, drop / 0,41); här räknas resten ut. */\\nexport function seatLift(kind: SeatKind, heightMult: number): number {\\n  const K = SEAT_KINDS[kind];\\n  const hm = heightMult ?? 1;\\n  const anchored = FIGURE.hipY * (1 - hm) * Math.min(1, K.drop / FIGURE.seatedHipDrop);\\n  return K.height - FIGURE.hipY * hm + K.drop - anchored;\\n}\\n\\n/** Var gången ska sluta innan sittklippet. side = 1 höger om sitsen, -1 vänster.\\n *  Stol: från sidan. Barstol: bakifrån, snett från sidan. Lounge: rakt framifrån. */\\nexport function sitApproach(seat: Seat, side: number): [number, number] {\\n  const a = SEAT_KINDS[seat.kind ?? 'chair'].approach;\\n  return seatToWorld(seat, (side ?? 1) * a[0], a[1]);\\n}\\n\\nexport function canSit(seat: Seat | null | undefined): boolean {\\n  if (!seat) return false;\\n  return Math.abs(seat.seatHeight - SEAT_KINDS[seat.kind ?? 'chair'].height) <= SEAT_RULE.seatHeightTolerance;\\n}\\n\\n/** Klippet som tar en gäst ned på sitsen, och det som tar hen upp igen. */\\nexport function sitClipFor(seat: Seat): string { return SEAT_KINDS[seat.kind ?? 'chair'].sit; }\\nexport function leaveClipFor(seat: Seat): string { return SEAT_KINDS[seat.kind ?? 'chair'].leave; }\\n\\n/** Höftens höjd mot sitsen och avståndet till sitsens mitt, efter applyPose. */\\nexport function checkSeated(rig: { joints: { pelvis: { getWorldPosition: (v: any) => any } } }, seat: Seat, V: any) {\\n  const p = rig.joints.pelvis.getWorldPosition(V);\\n  const hipError = p.y - seat.seatHeight;\\n  const xzError = Math.hypot(p.x - seat.x, p.z - seat.z);\\n  return { hipError: hipError, xzError: xzError, ok: Math.abs(hipError) <= SEAT_RULE.hipTolerance && xzError <= SEAT_RULE.xzTolerance };\\n}\\n\\n// ---------- hjälpare --------------------------------------------------\\n\\nfunction clamp01(u: number): number { return Math.max(0, Math.min(1, u)); }\\nfunction smooth(u: number): number { const k = clamp01(u); return k * k * (3 - 2 * k); }\\n/** 0 → 1 mellan a och b. */\\nfunction ramp(u: number, a: number, b: number): number { return smooth((u - a) / (b - a)); }\\n/** 0 → 1 → 0 över [a, b] med mjuka kanter. */\\nfunction win(u: number, a: number, b: number, e: number): number { return ramp(u, a, a + e) * (1 - ramp(u, b - e, b)); }\\nfunction bell(u: number, c: number, w: number): number { const x = (u - c) / w; return Math.exp(-x * x); }\\nconst TAU = Math.PI * 2;\\n\\nfunction A(swing: number, lift: number, elbow: number): PoseArm { return { swing: swing, lift: lift, elbow: elbow }; }\\n\\nconst LEG_STAND = { swing: 0.02, spread: 0.035, knee: 0.06, ankle: 0.04 };\\nconst LEG_FRONT = { swing: 0.14, spread: 0.05, knee: 0.12, ankle: 0.1 };\\nconst LEG_BACK = { swing: -0.12, spread: 0.05, knee: 0.16, ankle: 0.02 };\\nconst LEG_SEAT = { swing: 1.46, spread: 0.06, knee: 1.77, ankle: 0.31 };\\n/** Halvvägs ned: höft 0,8, knä 1,3, fotled 0,5 = knä − höft, så sulan står plan. */\\nconst LEG_CROUCH = { swing: 0.8, spread: 0.06, knee: 1.3, ankle: 0.5 };\\n\\nconst STAND: FigurePose = {\\n  lift: 0, hipDrop: 0,\\n  torso: { pitch: 0.02, yaw: 0, roll: 0 }, head: { pitch: 0.04, yaw: 0 },\\n  armL: A(0.03, 0.06, 0.18), armR: A(0.03, 0.06, 0.18),\\n  legL: LEG_STAND, legR: LEG_STAND\\n};\\n/** Sittande med underarmarna på bordet (bordsskiva 0,75 m, sits 0,45 m). */\\nconst SEAT: FigurePose = {\\n  lift: 0, hipDrop: FIGURE.seatedHipDrop,\\n  torso: { pitch: 0.06, yaw: 0, roll: 0 }, head: { pitch: 0.06, yaw: 0 },\\n  armL: A(0.78, 0.1, 0.95), armR: A(0.78, 0.1, 0.95),\\n  legL: LEG_SEAT, legR: LEG_SEAT\\n};\\nconst CROUCH: FigurePose = {\\n  lift: 0, hipDrop: 0.18,\\n  torso: { pitch: 0.46, yaw: 0, roll: 0 }, head: { pitch: 0.1, yaw: 0 },\\n  armL: A(0.45, 0.12, 0.6), armR: A(0.45, 0.12, 0.6),\\n  legL: LEG_CROUCH, legR: LEG_CROUCH\\n};\\n\\n/** Bär-armen: underarmen vågrät framåt, handankaret på 1,12 m. */\\nexport const CARRY_ARM: PoseArm = A(0.35, 0.12, 1.1);\\n/** Brickarmen: handen i axelhöjd, ut från kroppen. */\\nexport const TRAY_ARM: PoseArm = A(0.25, 0.3, 2.0);\\n/** Hålla en flaska eller ett kort framför bröstet. */\\nexport const CHEST_ARM: PoseArm = A(0.5, 0.1, 1.3);\\n\\n/** Ett led djupt: det som anges ersätter basens värden, resten ärvs. */\\nfunction P(base: FigurePose, o: any): FigurePose {\\n  const b: any = base;\\n  const r: any = { ...b, ...o };\\n  ['torso', 'head', 'armL', 'armR', 'legL', 'legR'].forEach(function (k) {\\n    if (o[k]) r[k] = { ...(b[k] ?? {}), ...o[k] };\\n  });\\n  return r;\\n}\\n\\n/** Nyckelposer längs u, mjukt blandade. Listan ska vara sorterad. */\\nfunction keys(u: number, ks: [number, FigurePose][]): FigurePose {\\n  if (u <= ks[0][0]) return ks[0][1];\\n  for (let i = 0; i < ks.length - 1; i++) {\\n    if (u <= ks[i + 1][0]) {\\n      const k = (u - ks[i][0]) / (ks[i + 1][0] - ks[i][0]);\\n      return blendPose(ks[i][1], ks[i + 1][1], smooth(k));\\n    }\\n  }\\n  return ks[ks.length - 1][1];\\n}\\n\\nfunction breathe(p: FigurePose, t: number): FigurePose {\\n  return { ...p, lift: (p.lift ?? 0) + (Math.sin(t * TAU * 0.22) - 1) * 0.004 };\\n}\\n\\n/** Stress i hållningen: bålen fram, huvudet fram. Tempot sköts av längden. */\\nfunction strain(p: FigurePose, s: number): FigurePose {\\n  const t = p.torso ?? {}, h = p.head ?? {};\\n  return { ...p, torso: { ...t, pitch: (t.pitch ?? 0) + 0.08 * s }, head: { ...h, pitch: (h.pitch ?? 0) + 0.04 * s } };\\n}\\n\\n/** Lägger gångens ben, studs och bålsvaj på en pose. `free` = armarna som svänger med. */\\nfunction walking(p: FigurePose, phase: number, k: number, free: 'none' | 'L' | 'R' | 'both'): FigurePose {\\n  const w = poseWalk(phase ?? 0, { intensity: k });\\n  const t = p.torso ?? {}, wt = w.torso ?? {};\\n  const r: FigurePose = {\\n    ...p, lift: w.lift, hipDrop: 0, legL: w.legL, legR: w.legR,\\n    torso: { pitch: (t.pitch ?? 0) + 0.04, yaw: (t.yaw ?? 0) + (wt.yaw ?? 0) * 0.7, roll: (wt.roll ?? 0) + (t.roll ?? 0) }\\n  };\\n  if (free === 'L' || free === 'both') r.armL = w.armL;\\n  if (free === 'R' || free === 'both') r.armR = w.armR;\\n  return r;\\n}\\n\\nfunction withYaw(p: FigurePose, torsoYaw: number, headYaw: number): FigurePose {\\n  const t = p.torso ?? {}, h = p.head ?? {};\\n  return { ...p, torso: { ...t, yaw: (t.yaw ?? 0) + torsoYaw }, head: { ...h, yaw: (h.yaw ?? 0) + headYaw } };\\n}\\n\\nfunction base(c: ClipCtx, seatedDefault: boolean): FigurePose {\\n  const seated = c.seated ?? seatedDefault;\\n  return seated ? SEAT : STAND;\\n}\\n\\nfunction mirrorPose(p: FigurePose): FigurePose {\\n  const t = p.torso ?? {}, h = p.head ?? {};\\n  return {\\n    ...p, armL: p.armR, armR: p.armL, legL: p.legR, legR: p.legL,\\n    torso: { ...t, yaw: -(t.yaw ?? 0), roll: -(t.roll ?? 0) }, head: { ...h, yaw: -(h.yaw ?? 0) }\\n  };\\n}\\n\\n// ---------- katalogen ------------------------------------------------\\n\\nfunction round05(x: number): number { return Math.round(x * 20) / 20; }\\n\\nfunction def(c: Omit<ClipSpec, 'seconds'>): ClipSpec {\\n  const seconds: any = {};\\n  (['calm', 'normal', 'stressed'] as TempoId[]).forEach(function (k) {\\n    const T = TEMPO[k];\\n    seconds[k] = c.travel ? round05((CYCLE_M * T.stride) / T.walkSpeed) : round05(c.base / T.rate);\\n  });\\n  return { ...c, seconds: seconds };\\n}\\n\\nconst STAFF: Role[] = ['waiter', 'bartender', 'sommelier', 'cook', 'dishwasher', 'staff', 'host'];\\nconst FLOOR_STAFF: Role[] = ['waiter', 'bartender', 'sommelier'];\\n\\n// Kroppens delposer som flera klipp delar.\\n// Handankaret på 0,81 m och 0,23 m framför roten; med steget in (root) 0,45 m. Tallriken\\n// släpps där handen är och sjunker högst 7 cm till bordsskivan.\\nconst LEAN_SERVE: FigurePose = P(STAND, { lift: -0.08, torso: { pitch: 0.5 }, head: { pitch: 0.3 }, armR: A(0.3, 0.08, 0.0), armL: A(0.1, 0.1, 0.4), legL: { ...LEG_FRONT, knee: 0.3, ankle: 0.16 }, legR: { ...LEG_BACK, knee: 0.3 } });\\nconst SERVE_BACK: FigurePose = P(STAND, { torso: { pitch: 0.12 }, armR: A(0.12, 0.06, 0.35) });\\nconst HURT: FigurePose = P(STAND, { lift: -0.04, torso: { pitch: 0.36 }, head: { pitch: 0.5 }, armR: A(0.5, 0.05, 1.9), armL: A(0.64, -0.12, 1.65), legL: { ...LEG_FRONT, knee: 0.22, ankle: 0.18 }, legR: { ...LEG_BACK, knee: 0.26 } });\\n\\nexport const CLIPS: Record<string, ClipSpec> = {};\\nfunction reg(c: ClipSpec): void { CLIPS[c.id] = c; }\\n\\n// ===== personal, alla roller ==========================================\\n\\nreg(def({\\n  id: 'staff.idle', group: 'staff', roles: STAFF, loop: true, travel: false, base: 4,\\n  from: 'stand', to: 'stand', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['staff.walk', 'staff.idle', 'waiter.takeOrder', 'waiter.pickUp', 'waiter.clear', 'bar.pour', 'bar.wipe', 'somm.present', 'cook.station', 'dish.receive'],\\n  pose: function (u, c) {\\n    const s = c.stress ?? 0;\\n    const scan = s > 0.5 ? 0.4 * Math.sin(u * TAU * 2) : 0.22 * Math.sin(u * TAU);\\n    return breathe(P(STAND, { torso: { roll: 0.025 * Math.sin(u * TAU) }, head: { yaw: scan + (c.yaw ?? 0) * 0.5 }, legL: { knee: 0.06 + 0.05 * Math.max(0, Math.sin(u * TAU)) }, legR: { knee: 0.06 + 0.05 * Math.max(0, -Math.sin(u * TAU)) } }), c.t ?? 0);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'staff.walk', group: 'staff', roles: STAFF, loop: true, travel: true, base: 1,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['staff.idle', 'staff.walk', 'staff.dodge', 'waiter.takeOrder', 'waiter.pickUp', 'waiter.clear', 'waiter.presentBill', 'somm.present', 'somm.pour', 'dish.receive'],\\n  pose: function (u, c) { return walking(STAND, c.phase ?? u, c.stride ?? 1, 'both'); }\\n}));\\n\\nreg(def({\\n  id: 'staff.dodge', group: 'staff', roles: STAFF, loop: false, travel: false, base: 1.4,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: {}, ends: {}, events: [],\\n  next: ['staff.walk'],\\n  pose: function (u, c) {\\n    const side = c.side ?? 1;\\n    const aside = win(u, 0.05, 1, 0.3);\\n    const p = walking(P(STAND, { armL: A(0.2, 0.02, 0.9), armR: A(0.2, 0.02, 0.9) }), u * 2, 0.7, 'none');\\n    return withYaw(p, side * 0.6 * aside, side * 0.3 * aside);\\n  },\\n  root: function (u, c) { const side = c.side ?? 1; return [side * 0.4 * (ramp(u, 0.05, 0.35) - ramp(u, 0.7, 1)), 0.25 * u, 0]; }\\n}));\\n\\n// ===== servitören =====================================================\\n\\nreg(def({\\n  id: 'waiter.carryPlate', group: 'waiter', roles: ['waiter'], loop: true, travel: true, base: 1, handed: true,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: { R: 'plate' }, ends: { R: 'plate' }, events: [],\\n  next: ['waiter.carryPlate', 'waiter.serve', 'staff.dodge'],\\n  pose: function (u, c) {\\n    const s = c.stress ?? 0;\\n    return walking(P(STAND, { torso: { pitch: -0.02 }, head: { pitch: 0.06 }, armR: A(0.35, 0.12, 1.1 + 0.1 * s) }), c.phase ?? u, c.stride ?? 1, 'L');\\n  }\\n}));\\n\\nreg(def({\\n  id: 'waiter.carryTwoPlates', group: 'waiter', roles: ['waiter'], loop: true, travel: true, base: 1,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: { L: 'plate', R: 'plate' }, ends: { L: 'plate', R: 'plate' }, events: [],\\n  next: ['waiter.carryTwoPlates', 'waiter.serve', 'staff.dodge'],\\n  pose: function (u, c) {\\n    return walking(P(STAND, { torso: { pitch: -0.03 }, head: { pitch: 0.06 }, armL: A(0.35, 0.2, 1.1), armR: A(0.35, 0.2, 1.1) }), c.phase ?? u, (c.stride ?? 1) * 0.85, 'none');\\n  }\\n}));\\n\\nreg(def({\\n  id: 'waiter.carryTray', group: 'waiter', roles: ['waiter', 'bartender'], loop: true, travel: true, base: 1,\\n  from: 'walk', to: 'walk', needs: 'floor', holds: { L: 'tray' }, ends: { L: 'tray' }, events: [],\\n  next: ['waiter.carryTray', 'waiter.serve', 'staff.dodge'],\\n  pose: function (u, c) {\\n    const s = c.stress ?? 0;\\n    const tray = s > 0.6 ? A(0.3, 0.28, 1.7) : TRAY_ARM;\\n    return walking(P(STAND, { torso: { pitch: -0.02, roll: 0.04 }, head: { pitch: 0.04 }, armL: tray }), c.phase ?? u, (c.stride ?? 1) * 0.9, 'R');\\n  }\\n}));\\n\\nreg(def({\\n  id: 'waiter.pickUp', group: 'waiter', roles: ['waiter'], loop: false, travel: false, base: 1.4, handed: true,\\n  from: 'stand', to: 'stand', needs: 'pass', holds: {}, ends: { R: 'plate' },\\n  events: [{ u: 0.5, type: 'grab', hand: 'R', at: 'pass' }],\\n  next: ['waiter.pickUp', 'waiter.carryPlate', 'waiter.carryTwoPlates', 'waiter.carryTray'],\\n  pose: function (u) {\\n    return keys(u, [\\n      [0, P(STAND, { armR: A(0.12, 0.06, 0.4) })],\\n      [0.45, P(STAND, { torso: { pitch: 0.3 }, head: { pitch: 0.35 }, armR: A(0.55, 0.08, 0.4), legL: LEG_FRONT, legR: LEG_BACK })],\\n      [0.55, P(STAND, { torso: { pitch: 0.28 }, head: { pitch: 0.3 }, armR: A(0.5, 0.1, 0.6), legL: LEG_FRONT, legR: LEG_BACK })],\\n      [1, P(STAND, { torso: { pitch: -0.02 }, armR: CARRY_ARM })]\\n    ]);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'waiter.serve', group: 'waiter', roles: ['waiter'], loop: false, travel: false, base: 2.4, handed: true,\\n  from: 'stand', to: 'stand', needs: 'table', holds: { R: 'any' }, ends: {},\\n  events: [{ u: 0.55, type: 'release', hand: 'R', at: 'table' }],\\n  next: ['staff.idle', 'staff.walk', 'waiter.serve', 'waiter.clear'],\\n  pose: function (u, c) {\\n    const toward = (c.yaw ?? 0) * 0.3;\\n    return withYaw(keys(u, [\\n      [0, P(STAND, { armR: CARRY_ARM })],\\n      [0.25, P(STAND, { torso: { pitch: 0.1 }, armR: CARRY_ARM })],\\n      [0.5, LEAN_SERVE],\\n      [0.62, LEAN_SERVE],\\n      [0.8, SERVE_BACK],\\n      [1, STAND]\\n    ]), toward * win(u, 0.15, 0.9, 0.2), (c.yaw ?? 0) * 0.6 * win(u, 0.7, 1.01, 0.1));\\n  },\\n  root: function (u) { return [0, 0.22 * win(u, 0.2, 0.92, 0.22), 0]; }\\n}));\\n\\nreg(def({\\n  id: 'waiter.clear', group: 'waiter', roles: ['waiter'], loop: false, travel: false, base: 3, handed: true,\\n  from: 'stand', to: 'stand', needs: 'table', holds: {}, ends: { R: 'plate' },\\n  events: [{ u: 0.4, type: 'grab', hand: 'R', at: 'table' }, { u: 0.82, type: 'stack', hand: 'R' }],\\n  next: ['waiter.clear', 'waiter.carryPlate', 'waiter.carryTwoPlates', 'staff.walk'],\\n  pose: function (u) {\\n    return keys(u, [\\n      [0, STAND],\\n      [0.3, LEAN_SERVE],\\n      [0.45, P(LEAN_SERVE, { armR: A(0.2, 0.1, 0.5) })],\\n      [0.7, P(STAND, { torso: { pitch: 0.05 }, armR: CARRY_ARM })],\\n      [1, P(STAND, { torso: { pitch: -0.02 }, armR: CARRY_ARM })]\\n    ]);\\n  },\\n  root: function (u) { return [0, 0.22 * win(u, 0.15, 0.85, 0.2), 0]; }\\n}));\\n\\nreg(def({\\n  id: 'waiter.takeOrder', group: 'waiter', roles: ['waiter'], loop: true, travel: false, base: 4,\\n  from: 'stand', to: 'stand', needs: 'table', holds: { L: 'pad' }, ends: { L: 'pad' }, events: [],\\n  next: ['waiter.takeOrder', 'staff.walk', 'staff.idle'],\\n  pose: function (u, c) {\\n    const t = c.t ?? 0;\\n    const up = win(u, 0, 0.35, 0.08) + win(u, 0.55, 0.8, 0.08);\\n    const write = 1 - up;\\n    const p = P(STAND, {\\n      torso: { pitch: 0.1 + 0.04 * up },\\n      head: { pitch: 0.45 - 0.5 * up + 0.08 * bell(u, 0.22, 0.04), yaw: (c.yaw ?? 0) * 0.8 * up },\\n      armL: A(0.55, 0.08, 1.55),\\n      armR: A(0.45, 0.02, 1.7 + 0.07 * write * Math.sin(t * TAU * 3)),\\n      legL: LEG_FRONT, legR: LEG_STAND\\n    });\\n    return breathe(withYaw(p, (c.yaw ?? 0) * 0.25, 0), t);\\n  }\\n}));\\n\\nreg(def({\\n  id: 'waiter.presentBill', group: 'waiter', roles: ['waiter'], loop: false, travel: false, base: 3.2,\\n  from: 'stand', to: 'stand', needs: 'table', holds: { R: 'billFolder' }, ends: { R: 'billFolder' },\\n  events: [{ u: 0.38, type: 'release', hand: 'R', at: 'table' }, { u: 0.9, type: 'grab', hand: 'R', at: 'table' }],\\n  next: ['staff.walk', 'staff.idle'],\\n  pose: function (u, c) {\\n    const wait = P(STAND, { torso: { pitch:
