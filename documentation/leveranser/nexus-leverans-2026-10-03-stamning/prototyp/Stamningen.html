Math.PI : 0, approach: [x, side * 3.1], lane: side > 0 ? 'north' : 'south'\\n      });\\n    });\\n  });\\n  // Diskens ljus — bara helg.\\n  candle(-1.35, Y + bh + 0.05, BAR.z1 - 0.3, 'barN1', true);\\n  candle(0.9, Y + bh + 0.05, BAR.z1 - 0.3, 'barN2', true);\\n  candle(-1.35, Y + bh + 0.05, BAR.z0 + 0.3, 'barS1', true);\\n  candle(0.9, Y + bh + 0.05, BAR.z0 + 0.3, 'barS2', true);\\n\\n  // ── Ståplatser: barens östra kortände + två ståbord ───────────\\n  const standing: StandSpec[] = [];\\n  [-0.9, -0.3, 0.3, 0.9].forEach(function (z, k) {\\n    standing.push({ id: 'standBar' + (k + 1), kind: 'barEnd', local: [BAR.x1 + 0.45, z], facing: -Math.PI / 2, approach: [3.6, z], lane: 'spine' });\\n  });\\n  [[5.0, 2.9], [5.6, 4.6]].forEach(function (p, k) {\\n    const id = 'highTable' + (k + 1);\\n    table(id, p[0], p[1], 0.62, 0.62, 1.08, M.brass);\\n    candle(p[0], Y + 1.08 + 0.025, p[1], id, true);\\n    standing.push({ id: id + 'a', kind: 'highTable', local: [p[0] - 0.55, p[1]], facing: Math.PI / 2, approach: [p[0] - 0.9, p[1]], lane: 'spine' });\\n    standing.push({ id: id + 'b', kind: 'highTable', local: [p[0] + 0.55, p[1]], facing: -Math.PI / 2, approach: [p[0] + 0.9, p[1]], lane: 'spine' });\\n  });\\n  // Klädhängaren vid dörren — dit \\\"på väg att gå\\\" tittar.\\n  rectBox(furniture, M.brass, inX - 0.12, inX - 0.06, 1.1, 2.3, Y + 1.7, Y + 1.74, 'coatRail');\\n  rectBox(furniture, M.brass, inX - 0.12, inX - 0.06, 1.1, 1.14, Y, Y + 1.74, 'coatRailPostA');\\n  rectBox(furniture, M.brass, inX - 0.12, inX - 0.06, 2.26, 2.3, Y, Y + 1.74, 'coatRailPostB');\\n  // Värdpulten söder om dörrmattan (leverans 3, godkänd 2026-09-30). Framsidan mot dörren (+x).\\n  // 0,60 bred längs z, 0,45 djup längs x, 1,10 hög. Samma mått som tableware 'hostDesk'. Vasen står på den.\\n  rectBox(furniture, M.bar, 6.375, 6.825, -0.85, -0.25, Y, Y + 0.06, 'hostDeskPlinth');\\n  rectBox(furniture, M.bar, 6.395, 6.805, -0.83, -0.27, Y + 0.06, Y + 1.06, 'hostDesk');\\n  rectBox(furniture, M.barTop, 6.375, 6.825, -0.85, -0.25, Y + 1.06, Y + 1.10, 'hostDeskTop');\\n  rectBox(furniture, M.brass, 6.805, 6.811, -0.83, -0.27, Y + 0.91, Y + 0.93, 'hostDeskBrass');\\n\\n  // ── Vardagens koreografi (efter leverans 3) ──────────────────────\\n  // Trottoaren utanför dörren, där kön står. Samma höjd som golvet, en kantsten mot gatan.\\n  const paveM = mat('#4b433c', 0.95, 0), boardM = mat('#23221f', 0.9, 0), steelM = mat('#9a978f', 0.35, 0.6);\\n  floorPlate(furniture, paveM, halfW, halfW + 3.4, -halfD - 3.2, 2.8, 0, 'pavement');\\n  rectBox(furniture, M.wallCap, halfW + 3.4, halfW + 3.55, -halfD - 3.2, 2.8, Y - 0.02, Y + 0.1, 'kerb');\\n  // Tavlan på staffli söder om pulten, framsidan mot dörren (+x). Per skriver kvällens viner på den.\\n  rectBox(furniture, M.bar, 6.91, 6.95, -2.08, -2.04, Y, Y + 1.55, 'easelLegS');\\n  rectBox(furniture, M.bar, 6.91, 6.95, -1.46, -1.42, Y, Y + 1.55, 'easelLegN');\\n  rectBox(furniture, boardM, 6.95, 6.99, -2.05, -1.45, Y + 0.72, Y + 1.48, 'menuBoard');\\n  rectBox(furniture, M.brass, 6.95, 7.0, -2.07, -1.43, Y + 1.48, Y + 1.51, 'menuBoardTop');\\n  // Vinkylen i södra stråkets östra ände, glasdörren mot väster. Elin fyller den före öppning.\\n  // Stående och 1,45 m hög, så att den som fyller syns över norra disken från spelets kamera.\\n  rectBox(furniture, steelM, 2.0, 2.38, -1.15, -0.3, Y, Y + 1.45, 'barFridge');\\n  rectBox(furniture, mat('#3a4a4c', 0.15, 0.3, '#9fd0d0', 0.25), 1.985, 2.0, -1.1, -0.35, Y + 0.12, Y + 1.38, 'barFridgeGlass');\\n  rectBox(furniture, M.brass, 1.97, 1.985, -0.4, -0.37, Y + 0.6, Y + 1.0, 'barFridgeHandle');\\n\\n  const entrance: Vec2 = [inX - 0.55, 0];\\n  const waitingSpot: Vec2 = [halfW + 2.5, 0];\\n  const door: Vec2 = [halfW, 0];\\n  const faceDoor = function (p: Vec2) { return Math.atan2(door[0] - p[0], door[1] - p[1]); };\\n  const queueSpots: QueueSpot[] = [\\n    { id: 'queueIn1', side: 'inside', order: 1, local: [7.2, 0.3], facing: -Math.PI / 2 },\\n    { id: 'queueIn2', side: 'inside', order: 2, local: [7.3, 0.85], facing: -Math.PI / 2 }\\n  ];\\n  [[8.35, 0.1], [8.5, -1.8], [8.6, -3.7], [8.7, -5.6], [8.75, -7.5]].forEach(function (p, i) {\\n    queueSpots.push({ id: 'queueOut' + (i + 1), side: 'outside', order: i + 3, local: p as Vec2, facing: faceDoor(p as Vec2) });\\n  });\\n  const miseSpots: MiseSpot[] = [\\n    { id: 'board', role: 'host', local: [7.4, -1.75], facing: -Math.PI / 2, note: 'Framför tavlan. Per skriver kvällens viner.' },\\n    { id: 'fridge', role: 'sommelier', local: [1.55, -0.72], facing: Math.PI / 2, note: 'Framför vinkylen i södra stråkets östra ände.' },\\n    { id: 'store', role: 'sommelier', local: [-6.25, -1.9], facing: -Math.PI / 2, note: 'Vid vinkylen i förrådet, där backarna hämtas.' },\\n    { id: 'polish', role: 'bartender', local: [-0.9, -0.74], facing: Math.PI, note: 'Södra stråket, vänd mot disken. Glasen ställs på rad.' },\\n    { id: 'setTables', role: 'server', local: [-2.1, -3.85], facing: Math.PI, note: 'Norr om småborden. Dukar kuvert för kuvert.' }\\n  ];\\n\\n  const staffStations: StaffStation[] = [\\n    { id: 'bartender', role: 'bartender', local: [-0.9, -0.74], standHeight: 0, facing: 0, uniform: STAFF_UNIFORMS.bartender,\\n      note: 'Södra stråket, vänd mot vinväggen när hon häller, mot södra stolarna när hon serverar. Stråk 0,98 m.' },\\n    { id: 'sommelier', role: 'sommelier', local: [1.3, 0.74], standHeight: 0, facing: Math.PI / 2, uniform: STAFF_UNIFORMS.sommelier,\\n      note: 'Norra stråkets östra ände, vid bottleAnchor. Går ut på golvet med flaskan.' },\\n    { id: 'server', role: 'server', local: [KITCHEN.x1 + 0.5, 2.7], standHeight: 0, facing: -Math.PI / 2, uniform: STAFF_UNIFORMS.server,\\n      note: 'Utanför passluckan. Bär smårätter; vinet hämtas vid barens NO-hörn.' },\\n    { id: 'cookHot', role: 'cook', local: [-6.2, 3.9], standHeight: 0, facing: -Math.PI / 2, uniform: STAFF_UNIFORMS.kitchen,\\n      note: 'Varm station. Plancha under kåpa.' },\\n    { id: 'cookCold', role: 'cook', local: [-5.75, 4.5], standHeight: 0, facing: 0, uniform: STAFF_UNIFORMS.kitchen,\\n      note: 'Kallskänk. Ett steg från varm station — en kock kan ta båda en tisdag.' },\\n    { id: 'dish', role: 'dish', local: [-6.4, 2.75], standHeight: 0, facing: Math.PI, uniform: STAFF_UNIFORMS.kitchen,\\n      note: 'Diskplatsen. Delar köksuniform; rollen läses av platsen.' },\\n    { id: 'host', role: 'host', local: [6.1, -0.55], standHeight: 0, facing: Math.PI / 2, uniform: STAFF_UNIFORMS.host,\\n      note: 'Per bakom värdpulten, vänd mot dörren. Hovmästare och kvällens anmälda serveringsansvarige.' },\\n    { id: 'dj', role: 'dj', local: [DJ.cx + 0.45, DJ.cz - 0.45], standHeight: DJ.platform, facing: faceNW, uniform: STAFF_UNIFORMS.dj,\\n      note: 'Bakom pulten i SO-hörnet, 0,25 m upp, vänd mot det öppna golvet.' }\\n  ];\\n\\n  const parts: RoomParts = {\\n    turntable: turntable, roof: roof, walls: walls, wallUpper: wallUpper, interior: interior, bar: bar,\\n    wineWall: wineWall, shelfTargets: shelfTargets, djTarget: djTarget, flames: flames,\\n    weekendCandles: weekendCandles, djGlow: M.djGlow,\\n    glassAnchor: glassAnchor, passAnchor: passAnchor, bottleAnchor: bottleAnchor\\n  };\\n\\n  const room: WineBarRoom = {\\n    group: group, parts: parts, seats: seats, standing: standing, staffStations: staffStations,\\n    candles: candles, pendants: pendants, entrance: entrance, waitingSpot: waitingSpot,\\n    queueSpots: queueSpots, miseSpots: miseSpots,\\n    floorY: Y, capacity: TOTAL_SEATS, width: width, depth: depth, fits: fits, shortfall: shortfall,\\n    wineWallLevel: startLevel, mood: opts.mood ?? 'tidig',\\n    dispose: function () {\\n      materials.forEach(function (m) { m.dispose(); });\\n      group.removeFromParent();\\n    }\\n  };\\n  (room as any).bottleSlots = bottleSlots;\\n  setMood(room, room.mood);\\n  return room;\\n}\\n\\n// ---------- Lägen ----------\\n\\nexport function setWineWallLevel(room: WineBarRoom, level: WineWallLevel): void {\\n  room.wineWallLevel = level;\\n  room.parts.wineWall.bas.visible = level === 'bas';\\n  room.parts.wineWall.platina.visible = level === 'platina';\\n  // Flaskfästet följer väggens östra ände.\\n  room.parts.bottleAnchor.position.x = WINE_WALL[level].x1 - 0.1;\\n}\\n\\nexport function setMood(room: WineBarRoom, mood: MoodId): void {\\n  room.mood = mood;\\n  const weekend = mood === 'helg';\\n  room.parts.weekendCandles.forEach(function (c) { c.visible = weekend; });\\n  room.parts.djGlow.emissiveIntensity = weekend ? 1.4 : 0;\\n}\\n\\n/**\\n * Tallriken och lågorna. `phase` 0..1 vrider tallriken (skicka 0 när det\\n * inte spelas); `flicker` är valfri sekundräkning för lågorna. Allokerar inget.\\n */\\nexport function updateWineBarRoom(room: WineBarRoom, phase: number, flicker?: number): void {\\n  room.parts.turntable.rotation.y = (phase ?? 0) * Math.PI * 2;\\n  if (flicker === undefined) return;\\n  const f = room.parts.flames;\\n  for (let i = 0; i < f.length; i++) {\\n    const s = 1 + 0.12 * Math.sin(flicker * 9.1 + i * 1.7) + 0.06 * Math.sin(flicker * 23 + i);\\n    f[i].scale.set(1, s, 1);\\n  }\\n}\\n\\nconst _cam = new THREE.Vector3();\\n\\n/**\\n * Kapar väggarna på kamerasidan. Anropas när kameran vridits. En sida kapas\\n * när kameran står utanför den med mer än 0,5 m marginal — vid rakt\\n * ovanifrån kapas ingen, vid standardvinkeln kapas N och E.\\n */\\nexport function updateCutaway(room: WineBarRoom, camera: THREE.Object3D): WallSide[] {\\n  camera.getWorldPosition(_cam);\\n  room.group.worldToLocal(_cam);\\n  const hx = room.width / 2 + 0.5;\\n  const hz = room.depth / 2 + 0.5;\\n  const cut: Record<WallSide, boolean> = { E: _cam.x > hx, W: _cam.x < -hx, N: _cam.z > hz, S: _cam.z < -hz };\\n  const out: WallSide[] = [];\\n  (['N', 'S', 'E', 'W'] as WallSide[]).forEach(function (s) {\\n    room.parts.wallUpper[s].visible = !cut[s];\\n    if (cut[s]) out.push(s);\\n  });\\n  return out;\\n}\\n\\n// ---------- Gånggrafen ----------\\n\\nconst SPINE_X = 3.6;\\nconst NORTH_Z = 3.1;\\nconst SOUTH_Z = -3.25;\\nconst LOUNGE_INNER_Z = 4.45;\\n\\nexport function walkPathToSeat(room: WineBarRoom, seatId: string): Vec2[] {\\n  const seat = room.seats.find(function (s) { return s.id === seatId; });\\n  if (!seat) return [];\\n  const p: Vec2[] = [[room.entrance[0], room.entrance[1]], [SPINE_X, 0]];\\n  if (seat.kind === 'lounge') {\\n    const cx = LOUNGE_CX[seat.furnitureId === 'loungeATable' ? 0 : 1];\\n    const endX = seat.local[0] <= cx ? cx - 0.85 : cx + 0.85;\\n    p.push([SPINE_X, NORTH_Z], [endX, NORTH_Z], [endX, LOUNGE_INNER_Z], [seat.local[0], LOUNGE_INNER_Z]);\\n  } else if (seat.lane === 'north') {\\n    p.push([SPINE_X, NORTH_Z], [seat.local[0], NORTH_Z]);\\n  } else {\\n    p.push([SPINE_X, SOUTH_Z], [seat.local[0], SOUTH_Z]);\\n  }\\n  p.push([seat.local[0], seat.local[1]]);\\n  return p;\\n}\\n\\nexport function exitPathFromSeat(room: WineBarRoom, seatId: string): Vec2[] {\\n  const back = walkPathToSeat(room, seatId).slice().reverse();\\n  back.push([room.waitingSpot[0], room.waitingSpot[1]]);\\n  return back;\\n}\\n\\n/** Personalens väg kök → bar: köksdörren, sedan barens öppna västra ände. */\\nexport function staffPathKitchenToBar(): Vec2[] {\\n  return [[-5.1, 2.7], [-5.1, 1.2], [-4.2, 0.62], [-3.4, 0.62]];\\n}\\n\\n// ---------- Mätning ----------\\n\\nexport function measureWineBarRoom(room: WineBarRoom) {\\n  room.group.updateWorldMatrix(true, true);\\n  const bb = new THREE.Box3().setFromObject(room.parts.interior);\\n  const wall = new THREE.Box3().setFromObject(room.parts.walls);\\n  const split = { lounge: 0, bar: 0, twotop: 0 };\\n  room.seats.forEach(function (s) { (split as any)[s.kind]++; });\\n  const wwSpec = WINE_WALL[room.wineWallLevel];\\n  let djArea = 0;\\n  room.parts.interior.traverse(function (o) {\\n    if (o.name === 'djPlatform') {\\n      const t = new THREE.Box3().setFromObject(o);\\n      djArea = (t.max.x - t.min.x) * (t.max.z - t.min.z);\\n    }\\n  });\\n  return {\\n    footprint: [bb.max.x - bb.min.x, bb.max.z - bb.min.z] as Vec2,\\n    height: wall.max.y - wall.min.y,\\n    seatCount: room.seats.length,\\n    standingCount: room.standing.length,\\n    split: split,\\n    floorZones: ZONE_FLOORS.length,\\n    wineWall: {\\n      level: room.wineWallLevel,\\n      length: wwSpec.x1 - wwSpec.x0,\\n      height: wwSpec.height,\\n      tiers: wwSpec.tiers,\\n      bottles: (room as any).bottleSlots[room.wineWallLevel]\\n    },\\n    runway: (BAR.z1 - BAR.depth) - RACK_T / 2,\\n    djZoneArea: djArea,\\n    candles: room.candles.length,\\n    candlesLit: room.candles.filter(function (c) { return room.mood === 'helg' || !c.weekendOnly; }).length\\n  };\\n}\\n\\nfunction isShown(o: THREE.Object3D | null): boolean {\\n  while (o) { if (!o.visible) return false; o = o.parent; }\\n  return true;\\n}\\n\\n/**\\n * Siktlinjen: barstolarna till vinväggens hyllplan på sin sida, och alla\\n * platser till DJ:n. Kroppar ska ligga utanför room.group när provet körs.\\n */\\nexport function checkSightLines(room: WineBarRoom) {\\n  room.group.updateWorldMatrix(true, true);\\n  const ray = new THREE.Raycaster();\\n  const origin = new THREE.Vector3();\\n  const target = new THREE.Vector3();\\n  const dir = new THREE.Vector3();\\n  const tiers = room.parts.shelfTargets[room.wineWallLevel];\\n  function clear(node: THREE.Object3D, from: THREE.Vector3, allow: string[]): boolean {\\n    node.getWorldPosition(target);\\n    dir.copy(target).sub(from);\\n    const dist = dir.length();\\n    ray.set(from, dir.normalize());\\n    ray.far = dist - 0.12;\\n    const hits = ray.intersectObject(room.group, true);\\n    for (let h = 0; h < hits.length; h++) {\\n      const o = hits[h].object;\\n      if (!isShown(o) || o.name.indexOf('floor') === 0) continue;\\n      if (allow.some(function (a) { return o.name.indexOf(a) === 0; })) continue;\\n      return false;\\n    }\\n    return true;\\n  }\\n  const perSeat: { seatId: string; tiers: number; of: number; dj: boolean }[] = [];\\n  let barAll = 0;\\n  let seeDj = 0;\\n  let seeWall = 0;\\n  room.seats.forEach(function (s) {\\n    origin.set(s.local[0], eyeHeightForSeat(s), s.local[1]);\\n    room.group.localToWorld(origin);\\n    const side = s.local[1] > 0 ? 'N' : 'S';\\n    const mine = tiers.filter(function (t) { return t.name.slice(-1) === side; });\\n    let vis = 0;\\n    mine.forEach(function (t) { if (clear(t, origin, ['bottles_', 'shelfTier_', 'wineWall'])) vis++; });\\n    const d = clear(room.parts.djTarget, origin, ['candle']);\\n    if (s.kind === 'bar' && vis === mine.length) barAll++;\\n    if (vis > 0) seeWall++;\\n    if (d) seeDj++;\\n    perSeat.push({ seatId: s.id, tiers: vis, of: mine.length, dj: d });\\n  });\\n  return { perSeat: perSeat, barSeatsSeeingAllTiers: barAll, seatsSeeingWineWall: seeWall, seatsSeeingDj: seeDj };\\n}\\n\\n/**\\n * Specens kontroll före leverans, som kod: från den kamera som skickas, syns\\n * varje plats och varje station? Mäter mot huvudhöjd (sittande: sitsen +\\n * 0,95 m, stående: 1,55 m) — det är kalotten kameran läser. `extra` är\\n * hinder utanför rummet, t.ex. grannhusen. Kör updateCutaway först.\\n */\\nexport function checkCameraView(room: WineBarRoom, camera: THREE.Object3D, extra?: THREE.Object3D[]) {\\n  room.group.updateWorldMatrix(true, true);\\n  const ray = new THREE.Raycaster();\\n  const from = new THREE.Vector3();\\n  const to = new THREE.Vector3();\\n  const dir = new THREE.Vector3();\\n  camera.getWorldPosition(from);\\n  const targets = [room.group as THREE.Object3D].concat(extra ?? []);\\n  function test(local: Vec3): string | null {\\n    to.set(local[0], local[1], local[2]);\\n    room.group.localToWorld(to);\\n    dir.copy(to).sub(from);\\n    const dist = dir.length();\\n    ray.set(from, dir.normalize());\\n    ray.far = dist - 0.25;\\n    const hits = ray.intersectObjects(targets, true);\\n    for (let h = 0; h < hits.length; h++) {\\n      const o = hits[h].object;\\n      if (!isShown(o)) continue;\\n      if (/^(floor|candle|pendantCord)/.test(o.name)) continue;\\n      return o.name || 'namnlös';\\n    }\\n    return null;\\n  }\\n  const blocked: { id: string; by: string }[] = [];\\n  let seatsSeen = 0;\\n  room.seats.forEach(function (s) {\\n    const by = test([s.local[0], s.seatSurfaceY + 0.95, s.local[1]]);\\n    if (by) blocked.push({ id: s.id, by: by }); else seatsSeen++;\\n  });\\n  let stationsSeen = 0;\\n  room.staffStations.forEach(function (s) {\\n    const by = test([s.local[0], PLINTH_M + s.standHeight + 1.55, s.local[1]]);\\n    if (by) blocked.push({ id: s.id, by: by }); else stationsSeen++;\\n  });\\n  const e = test([room.entrance[0], PLINTH_M + 1.55, room.entrance[1]]);\\n  if (e) blocked.push({ id: 'entrance', by: e });\\n  return { seatsSeen: seatsSeen, seats: room.seats.length, stationsSeen: stationsSeen,\\n           stations: room.staffStations.length, entranceSeen: !e, blocked: blocked };\\n}\\n\\n/**\\n * Planritningens underlag: varje namngiven möbel och zon som rektangel i\\n * lokal XZ, läst ur samma meshar som renderas. Rektanglar är AABB — DJ-pulten\\n * står 45° vriden och ritas därför större än den är.\\n */\\nexport function planRects(room: WineBarRoom): { name: string; x0: number; x1: number; z0: number; z1: number; top: number }[] {\\n  room.group.updateWorldMatrix(true, true);\\n  const inv = new THREE.Matrix4().copy(room.group.matrixWorld).invert();\\n  const out: { name: string; x0: number; x1: number; z0: number; z1: number; top: number }[] = [];\\n  const b = new THREE.Box3();\\n  room.parts.interior.traverse(function (o: any) {\\n    if (!o.isMesh || o.isInstancedMesh || !isShown(o)) return;\\n    if (/^(candle|pendant|platter|bottle)/.test(o.name)) return;\\n    b.setFromObject(o).applyMatrix4(inv);\\n    out.push({ name: o.name, x0: b.min.x, x1: b.max.x, z0: b.min.z, z1: b.max.z, top: b.max.y });\\n  });\\n  return out;\\n}\\n\\nexport function resolveWorldPositions(room: WineBarRoom) {\\n  room.group.updateWorldMatrix(true, true);\\n  const v = new THREE.Vector3();\\n  function w(p: Vec2): Vec2 { v.set(p[0], 0, p[1]); room.group.localToWorld(v); return [v.x, v.z]; }\\n  return {\\n    seats: room.seats.map(function (s) { return w(s.local); }),\\n    standing: room.standing.map(function (s) { return w(s.local); }),\\n    staffStations: room.staffStations.map(function (s) { return w(s.local); }),\\n    entrance: w(room.entrance),\\n    waitingSpot: w(room.waitingSpot),\\n    queueSpots: room.queueSpots.map(function (s) { return w(s.local); }),\\n    miseSpots: room.miseSpots.map(function (s) { return w(s.local); })\\n  };\\n}\\n\",\"guestMood.ts\":\"// guestMood.ts — gästernas stämning. Leverans 2026-10-03 (D1), tillägg till vardagens koreografi.\\n// Fem lägen, symbolerna över borden, ansiktena i närbild, mätaren i HUD:en och konsekvensögonblicket\\n// efter ett raketsvar. Den varma formen (nexusTheme.warm.ts) och regeln från 2026-09-30 gäller:\\n// rött och grönt är bara rätt och fel svar, så ingen stämning är röd eller grön.\\n// Inga speltal: gränser, vikter och förändringar ligger i balance.ts (MOOD_BALANCE nedan är nycklarna).\\n\\nexport type MoodId = 'delighted' | 'content' | 'waiting' | 'impatient' | 'displeased';\\n\\n/** Bäst först. Indexet är också mätarens steg (0 = glad). */\\nexport const MOODS: MoodId[] = ['delighted', 'content', 'waiting', 'impatient', 'displeased'];\\n\\n/** Nycklarna i balance.ts. Code sätter värdena; null tills dess. */\\nexport const MOOD_BALANCE = {\\n  /** Gästens stämning 0..1 → läge. Under gränsen gäller nästa läge. */\\n  threshold: { delighted: null as number | null, content: null as number | null, waiting: null as number | null, impatient: null as number | null },\\n  /** Hur mycket ett raketsvar flyttar de gäster som såg det: {gain} vid rätt, {loss} vid fel. */\\n  rocket: { gain: null as number | null, loss: null as number | null, witnessRadiusM: null as number | null },\\n  /** Väntan utan att någon kommer: stämningen sjunker {decay} per spelminut. */\\n  decayPerGameMinute: null as number | null,\\n  /** Rummets mätare är medelvärdet av gästernas stämning, vägt per sällskap. */\\n  roomWeighting: 'perParty' as 'perParty' | 'perGuest'\\n};\\n\\n// ---------- symbolerna ----------------------------------------------------\\n// En rund bricka med en ritad figur, 24 px på skärmen oavsett kamerans avstånd. Två grupper:\\n// ljus bricka med mörk figur (allt är bra eller på väg) och mörk bricka med ljus figur och\\n// mässingskant (det behövs något). Figuren skiljer lägena åt, inte färgen: solgnistor, hjärta,\\n// timglas, väckarklocka och moln. Mätt i full storlek i båda ljusen (kontrollbilderna symboler-*).\\n\\nexport interface GlyphPart { d: string; mode: 'fill' | 'stroke'; w?: number; evenodd?: boolean }\\nexport interface MoodSymbolSpec { plate: string; rim: string; glyph: string; halo: string; parts: GlyphPart[]; group: 'light' | 'dark' }\\n\\nexport const MOOD_SYMBOL = {\\n  sizePx: 24,\\n  /** Ritat på ett rutnät 24 × 24. Brickan har radien 10,5 och kanten 2 px. */\\n  grid: 24, plateR: 10.5, rimW: 2,\\n  /** Över bordets mitt (småbord), över dynornas mitt i loungen (huvudena skymmer annars bordet), eller över\\n   *  huvudet på en ensam gäst (bar, kö). Meter över golvet; guestHeadM räknas från hjässan. */\\n  anchor: { tableM: 1.6, loungeM: 1.75, guestHeadM: 0.42 },\\n  /** Mellan två symboler som skulle överlappa på skärmen: minst 4 px, den senast ändrade överst. */\\n  minGapPx: 4,\\n  /** Visas: alltid för väntar, otålig och missnöjd. Glad och nöjd i {showPositiveS} s efter att läget ändrats. */\\n  show: { always: ['waiting', 'impatient', 'displeased'] as MoodId[], showPositiveS: 4, fadeS: 0.4 },\\n  /** Rörelserna följer svarsraderna (WARM_RIGHT_WRONG.motion): bättre lyfter, sämre skakar. Aldrig puls. */\\n  motion: {\\n    better: { from: 0, scale: [0.6, 1.08, 1], scaleMs: [0, 220, 360], lift: { px: -6, to: 520, curve: 'sin' } },\\n    worse: { from: 0, scale: [0.6, 1], scaleMs: [0, 200], shake: { px: 4, cycles: 3, from: 120, to: 480, damped: true } },\\n    reducedMotion: 'tonas in på 160 ms, ingen lyftning eller skakning'\\n  },\\n  moods: {\\n    delighted: {\\n      group: 'light', plate: '#e8b93a', rim: '#2a1c13', glyph: '#2a1c13', halo: 'rgba(255,213,143,.55)',\\n      parts: [\\n        { mode: 'fill', d: 'M10.5 5.6 Q11.3 11.2 16.9 12.2 Q11.3 13.2 10.5 18.8 Q9.7 13.2 4.1 12.2 Q9.7 11.2 10.5 5.6 Z' },\\n        { mode: 'fill', d: 'M16.6 4.4 Q17 6.5 19 6.9 Q17 7.3 16.6 9.4 Q16.2 7.3 14.2 6.9 Q16.2 6.5 16.6 4.4 Z' }\\n      ]\\n    },\\n    content: {\\n      group: 'light', plate: '#f5ead5', rim: '#2a1c13', glyph: '#2a1c13', halo: 'rgba(255,213,143,.55)',\\n      parts: [{ mode: 'fill', d: 'M12 18.2 C6.8 14.6 5.6 11.8 5.6 9.9 C5.6 7.8 7.1 6.4 9 6.4 C10.4 6.4 11.4 7.2 12 8.3 C12.6 7.2 13.6 6.4 15 6.4 C16.9 6.4 18.4 7.8 18.4 9.9 C18.4 11.8 17.2 14.6 12 18.2 Z' }]\\n    },\\n    waiting: {\\n      group: 'light', plate: '#e9d9bc', rim: '#2a1c13', glyph: '#2a1c13', halo: 'rgba(255,213,143,.55)',\\n      parts: [\\n        { mode: 'fill', evenodd: true, d: 'M7.2 5.4 H16.8 V7 H15.9 C15.9 9.6 14.1 10.9 12.9 12 C14.1 13.1 15.9 14.4 15.9 17 H16.8 V18.6 H7.2 V17 H8.1 C8.1 14.4 9.9 13.1 11.1 12 C9.9 10.9 8.1 9.6 8.1 7 H7.2 Z M12 13.3 C13.1 14.1 14.3 15.1 14.3 17 H9.7 C9.7 15.1 10.9 14.1 12 13.3 Z' },\\n        { mode: 'fill', d: 'M10.2 17 Q12 15.5 13.8 17 Z' }\\n      ]\\n    },\\n    impatient: {\\n      group: 'dark', plate: '#3a281c', rim: '#f0cd82', glyph: '#ffd58f', halo: 'rgba(20,13,9,.55)',\\n      parts: [\\n        { mode: 'stroke', w: 2, d: 'M12 7.9 A5.3 5.3 0 1 1 11.99 7.9 Z' },\\n        { mode: 'stroke', w: 1.9, d: 'M12 10.3 V13.3 L14.1 14.5' },\\n        { mode: 'stroke', w: 1.9, d: 'M5.6 8.3 A3.1 3.1 0 0 1 8.4 5.5 M15.6 5.5 A3.1 3.1 0 0 1 18.4 8.3' }\\n      ]\\n    },\\n    displeased: {\\n      group: 'dark', plate: '#1a120d', rim: '#f0cd82', glyph: '#f4e6cc', halo: 'rgba(20,13,9,.55)',\\n      parts: [\\n        { mode: 'fill', d: 'M8.2 15.6 C6.2 15.6 5 14.2 5 12.6 C5 11 6.2 9.8 7.8 9.7 C8.3 7.6 10 6.3 12 6.3 C14.4 6.3 16.2 8 16.5 10.2 C18 10.3 19.1 11.5 19.1 12.9 C19.1 14.4 17.9 15.6 16.4 15.6 Z' },\\n        { mode: 'stroke', w: 1.7, d: 'M9.6 17.4 L8.9 19 M12.6 17.4 L11.9 19 M15.6 17.4 L14.9 19' }\\n      ]\\n    }\\n  } as Record<MoodId, MoodSymbolSpec>\\n};\\n\\n/** SVG för en symbol (HUD, dokumentation). Samma figurer som duken ritar i teatern. */\\nexport function moodSymbolSvg(id: MoodId, px?: number): string {\\n  const s = MOOD_SYMBOL.moods[id], n = px ?? MOOD_SYMBOL.sizePx;\\n  const parts = s.parts.map((p) => p.mode === 'fill'\\n    ? `<path d=\\\"${p.d}\\\" fill=\\\"${s.glyph}\\\"${p.evenodd ? ' fill-rule=\\\"evenodd\\\"' : ''}/>`\\n    : `<path d=\\\"${p.d}\\\" fill=\\\"none\\\" stroke=\\\"${s.glyph}\\\" stroke-width=\\\"${p.w ?? 2}\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>`).join('');\\n  return `<svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"${n}\\\" height=\\\"${n}\\\" viewBox=\\\"0 0 24 24\\\"><circle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"11.6\\\" fill=\\\"${s.halo}\\\"/><circle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"${MOOD_SYMBOL.plateR}\\\" fill=\\\"${s.plate}\\\" stroke=\\\"${s.rim}\\\" stroke-width=\\\"${MOOD_SYMBOL.rimW}\\\"/>${parts}<\\/svg>`;\\n}\\n\\n/** Ritar symbolen på en 2D-duk med mitten i (x, y). Path2D läser samma sökvägar som SVG:n. */\\nexport function drawMoodSymbol(ctx: CanvasRenderingContext2D, id: MoodId, x: number, y: number, px?: number, alpha?: number): void {\\n  const s = MOOD_SYMBOL.moods[id], k = (px ?? MOOD_SYMBOL.sizePx) / 24;\\n  ctx.save(); ctx.globalAlpha = alpha ?? 1; ctx.translate(x - 12 * k, y - 12 * k); ctx.scale(k, k);\\n  ctx.fillStyle = s.halo; ctx.beginPath(); ctx.arc(12, 12, 11.6, 0, Math.PI * 2); ctx.fill();\\n  ctx.fillStyle = s.plate; ctx.strokeStyle = s.rim; ctx.lineWidth = MOOD_SYMBOL.rimW;\\n  ctx.beginPath(); ctx.arc(12, 12, MOOD_SYMBOL.plateR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\\n  s.parts.forEach((p) => {\\n    const path = new Path2D(p.d);\\n    if (p.mode === 'fill') { ctx.fillStyle = s.glyph; ctx.fill(path, p.evenodd ? 'evenodd' : 'nonzero'); }\\n    else { ctx.strokeStyle = s.glyph; ctx.lineWidth = p.w ?? 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(path); }\\n  });\\n  ctx.restore();\\n}\\n\\n// ---------- ansiktena -----------------------------------------------------\\n// Fem uttryck med ögon, bryn och mun på huvudets framsida (figureFace.ts). De tänds först när kameran\\n// är nära: från 9 m mellan kameran och huvudet tonas de in, och vid 7 m är de fullt synliga.\\n// Vid 7 m är huvudet 32 px högt i 1280 × 720 och 40 px i 1440 × 900. Raketens 10–14 m och spelets\\n// 24 m visar aldrig ansikten; där bär gesterna och symbolerna stämningen.\\nexport const FACE = {\\n  fadeStartM: 9, fullM: 7,\\n  /** Personalen har alltid 'content'. Uttrycken är gästernas. */\\n  staffMood: 'content' as MoodId,\\n  /** Ett nytt uttryck byts in på 120 ms, samtidigt som gesten börjar. */\\n  swapMs: 120,\\n  ink: '#2a1c13'\\n};\\n\\nexport function faceOpacity(cameraToHeadM: number): number {\\n  const k = (FACE.fadeStartM - cameraToHeadM) / (FACE.fadeStartM - FACE.fullM);\\n  return Math.max(0, Math.min(1, k));\\n}\\n\\n// ---------- mätaren -------------------------------------------------------\\n// ”Stämningen i rummet”, i HUD:ens översta rad till höger om kassan. Ett spår i fem steg med en\\n// fyllning i guld och den aktuella symbolen. Det som förloras står kvar streckat (som fel i den\\n// varma formen) i {lossHoldMs} och tonas sedan ut. Inga siffror.\\nexport const MOOD_METER = {\\n  widthCqw: 17, minWidthPx: 230,\\n  steps: 5,\\n  fill: 'linear-gradient(90deg, #d9b476, #ffd58f)',\\n  track: 'rgba(245,234,213,.1)',\\n  lost: '2px dashed rgba(244,230,204,.75)',\\n  lossHoldMs: 1600,\\n  gainGlow: '0 0 12px rgba(232,185,58,.6)',\\n  moveMs: 900, ease: 'cubic-bezier(.4,0,.2,1)',\\n  /** Mätaren ändras bara av det som händer i rummet, och alltid efter symbolerna över borden. */\\n  delayAfterSymbolMs: 150\\n};\\n\\n// ---------- konsekvensögonblicket -----------------------------------------\\n// De 3,8 sekunderna efter ett raketsvar. Tider i sekunder från att svaret låses (WARM_RIGHT_WRONG.motion\\n// räknar från samma ögonblick). Kortet står kvar till vänster med förklaringen, så bordet ramas i de\\n// högra två tredjedelarna (frameX). Rätt och fel har olika kamerarörelser, som svarsraderna.\\nexport const CONSEQUENCE = {\\n  durationS: 3.8,\\n  /** Kortet tar 3,5–32,5 % av bredden. Det som reagerar ramas mellan 36 och 96 %: mitten av gruppen hamnar på\\n   *  frameX (62 % för ett bord, upp till 72 % för två grannbord som i födelsedagen). */\\n  frameX: { oneTable: 0.62, twoTables: 0.72, cardRight: 0.325, safeLeft: 0.36, safeRight: 0.96 },\\n  camera: {\\n    holdUntil: 0.45,            // kortets färg och lyftning/skakning, kameran står kvar på raketens 10–14 m\\n    inFrom: 0.45, inTo: 1.45,   // glider in mot bordet\\n    nearM: 7,                   // ansiktena är fullt synliga\\n    // Kameran sänks när den går in, så att ansiktena syns under hjässan: 35° vid rätt, 40° vid fel (spelets är 50°).\\n    right: { arcYawRad: 0.21, pitchRad: 0.62, ease: 'easeOutCubic' },              // en mjuk båge in, som lyftningen på kortet\\n    wrong: { arcYawRad: 0, pitchRad: 0.7, delayS: 0.15, ease: 'easeInOutSine' },  // rakt in, ingen båge\\n    // Beslut 2026-10-03: huvudena förstoras inte. De sista 1,5 s går kameran långsamt in till 5,5 m, där huvudet är\\n    // 41 px högt i 1280 × 720 och 51 px i 1440 × 900. Efter ögonblicket går den tillbaka till 24 m på 1 s.\\n    closeFrom: 2.3, closeTo: 3.8, closeM: 5.5, closeEase: 'easeInOutSine',\\n    backFrom: 3.8, backTo: 4.8, backM: 24                                 // tillbaka till spelets kamera, efter ögonblicket\\n  },\\n  guests: { firstGestureAt: 0.6, staggerS: 0.18, faceSwapAt: 0.6 },\\n  symbol: { at: 1.1 },\\n  meter: { at: 1.25 },\\n  /** Strålkastaren (teaterScen.spot) ligger kvar på bordet tills kameran vänder. */\\n  spot: { until: 3.8, fadeS: 0.5 }\\n};\\n\",\"figureFace.ts\":\"// figureFace.ts — ansiktena i närbild. Leverans 2026-10-03 (D1).\\n// Ett tunt skal framför huvudsfären (figureRig: head:sphere, radie 0,12) med fem uttryck: ögon, bryn och mun\\n// i bläck på huden. Skalet sitter under kalotten och följer huvudets led, så blicken går dit huvudet vrids.\\n// Riggen ändras inte. Skalet tonas efter kamerans avstånd (guestMood.FACE): osynligt från 9 m och längre bort,\\n// fullt vid 7 m. Ett skal per figur, men geometrin och de fem texturerna delas.\\n\\nimport * as THREE from 'three';\\nimport { FIGURE } from './figureRig';\\nimport { FACE, faceOpacity } from './guestMood';\\nimport type { MoodId } from './guestMood';\\n\\n/** Skalets utsnitt av sfären. Under kalotten (som slutar 1,15 rad från hjässan) och 86° brett. */\\nconst PATCH = { phiLen: 1.5, thetaStart: 1.15, thetaLen: 1.2, lift: 1.012 };\\nconst W = 160, H = 128;   // 106,7 px per radian åt båda hållen\\n\\nlet geo: THREE.SphereGeometry | null = null;\\nconst tex = new Map<MoodId, THREE.CanvasTexture>();\\n\\nfunction draw(id: MoodId): HTMLCanvasElement {\\n  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;\\n  const x = cv.getContext('2d')!;\\n  x.fillStyle = FACE.ink; x.strokeStyle = FACE.ink; x.lineCap = 'round'; x.lineJoin = 'round';\\n  const dot = (cx: number, cy: number, r: number) => { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };\\n  const line = (a: number, b: number, c: number, d: number, w: number) => { x.lineWidth = w; x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); };\\n  const arc = (cx: number, cy: number, r: number, a0: number, a1: number, w: number) => { x.lineWidth = w; x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };\\n  const L = 46, R = 114;\\n  if (id === 'delighted') {\\n    // Glada ögon som hopknipna bågar och en öppen mun.\\n    arc(L, 38, 11, Math.PI * 1.05, Math.PI * 1.95, 10); arc(R, 38, 11, Math.PI * 1.05, Math.PI * 1.95, 9);\\n    x.beginPath(); x.moveTo(54, 74); x.quadraticCurveTo(80, 112, 106, 74); x.closePath(); x.fill();\\n  } else if (id === 'content') {\\n    dot(L, 32, 10); dot(R, 32, 10);\\n    arc(80, 58, 28, Math.PI * 0.22, Math.PI * 0.78, 9);\\n  } else if (id === 'waiting') {\\n    // Blicken åt sidan, mot dörren eller personalen, och munnen rak.\\n    dot(L + 8, 32, 10); dot(R + 8, 32, 10);\\n    line(66, 86, 96, 86, 9);\\n  } else if (id === 'impatient') {\\n    dot(L, 34, 9.5); dot(R, 34, 9.5);\\n    line(32, 19, 60, 21, 9); line(100, 21, 128, 19, 9);\\n    line(64, 88, 96, 82, 9);\\n  } else {\\n    // Missnöjd: bryn som sluttar inåt och en mun som går nedåt.\\n    dot(L, 35, 9.5); dot(R, 35, 9.5);\\n    line(30, 15, 60, 24, 9); line(100, 24, 130, 15, 9);\\n    arc(80, 112, 26, Math.PI * 1.25, Math.PI * 1.75, 9);\\n  }\\n  return cv;\\n}\\n\\nfunction texture(id: MoodId): THREE.CanvasTexture {\\n  let t = tex.get(id);\\n  if (!t) {\\n    t = new THREE.CanvasTexture(draw(id));\\n    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;\\n    // SphereGeometry lägger u = 0 på figurens vänstra sida; speglas så att bilden ses rättvänd framifrån.\\n    t.wrapS = THREE.RepeatWrapping; t.repeat.set(-1, 1); t.offset.set(1, 0);\\n    tex.set(id, t);\\n  }\\n  return t;\\n}\\n\\nexport interface FaceHandle { mesh: THREE.Mesh; mood: MoodId; set: (m: MoodId) => void; update: (camera: THREE.Camera) => number; dispose: () => void }\\n\\n/** Sätter ett ansikte på riggens huvud. Anropa update(camera) varje bildruta efter applyPose. */\\nexport function attachFace(rig: { joints: { head: THREE.Object3D } }, mood?: MoodId): FaceHandle {\\n  const r = FIGURE.headRadius;\\n  if (!geo) geo = new THREE.SphereGeometry(r * PATCH.lift, 16, 12, Math.PI / 2 - PATCH.phiLen / 2, PATCH.phiLen, PATCH.thetaStart, PATCH.thetaLen);\\n  const mat = new THREE.MeshStandardMaterial({ map: texture(mood ?? 'content'), transparent: true, opacity: 0, depthWrite: false, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -2 });\\n  const mesh = new THREE.Mesh(geo, mat);\\n  mesh.name = 'face'; mesh.position.y = r; mesh.renderOrder = 2; mesh.visible = false;\\n  rig.joints.head.add(mesh);\\n  const V = new THREE.Vector3(), C = new THREE.Vector3();\\n  const h: FaceHandle = {\\n    mesh, mood: mood ?? 'content',\\n    set(m) { if (m === h.mood) return; h.mood = m; mat.map = texture(m); mat.needsUpdate = true; },\\n    update(camera) {\\n      mesh.getWorldPosition(V); camera.getWorldPosition(C);\\n      const k = faceOpacity(V.distanceTo(C));\\n      mat.opacity = k; mesh.visible = k > 0.01;\\n      return k;\\n    },\\n    dispose() { mesh.removeFromParent(); mat.dispose(); }\\n  };\\n  return h;\\n}\\n\\n/** Bilden för ett uttryck, för dokumentationen. */\\nexport function faceCanvas(id: MoodId): HTMLCanvasElement { return draw(id); }\\n\",\"teaterScen.js\":\"// teaterScen — scenen för \\\"Teaterns grund\\\": rummet, figurerna, rekvisitan och en regissör som\\n// spelar manus (teaterManus.js) bildruta för bildruta. Allt är en ren funktion av tiden t, så\\n// spolning, kontrollbilder och videon ger samma bild för samma t.\\n// Modulerna (figureRig, figureClips, tableware) skickas in: de laddas som .ts av tsModule.js.\\nimport * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';\\nexport { THREE };\\n\\nexport const GAME_CAMERA = { fov: 42, pitch: 0.873, dist: 24 };\\nexport const GRADE = { filter: 'saturate(1.1) brightness(.92)', vignette: [[0, 'rgba(255,170,80,.12)'], [0.85, 'rgba(20,10,5,.72)']] };\\n\\nexport const LOOKS = {\\n  kock: { body: '#efe9dd', limb: '#3a3632', hat: 'toque' },\\n  servitor: { body: '#1f1a17', limb: '#1b1816', apron: '#efe4d0' },\\n  servitor2: { body: '#2a211c', limb: '#1b1816', apron: '#e6d8bf' },\\n  sommelier: { body: '#5b2226', limb: '#2a1c18', chain: true },\\n  bartender: { body: '#3b2a1f', limb: '#241a14', apron: '#9a6238' },\\n  diskare: { body: '#56646a', limb: '#2f383c', apron: '#cfd6d4' },\\n  student: { body: '#3f7390', limb: '#2f3a48' },\\n  medel: { body: '#8a7457', limb: '#4a4034' },\\n  medel2: { body: '#6f5a74', limb: '#3c3342' },\\n  medel3: { body: '#5f7a6a', limb: '#34443a' },\\n  hog: { body: '#1b1a20', limb: '#141318', scarf: '#c49a5a' },\\n  social: { body: '#b5485f', limb: '#6a2a38', shawl: '#f3c0ad' },\\n  hovmastare: { body: '#2e2a2b', limb: '#1b1816', chain: true },\\n  dj: { body: '#664958', limb: '#2a1f26' },\\n  // Vardagens koreografi: fler gäster i kön och sällskapen, inom samma kontrastband.\\n  kappa: { body: '#9b7b55', limb: '#4a3c2c', scarf: '#d8c3a0' },\\n  rock: { body: '#3d4a5c', limb: '#262d38' },\\n  jacka: { body: '#7a3b2e', limb: '#3e2420' },\\n  stickat: { body: '#6b7a4e', limb: '#3a4230' }\\n};\\n\\n// Beslut 2026-09-30: tallrikar, glas och bestick är 1,5 gånger verklig storlek i spelet (staffRing.ts, PROP_VISUAL_SCALE).\\nconst VIS_SCALE = ['plate', 'sidePlate', 'soupBowl', 'wineGlass', 'waterGlass', 'wineBottle', 'waterBottle', 'carafe', 'fork', 'knife', 'spoon', 'napkin', 'breadBasket', 'decanter', 'flute'];\\nconst G = new Map();\\nfunction geo(k, f) { let g = G.get(k); if (!g) { g = f(); G.set(k, g); } return g; }\\nconst MC = new Map();\\nfunction mat(c, r = 0.8, m = 0, e) { const k = c + r + m + (e || ''); let x = MC.get(k); if (!x) { x = new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m }); if (e) { x.emissive = new THREE.Color(e); x.emissiveIntensity = 1.6; } MC.set(k, x); } return x; }\\nfunction mesh(g, m, x = 0, y = 0, z = 0, cast = true) { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true; return o; }\\nconst box = (w, h, d) => geo(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));\\nconst cyl = (a, b, h, s = 16) => geo(`c${a},${b},${h},${s}`, () => new THREE.CylinderGeometry(a, b, h, s));\\nconst sph = (r, s = 12) => geo(`s${r},${s}`, () => new THREE.SphereGeometry(r, s, Math.max(6, s - 4)));\\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\\nconst smooth = (u) => { const k = clamp(u, 0, 1); return k * k * (3 - 2 * k); };\\nconst wrap = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };\\nconst lerpAngle = (a, b, k) => a + wrap(b - a) * k;\\n\\nlet GLOW = null;\\nfunction glowSprite(scale, color, opacity = 1) {\\n  if (!GLOW) {\\n    const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');\\n    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,220,160,1)'); g.addColorStop(0.25, 'rgba(255,180,90,.5)'); g.addColorStop(1, 'rgba(255,150,60,0)');\\n    x.fillStyle = g; x.fillRect(0, 0, 128, 128); GLOW = new THREE.CanvasTexture(c);\\n  }\\n  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity, depthWrite: false, blending: THREE.AdditiveBlending }));\\n  s.scale.set(scale, scale, 1); return s;\\n}\\nfunction canvasTex(w, h, draw, rep) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } t.anisotropy = 4; return t; }\\n\\n// ---------- möblerna ---------------------------------------------------\\nconst WOOD = '#4a3122', LINEN = '#c4b394', CHAIR = '#2e2016', BRASS = '#b88a3e', STEEL = '#b8b2a8';\\n\\nfunction tablePiece(root, x, z, w, d, o = {}) {\\n  const g = new THREE.Group(); g.position.set(x, 0, z); root.add(g);\\n  g.add(mesh(box(w, 0.04, d), mat(WOOD, 0.6), 0, 0.73, 0));\\n  g.add(mesh(box(w * 0.72, 0.004, d * 0.72), mat(LINEN, 0.95), 0, 0.752, 0, false));\\n  g.add(mesh(cyl(0.05, 0.07, 0.71, 10), mat('#241810', 0.6), 0, 0.355, 0));\\n  g.add(mesh(cyl(0.26, 0.28, 0.03, 16), mat('#241810', 0.6), 0, 0.015, 0));\\n  if (o.candle !== false) {\\n    g.add(mesh(cyl(0.03, 0.03, 0.02, 10), mat('#c9942a', 0.4, 0.6), 0, 0.76, 0));\\n    g.add(mesh(cyl(0.014, 0.014, 0.07, 8), mat('#f7efd9', 0.6), 0, 0.805, 0));\\n    g.add(mesh(sph(0.012, 6), mat('#ffcc66', 1, 0, '#ffb040'), 0, 0.85, 0, false));\\n    const s = glowSprite(0.5, '#ffc070', 0.45); s.position.set(0, 0.87, 0); g.add(s);\\n    if (o.light) { const L = new THREE.PointLight('#ffb060', 0.8, 2.6, 1.8); L.position.set(0, 1.15, 0); g.add(L); }\\n  }\\n  return g;\\n}\\nfunction chairPiece(root) {\\n  const g = new THREE.Group(); root.add(g); const m = mat(CHAIR, 0.7);\\n  g.add(mesh(box(0.42, 0.04, 0.42), m, 0, 0.43, 0));\\n  g.add(mesh(box(0.42, 0.46, 0.035), m, 0, 0.68, -0.2));\\n  [[-0.18, -0.18], [0.18, -0.18], [-0.18, 0.18], [0.18, 0.18]].forEach(([a, b]) => g.add(mesh(box(0.03, 0.43, 0.03), m, a, 0.215, b)));\\n  return g;\\n}\\nfunction stoolPiece(root, s) {\\n  const g = new THREE.Group(); g.position.set(s.x, 0, s.z); root.add(g); const m = mat(CHAIR, 0.6), b = mat(BRASS, 0.4, 0.6);\\n  g.add(mesh(cyl(0.19, 0.19, 0.05, 16), m, 0, 0.725, 0)); g.add(mesh(cyl(0.045, 0.045, 0.7, 8), m, 0, 0.35, 0));\\n  g.add(mesh(cyl(0.17, 0.17, 0.03, 16), b, 0, 0.015, 0));\\n  const ring = mesh(geo('footring', () => new THREE.TorusGeometry(0.2, 0.012, 6, 24)), b, 0, 0.29, 0); ring.rotation.x = Math.PI / 2; g.add(ring);\\n  return g;\\n}\\nfunction loungePiece(root, s) {\\n  // En dyna 0,72 × 0,72, överkant 0,38, sockel och ryggstöd bakom (sitsens −z).\\n  const g = new THREE.Group(); g.position.set(s.x, 0, s.z); g.rotation.y = s.yaw; root.add(g); const m = mat('#7d6f63', 0.95), p = mat('#4a3a2e', 0.8);\\n  g.add(mesh(box(0.8, 0.22, 0.8), p, 0, 0.11, -0.02)); g.add(mesh(box(0.72, 0.16, 0.72), m, 0, 0.3, 0));\\n  g.add(mesh(box(0.8, 0.95, 0.18), m, 0, 0.475, -0.45));\\n  return g;\\n}\\nfunction counterPiece(root, x, z, w, d, h, o = {}) {\\n  const g = new THREE.Group(); g.position.set(x, 0, z); if (o.yaw) g.rotation.y = o.yaw; root.add(g);\\n  g.add(mesh(box(w, h - 0.04, d), mat(o.body || '#3a281c', 0.7, o.metal || 0), 0, (h - 0.04) / 2, 0));\\n  g.add(mesh(box(w + 0.04, 0.04, d + 0.04), mat(o.top || BRASS, o.topRough ?? 0.4, o.topMetal ?? 0.5), 0, h - 0.02, 0));\\n  return g;\\n}\\n\\n// ---------- rummet ----------------------------------------------------\\n// Ett hörn av restaurangen: matsal med fem bord, bar, passet, kockens station och disken.\\n// Mått i meter. x österut, z söderut (mot kameran). Kamerasidans väggar (S, Ö) är kapade.\\nexport const ROOM = {\\n  seats: {\\n    T4W: { x: 0.28, z: 1.3, yaw: Math.PI / 2, seatHeight: 0.45 }, T4E: { x: 1.72, z: 1.3, yaw: -Math.PI / 2, seatHeight: 0.45 },\\n    T2N: { x: -1.7, z: 1.03, yaw: 0, seatHeight: 0.45 }, T2S: { x: -1.7, z: 2.57, yaw: Math.PI, seatHeight: 0.45 },\\n    T2W: { x: -2.47, z: 1.8, yaw: Math.PI / 2, seatHeight: 0.45 }, T2E: { x: -0.93, z: 1.8, yaw: -Math.PI / 2, seatHeight: 0.45 },\\n    T3W: { x: -2.32, z: -0.8, yaw: Math.PI / 2, seatHeight: 0.45 }, T3E: { x: -0.88, z: -0.8, yaw: -Math.PI / 2, seatHeight: 0.45 },\\n    T5W: { x: 3.48, z: 1.3, yaw: Math.PI / 2, seatHeight: 0.45 }, T5E: { x: 4.92, z: 1.3, yaw: -Math.PI / 2, seatHeight: 0.45 }\\n  },\\n  tables: [[1.0, 1.3, 0.8, 0.8, true], [-1.7, 1.8, 0.9, 0.9, true], [-1.6, -0.8, 0.8, 0.8, false], [4.2, 1.3, 0.8, 0.8, true]],\\n  spots: {\\n    door: [3.8, 5.2], waiterHome: [2.85, -1.2], sideboard: [3.35, -1.2], passWaiter: [1.2, -1.66], passCook: [1.2, -2.95],\\n    cookStation: [1.2, -2.95], sommHome: [-2.5, -3.1], barTender: [-4.65, -0.5], dish: [4.1, -2.86], dropWaiter: [4.1, -1.56]\\n  }\\n};\\n\\nfunction buildRestaurant(root) {\\n  const planks = canvasTex(512, 512, (x, w, h) => {\\n    x.fillStyle = '#5e4029'; x.fillRect(0, 0, w, h);\\n    for (let r = 0; r < 8; r++) { const y = r * 64; x.fillStyle = `rgba(${90 + (r * 37) % 30},${60 + (r * 23) % 20},${36 + (r * 17) % 14},.55)`; x.fillRect(0, y, w, 62); x.fillStyle = 'rgba(20,12,6,.55)'; x.fillRect(0, y + 62, w, 2); const off = (r * 173) % 512; and: [id, 'R'], hidden: true };\\n    if (G.plate) { const sx = SEATX[G.seat], dir = sx > 0 ? -1 : 1; props['plate' + id] = { type: 'plate', at: [sx + dir * 0.32, 0.735, -4.4], yaw: 0 }; G.plateAt = [sx + dir * 0.32, -4.4]; G.plateTo = [sx + dir * 0.56, -4.4]; }\\n    while (t < D - 0.5) {\\n      const ev = G.glass ? [{ type: 'show', prop: 'glass' + id, at: 'grab' }, { type: 'hide', prop: 'glass' + id, at: 'release' }]\\n        : G.plate ? [{ type: 'place', prop: 'plate' + id, pos: [G.plateAt[0], 0.735, G.plateAt[1]], at: 0 }, { type: 'grab', hand: 'R', prop: 'plate' + id, at: 'grab' }, { type: 'release', hand: 'R', prop: 'plate' + id, at: 'release', surface: 0.735, put: G.plateTo }] : [];\\n      const dur = loop ? len * 2 : len;\\n      steps.push({ clip: G.clip, tempo, look: steps[0].look, ...(loop ? { dur } : {}), ev });\\n      t += dur;\\n      steps.push({ clip: 'guest.seatedIdle', until: Math.min(D, t + 1.2), look: steps[0].look }); t += 1.2;\\n    }\\n    steps.push({ clip: 'guest.seatedIdle', until: D, look: steps[0].look });\\n    actors[id] = { kind: 'guest', look: G.look, hm: G.hm, pos: [0, 0], steps };\\n  });\\n  actors.mira = { kind: 'staff', look: 'bartender', pos: [-0.9, -0.74], yaw: 0, steps: [{ clip: 'bar.wipe', until: D, face: 0 }] };\\n  actors.sara = { kind: 'staff', look: 'servitor', pos: [1.6, -3.25], yaw: -Math.PI / 2, steps: [{ clip: 'staff.idle', until: D, look: 'q8' }] };\\n  const moodOf = (clip) => C.CLIPS[clip].mood;\\n  return {\\n    set: 'winebar', roomOpts: { mood: 'helg' }, tempo, end: D, props, actors, effects: [], light: 'evening',\\n    anchors: Object.fromEntries(GESTURES.map((G, i) => ['q' + (i + 1), { actor: 'q' + (i + 1) }])),\\n    initialFaces: Object.fromEntries(GESTURES.map((G, i) => ['q' + (i + 1), moodOf(G.clip)])),\\n    beats: {\\n      cam: [{ t: 0, v: near(-1.6, -3.4, 12, 0.44) }],\\n      spot: [{ t: 0, at: null, k: 0 }],\\n      sym: GESTURES.map((G, i) => ({ t: 0, anchor: 'q' + (i + 1), mood: moodOf(G.clip), always: true })),\\n      face: [], meter: [{ t: 0, v: 0.5 }],\\n      chapters: GESTURES.map((G, i) => ({ t: 0, key: 'gest.' + G.clip, focus: 'q' + (i + 1), clip: G.clip }))\\n    }\\n  };\\n}\\n\\n// ---------- 4 · Ansiktena ----------\\n// Lounge A från södra sidan. Kameran börjar på raketens 11 m utan ansikten, glider in till 6,5 m (tänds mellan 9 och 7 m)\\n// och de fem uttrycken spelas i tur och ordning, med en gest var.\\nexport function faces() {\\n  const order = ['content', 'delighted', 'waiting', 'impatient', 'displeased'];\\n  const T0 = 5.6, STEP = 3.4, D = T0 + STEP * order.length + 0.6;\\n  const gestureFor = { content: ['guest.nodApprove', 'guest.leanCurious', 'guest.nodApprove'], delighted: ['guest.laugh', 'guest.laugh', 'guest.cheers'], waiting: ['guest.checkWatch', 'guest.seatedIdle', 'guest.checkWatch'], impatient: ['guest.waveWaiter', 'guest.checkWatch', 'guest.armsCrossed'], displeased: ['guest.armsCrossed', 'guest.armsCrossed', 'guest.armsCrossed'] };\\n  const ids = ['f1', 'f2', 'f3'], seats = ['loungeA1', 'loungeA2', 'loungeA3'], looks = [['medel', 1.0], ['social', 0.94], ['medel2', 1.02]];\\n  const props = { fg: { type: 'wineGlass', hand: ['f3', 'R'], hidden: true } };\\n  const actors = {};\\n  ids.forEach((id, i) => {\\n    const steps = [{ clip: 'guest.seatedIdle', until: T0 + i * 0.18, seat: seats[i], look: ids[(i + 1) % 3] }];\\n    order.forEach((m, k) => {\\n      const clip = gestureFor[m][i], t1 = T0 + STEP * (k + 1) + i * 0.18;\\n      const ev = clip === 'guest.cheers' ? [{ type: 'show', prop: 'fg', at: 'grab' }, { type: 'hide', prop: 'fg', at: 'release' }] : [];\\n      steps.push(clip === 'guest.armsCrossed' || clip === 'guest.seatedIdle' ? { clip, until: t1, look: 'sara' } : { clip, look: m === 'impatient' || m === 'waiting' ? 'sara' : ids[(i + 1) % 3], ev });\\n      steps.push({ clip: 'guest.seatedIdle', until: t1, look: ids[(i + 1) % 3] });\\n    });\\n    steps.push({ clip: 'guest.seatedIdle', until: D });\\n    actors[id] = { kind: 'guest', look: looks[i][0], hm: looks[i][1], pos: [0, 0], steps };\\n  });\\n  actors.sara = { kind: 'staff', look: 'servitor', pos: [1.2, 3.1], yaw: -Math.PI / 2, steps: [{ clip: 'staff.idle', until: D, look: 'f2' }] };\\n  actors.lb1 = seated('loungeB2', 'hog', 1.05, 'lb2', [idleTo(D, 'lb2')]);\\n  actors.lb2 = seated('loungeB3', 'kappa', 0.96, 'lb1', [{ clip: 'guest.gesture', until: D, look: 'lb1' }]);\\n  const V0 = SOUTH(-1.8, 4.3, 11, 0.5), V1 = { ...SOUTH(-1.8, 4.8, 6.5, 0.5), ty: 0.8, pitch: 0.6 };\\n  return {\\n    set: 'winebar', roomOpts: { mood: 'helg' }, tempo: 'normal', end: D, props, actors, effects: [], light: 'evening',\\n    anchors: { loungeA: [-1.8, 1.75, 5.0] },\\n    beats: {\\n      cam: [{ t: 0, v: V0 }, { t: 1.2, v: V0 }, { t: 5.0, v: V1, ease: 'inOutSine' }],\\n      spot: [{ t: 0, at: [-1.8, 4.6], k: 0.6 }],\\n      sym: order.map((m, k) => ({ t: T0 + STEP * k, anchor: 'loungeA', mood: m, always: true })),\\n      face: order.flatMap((m, k) => ids.map((who, i) => ({ t: T0 + STEP * k + i * 0.18, who, mood: m }))),\\n      meter: [{ t: 0, v: 0.62 }],\\n      chapters: [{ t: 0, key: 'face.far' }, { t: 1.2, key: 'face.in' }, ...order.map((m, k) => ({ t: T0 + STEP * k, key: 'face.' + m }))]\\n    }\\n  };\\n}\\n\\n// ---------- 5 · Symbolerna ----------\\n// Hela rummet från spelets kamera, med alla fem lägen på samma gång. light: 'evening' eller 'day'.\\nexport function symbols(light) {\\n  const D = 14;\\n  const plan = [\\n    ['loungeA1', 'medel', 'guest.laugh', 'delighted'], ['loungeA2', 'social', 'guest.gesture', 'delighted'], ['loungeA3', 'medel2', 'guest.lean', 'delighted'],\\n    ['loungeB1', 'hog', 'guest.nodApprove', 'content'], ['loungeB2', 'medel3', 'guest.seatedIdle', 'content'],\\n    ['twoA1', 'kappa', 'guest.checkWatch', 'waiting'], ['twoA2', 'rock', 'guest.seatedIdle', 'waiting'],\\n    ['twoB1', 'stickat', 'guest.waveWaiter', 'impatient'], ['twoB2', 'jacka', 'guest.checkWatch', 'impatient'],\\n    ['twoC1', 'student', 'guest.armsCrossed', 'displeased'], ['twoC2', 'medel', 'guest.armsCrossed', 'displeased'],\\n    ['bar1', 'medel3', 'guest.seatedIdle', 'content'], ['bar2', 'social', 'guest.gesture', 'content']\\n  ];\\n  const actors = {};\\n  plan.forEach(([seat, look, clip], i) => {\\n    const id = 's' + (i + 1), loop = clip === 'guest.armsCrossed' || clip === 'guest.gesture' || clip === 'guest.lean' || clip === 'guest.seatedIdle';\\n    const steps = [{ clip: 'guest.seatedIdle', until: 0.4 + (i % 4) * 0.5, seat }];\\n    if (loop) steps.push({ clip, until: D });\\n    else { for (let t = steps[0].until, n = 0; n < 4; n++) { steps.push({ clip, tempo: 'normal' }); steps.push({ clip: 'guest.seatedIdle', until: (t += 3.4) }); } steps.push({ clip: 'guest.seatedIdle', until: D }); }\\n    actors[id] = { kind: 'guest', look, hm: 0.94 + (i % 5) * 0.03, pos: [0, 0], steps };\\n  });\\n  actors.mira = { kind: 'staff', look: 'bartender', pos: [-0.9, -0.74], yaw: 0, steps: [{ clip: 'bar.wipe', until: D, face: 0 }] };\\n  actors.sara = { kind: 'staff', look: 'servitor', pos: [2.6, 2.0], yaw: -Math.PI / 2, steps: [{ clip: 'waiter.carryTray', path: [[2.0, -3.2], [-1.2, -3.25]], until: 8 }, { clip: 'staff.idle', until: D, look: 's8' }] };\\n  actors.per = { kind: 'staff', look: 'hovmastare', pos: [6.1, -0.55], yaw: Math.PI / 2, steps: [{ clip: 'staff.idle', until: D, face: Math.PI / 2 }] };\\n  const props = { tray: { type: 'tray', hand: ['sara', 'L'] } };\\n  return {\\n    set: 'winebar', roomOpts: { mood: light === 'day' ? 'tidig' : 'helg' }, tempo: 'normal', end: D, props, actors, effects: [], light,\\n    anchors: { loungeA: [-1.8, 1.75, 5.0], loungeB: [2.0, 1.75, 5.0], twoA: [-4.2, 1.6, -4.4], twoB: [-2.1, 1.6, -4.4], twoC: [0.0, 1.6, -4.4], bar: [-2.25, 2.05, 2.3] },\\n    initialFaces: Object.fromEntries(plan.map((p, i) => ['s' + (i + 1), p[3]])),\\n    beats: {\\n      cam: [{ t: 0, v: GAME }], spot: [{ t: 0, at: null, k: 0 }],\\n      sym: [['loungeA', 'delighted'], ['lounge  'mood.scene.symDay': { sv: 'Symbolerna i dagsljus', en: 'The symbols by daylight' },\n  'mood.group.consequence': { sv: 'Konsekvensögonblicket', en: 'The consequence moment' },\n  'mood.group.parts': { sv: 'Delarna', en: 'The parts' },\n  'mood.cam': { sv: 'Kamera', en: 'Camera' },\n  'mood.cam.script': { sv: 'Manusets', en: 'Scripted' },\n  'mood.cam.game': { sv: 'Spelets, 24 m', en: 'Game, 24 m' },\n  'mood.tempo': { sv: 'Tempo', en: 'Tempo' },\n  'mood.tempo.calm': { sv: 'Lugn', en: 'Calm' },\n  'mood.tempo.normal': { sv: 'Normal', en: 'Normal' },\n  'mood.tempo.stressed': { sv: 'Stressad', en: 'Stressed' },\n  'mood.size': { sv: 'Skärmstorlek', en: 'Screen size' },\n  'mood.play': { sv: 'Spela', en: 'Play' },\n  'mood.pause': { sv: 'Pausa', en: 'Pause' },\n  'mood.record': { sv: 'Spela in WebM', en: 'Record WebM' },\n  'mood.recording': { sv: 'Spelar in …', en: 'Recording …' },\n  'mood.distance': { sv: 'Kamerans avstånd', en: 'Camera distance' },\n  'mood.faces': { sv: 'Ansiktena', en: 'Faces' },\n  'mood.legend': { sv: 'Symbolerna, 24 px', en: 'The symbols, 24 px' },\n  'mood.faceRule': { sv: 'Ansiktena tonas in från 9 m och är fulla vid 7 m.', en: 'Faces fade in from 9 m and are full at 7 m.' },\n  'mood.focusHint': { sv: 'Välj en gest för att gå nära.', en: 'Pick a gesture to move in close.' },\n\n  'mood.ch.bday.ask': { sv: 'Frågan: sällskapet vill sjunga för Karin', en: 'The question: the party wants to sing for Karin' },\n  'mood.why.bday.ask': { sv: 'Raketens kamera på 13 m. Grannarna i lounge B äter, lounge A väntar på svaret.', en: 'The rocket camera at 13 m. The neighbours in lounge B are eating; lounge A waits for the answer.' },\n  'mood.ch.drunk.ask': { sv: 'Frågan: gästen vill ha ett glas till', en: 'The question: the guest wants another glass' },\n  'mood.why.drunk.ask': { sv: 'Södra vinkeln på 12 m, så att ansiktena vid baren och i lounge A syns när kameran går in.', en: 'The southern angle at 12 m, so the faces at the bar and in lounge A show when the camera moves in.' },\n  'mood.ch.cq.right': { sv: 'Svaret låses: rätt', en: 'The answer locks: right' },\n  'mood.why.cq.right': { sv: 'Kortet blir grönt och lyfter. Kameran står kvar medan spelaren ser det.', en: 'The card turns green and lifts. The camera holds while the player sees it.' },\n  'mood.ch.cq.wrong': { sv: 'Svaret låses: fel', en: 'The answer locks: wrong' },\n  'mood.why.cq.wrong': { sv: 'Kortet blir rött och skakar. Kameran står kvar lite längre.', en: 'The card turns red and shakes. The camera holds a little longer.' },\n  'mood.ch.cq.inRight': { sv: 'Kameran går in i en båge till 7 m', en: 'The camera arcs in to 7 m' },\n  'mood.why.cq.inRight': { sv: 'En mjuk båge och lite lägre, som lyftningen på kortet. Ansiktena tänds mellan 9 och 7 m.', en: 'A soft arc, slightly lower, like the card’s lift. Faces light up between 9 and 7 m.' },\n  'mood.ch.cq.inWrong': { sv: 'Kameran går rakt in till 7 m', en: 'The camera moves straight in to 7 m' },\n  'mood.why.cq.inWrong': { sv: 'Ingen båge och lite högre. Spelaren ser vad svaret ledde till.', en: 'No arc, slightly higher. The player sees what the answer led to.' },\n  'mood.ch.bday.gestRight': { sv: 'Sällskapet skrattar och skålar, grannarna lutar sig fram', en: 'The party laughs and toasts; the neighbours lean in' },\n  'mood.why.bday.gestRight': { sv: 'Elin bjuder grannarna på fördrinken, så de blir en del av festen i stället för att störas av den.', en: 'Elin brings the neighbours the aperitif, so they join the celebration instead of being disturbed by it.' },\n  'mood.ch.bday.gestWrong': { sv: 'Sällskapet sjunger, grannarna lägger armarna i kors', en: 'The party sings; the neighbours fold their arms' },\n  'mood.why.bday.gestWrong': { sv: 'Musiken går upp. Ett bord blir gladare och två bord blir missnöjda, så rummet sjunker.', en: 'The music goes up. One table gets happier and two tables get unhappy, so the room drops.' },\n  'mood.ch.drunk.gestRight': { sv: 'Grannarna vid baren nickar', en: 'The neighbours at the bar nod' },\n  'mood.why.drunk.gestRight': { sv: 'Mira pratar lugnt med gästen. De som såg det blir lugna, och lounge A tittar nyfiket.', en: 'Mira talks calmly with the guest. Those who saw it relax, and lounge A looks on with interest.' },\n  'mood.ch.drunk.gestWrong': { sv: 'Grannarna vid baren drar sig undan', en: 'The neighbours at the bar pull away' },\n  'mood.why.drunk.gestWrong': { sv: 'Mira häller upp ett glas till. Gästen är glad, men grannen skjuter undan tallriken och lounge A vill betala.', en: 'Mira pours another glass. The guest is happy, but a neighbour pushes the plate away and lounge A wants to pay.' },\n  'mood.ch.cq.symbol': { sv: 'Symbolerna över borden byts', en: 'The symbols over the tables change' },\n  'mood.why.cq.symbol': { sv: 'Bättre lyfter, sämre skakar. Ingen symbol pulserar.', en: 'Better lifts, worse shakes. No symbol pulses.' },\n  'mood.ch.cq.meter': { sv: 'Mätaren i HUD:en flyttar sig', en: 'The meter in the HUD moves' },\n  'mood.why.cq.meter': { sv: 'Alltid efter symbolerna, så att spelaren ser orsaken först. Det som förloras står kvar streckat en stund.', en: 'Always after the symbols, so the player sees the cause first. What is lost stays dashed for a moment.' },\n  'mood.ch.cq.close': { sv: 'Kameran går in till 5,5 m', en: 'The camera moves in to 5.5 m' },\n  'mood.why.cq.close': { sv: 'De sista 1,5 sekunderna, långsamt. Ansiktena blir större utan att huvudena förstoras.', en: 'The last 1.5 seconds, slowly. The faces get larger without enlarging the heads.' },\n  'mood.ch.cq.back': { sv: 'Tillbaka till 24 m', en: 'Back to 24 m' },\n  'mood.why.cq.back': { sv: 'Ansiktena slocknar på vägen ut. Symbolerna står kvar enligt sina regler.', en: 'The faces go out on the way back. The symbols stay according to their rules.' },\n  'mood.ch.face.far': { sv: 'Raketens avstånd, 11 m', en: 'Rocket distance, 11 m' },\n  'mood.why.face.far': { sv: 'Inga ansikten. Huvudet är för litet för ögon och mun.', en: 'No faces. ers': { sv: 'Glad. Glaset över huvudhöjd mot bordets mitt, ingen klunk.', en: 'Delighted. Glass above head height towards the middle of the table, no sip.' },\n  'mood.why.gest.guest.leanCurious': { sv: 'Nöjd. Underarmarna mot knäna och huvudet på sned.', en: 'Content. Forearms on the knees and head tilted.' },\n  'mood.why.gest.guest.nodApprove': { sv: 'Nöjd. Två långsamma nickar med öppen handflata.', en: 'Content. Two slow nods with an open palm.' },\n  'mood.why.gest.guest.armsCrossed': { sv: 'Missnöjd. Bålen bakåt och blicken bort, en suck per varv.', en: 'Displeased. Leaning back and looking away, a sigh each cycle.' },\n  'mood.why.gest.guest.pushPlate': { sv: 'Missnöjd. Rak arm som skjuter tallriken ifrån sig, sedan armarna i kors.', en: 'Displeased. A straight arm pushes the plate away, then the arms fold.' },\n  'mood.why.gest.guest.checkWatch': { sv: 'Väntar. Klockan, sedan blicken ut efter personalen.', en: 'Waiting. The watch, then a look out for the staff.' },\n  'mood.why.gest.guest.waveWaiter': { sv: 'Otålig. Armen rakt upp och halvvägs upp från sitsen.', en: 'Impatient. Arm straight up, half rising from the seat.' }\n};\n<\u002Fscript>\n<style>\n  html, body { margin: 0; background: #140d09; color: #f4e6cc; font-family: 'Figtree', system-ui, sans-serif; }\n  a { color: #f0cd82; } a:hover { color: #e8b93a; }\n  input[type=range] { accent-color: #e8b93a; }\n  button:focus-visible { outline: 2px solid #f0cd82; outline-offset: 2px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display: flex; height: 100vh; min-height: 480px; overflow: hidden; background: #140d09;\">\n  <div ref=\"{{ wrapRef }}\" style=\"flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 20px; box-sizing: border-box;\">\n    <div style=\"position: relative; width: {{ boxW }}px; height: {{ boxH }}px;\">\n      <div id=\"stage\" data-screen-label=\"Gästernas stämning\" style=\"position: absolute; left: 0; top: 0; width: {{ w }}px; height: {{ h }}px; transform: scale({{ scale }
