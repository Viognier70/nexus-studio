<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position: relative; width: 96px; height: 128px;">
  <div style="position: absolute; left: 12px; bottom: 8px; width: 72px; height: 26px; border-radius: 50%; background: rgba(32,30,29,0.18);"></div>
  <div style="position: absolute; left: 26px; bottom: 14px; width: 44px; height: 58px; background: {{ color }};"></div>
  <div style="position: absolute; left: 26px; bottom: 6px; width: 44px; height: 17px; border-radius: 50%; background: {{ color }};"></div>
  <div style="position: absolute; left: 26px; bottom: 64px; width: 44px; height: 17px; border-radius: 50%; background: {{ topColor }};"></div>
  <div style="position: absolute; left: 62px; bottom: 68px; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 16px solid var(--color-accent);"></div>
  <div style="position: absolute; left: 34px; bottom: 74px; width: 28px; height: 28px; border-radius: 50%; background: #c8b39a;"></div>
  <sc-if value="{{ isTray }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 60px; bottom: 46px; width: 40px; height: 14px; border-radius: 50%; background: #efeeed; border: 3px solid var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isStack }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 62px; bottom: 44px; width: 34px; height: 5px; background: var(--color-text);"></div>
    <div style="position: absolute; left: 62px; bottom: 51px; width: 34px; height: 5px; background: var(--color-text);"></div>
    <div style="position: absolute; left: 62px; bottom: 58px; width: 34px; height: 5px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isPan }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 58px; bottom: 44px; width: 34px; height: 12px; border-radius: 50%; background: var(--color-text);"></div>
    <div style="position: absolute; left: 88px; bottom: 48px; width: 20px; height: 4px; background: var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isShaker }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 66px; bottom: 46px; width: 16px; height: 30px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isMop }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 70px; bottom: 18px; width: 4px; height: 54px; background: var(--color-text); transform: rotate(14deg); transform-origin: bottom center;"></div>
    <div style="position: absolute; left: 58px; bottom: 12px; width: 38px; height: 12px; border-radius: 50%; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isGlass }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 68px; bottom: 50px; width: 12px; height: 22px; background: #efeeed; border: 3px solid var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isPad }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 64px; bottom: 44px; width: 24px; height: 30px; background: #efeeed; border: 3px solid var(--color-text);"></div>
    <div style="position: absolute; left: 64px; bottom: 68px; width: 24px; height: 6px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ alert }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 40px; bottom: 108px; width: 16px; height: 16px; background: var(--color-accent);"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:96,&quot;height&quot;:128},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#33383f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2a2f3a&quot;,&quot;#33383f&quot;,&quot;#3d3835&quot;,&quot;#4a4744&quot;]},&quot;prop&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;tray&quot;,&quot;stack&quot;,&quot;pan&quot;,&quot;shaker&quot;,&quot;mop&quot;,&quot;glass&quot;,&quot;pad&quot;]},&quot;alert&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.prop || 'none';
    const color = this.props.color || '#33383f';
    return {
      color,
      topColor: `color-mix(in srgb, ${color} 78%, #ffffff)`,
      isTray: p === 'tray',
      isStack: p === 'stack',
      isPan: p === 'pan',
      isShaker: p === 'shaker',
      isMop: p === 'mop',
      isGlass: p === 'glass',
      isPad: p === 'pad',
      alert: this.props.alert === true || this.props.alert === 'true',
    };
  }
}
</script>
</body>
</html>
