<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-fa2a5900-708d-4668-979a-71ad6a03542a/styles.css">
<script src="_ds/modernist-fa2a5900-708d-4668-979a-71ad6a03542a/_ds_bundle.js"></script>
</helmet>
<div style="position: relative; width: 96px; height: 128px;">
  <div style="position: absolute; left: 13px; bottom: 7px; width: 70px; height: 24px; border-radius: 50%; background: rgba(32,30,29,0.16);"></div>
  <div style="position: absolute; left: 27px; bottom: 5px; width: 42px; height: 16px; border-radius: 50%; background: {{ color }};"></div>
  <div style="position: absolute; left: 27px; bottom: 13px; width: 42px; height: 56px; background: {{ color }};"></div>
  <sc-if value="{{ hasApron }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 29px; bottom: 13px; width: 38px; height: 31px; background: #ddd8d0;"></div>
    <div style="position: absolute; left: 29px; bottom: 42px; width: 38px; height: 4px; background: #b3aca2;"></div>
  </sc-if>
  <sc-if value="{{ hasBelt }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 27px; bottom: 38px; width: 42px; height: 5px; background: var(--color-accent);"></div>
  </sc-if>
  <div style="position: absolute; left: 27px; bottom: 61px; width: 42px; height: 16px; border-radius: 50%; background: {{ topColor }};"></div>
  <div style="position: absolute; left: 62px; bottom: 65px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 17px solid var(--color-accent);"></div>
  <div style="position: absolute; left: 35px; bottom: 71px; width: 26px; height: 26px; border-radius: 50%; background: #c8b39a;"></div>

  <sc-if value="{{ isToque }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 36px; bottom: 91px; width: 24px; height: 22px; background: #efeeed;"></div>
    <div style="position: absolute; left: 34px; bottom: 88px; width: 28px; height: 6px; background: #efeeed;"></div>
  </sc-if>
  <sc-if value="{{ isCap }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 35px; bottom: 89px; width: 26px; height: 9px; background: var(--color-accent);"></div>
    <div style="position: absolute; left: 59px; bottom: 87px; width: 16px; height: 5px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isKerchief }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 35px; bottom: 88px; width: 26px; height: 8px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isVisor }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 35px; bottom: 89px; width: 26px; height: 5px; background: var(--color-text);"></div>
    <div style="position: absolute; left: 58px; bottom: 85px; width: 15px; height: 4px; background: var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isBun }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 35px; bottom: 89px; width: 26px; height: 7px; background: var(--color-text);"></div>
    <div style="position: absolute; left: 27px; bottom: 82px; width: 13px; height: 13px; border-radius: 50%; background: var(--color-text);"></div>
  </sc-if>

  <sc-if value="{{ isTray }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 60px; bottom: 44px; width: 40px; height: 13px; border-radius: 50%; background: #efeeed; border: 3px solid var(--color-text);"></div>
    <div style="position: absolute; left: 70px; bottom: 52px; width: 12px; height: 9px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isStack }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 62px; bottom: 42px; width: 33px; height: 5px; background: var(--color-text);"></div>
    <div style="position: absolute; left: 62px; bottom: 49px; width: 33px; height: 5px; background: var(--color-text);"></div>
    <div style="position: absolute; left: 62px; bottom: 56px; width: 33px; height: 5px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isPan }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 57px; bottom: 43px; width: 33px; height: 11px; border-radius: 50%; background: var(--color-text);"></div>
    <div style="position: absolute; left: 86px; bottom: 47px; width: 19px; height: 4px; background: var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isShaker }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 66px; bottom: 45px; width: 15px; height: 28px; background: var(--color-accent);"></div>
    <div style="position: absolute; left: 64px; bottom: 71px; width: 19px; height: 5px; background: var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isMop }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 70px; bottom: 18px; width: 4px; height: 52px; background: var(--color-text); transform: rotate(14deg); transform-origin: bottom center;"></div>
    <div style="position: absolute; left: 58px; bottom: 11px; width: 37px; height: 11px; border-radius: 50%; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isGlass }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 67px; bottom: 48px; width: 12px; height: 21px; background: #efeeed; border: 3px solid var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isPad }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 63px; bottom: 43px; width: 23px; height: 28px; background: #efeeed; border: 3px solid var(--color-text);"></div>
    <div style="position: absolute; left: 63px; bottom: 66px; width: 23px; height: 5px; background: var(--color-accent);"></div>
  </sc-if>
  <sc-if value="{{ isCrate }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 58px; bottom: 34px; width: 38px; height: 27px; background: #a08a6c; border: 3px solid var(--color-text);"></div>
    <div style="position: absolute; left: 58px; bottom: 45px; width: 38px; height: 4px; background: var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isCup }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 66px; bottom: 47px; width: 17px; height: 14px; background: #efeeed; border: 3px solid var(--color-text);"></div>
    <div style="position: absolute; left: 85px; bottom: 51px; width: 7px; height: 7px; border: 3px solid var(--color-text);"></div>
  </sc-if>
  <sc-if value="{{ isTowel }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 64px; bottom: 40px; width: 24px; height: 16px; background: #efeeed; border: 3px solid var(--color-text);"></div>
  </sc-if>

  <sc-if value="{{ alert }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 41px; bottom: 116px; width: 14px; height: 14px; background: var(--color-accent);"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:96,&quot;height&quot;:128},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#33383f&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2a2f3a&quot;,&quot;#33383f&quot;,&quot;#3d3835&quot;,&quot;#4a4744&quot;]},&quot;prop&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;tray&quot;,&quot;stack&quot;,&quot;pan&quot;,&quot;shaker&quot;,&quot;mop&quot;,&quot;glass&quot;,&quot;pad&quot;,&quot;crate&quot;,&quot;cup&quot;,&quot;towel&quot;]},&quot;hat&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;toque&quot;,&quot;cap&quot;,&quot;kerchief&quot;,&quot;visor&quot;,&quot;bun&quot;]},&quot;apron&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;belt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;alert&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const PROPS = ['tray', 'stack', 'pan', 'shaker', 'mop', 'glass', 'pad', 'crate', 'cup', 'towel'];
const HATS = ['toque', 'cap', 'kerchief', 'visor', 'bun'];

class Component extends DCLogic {
  renderVals() {
    const p = this.props.prop || 'none';
    const hat = this.props.hat || 'none';
    const color = this.props.color || '#33383f';
    const out = {
      color,
      topColor: `color-mix(in srgb, ${color} 76%, #ffffff)`,
      hasApron: this.props.apron === true || this.props.apron === 'true',
      hasBelt: this.props.belt === true || this.props.belt === 'true',
      alert: this.props.alert === true || this.props.alert === 'true',
    };
    PROPS.forEach((k) => { out['is' + k[0].toUpperCase() + k.slice(1)] = p === k; });
    HATS.forEach((k) => { out['is' + k[0].toUpperCase() + k.slice(1)] = hat === k; });
    return out;
  }
}
</script>
</body>
</html>
